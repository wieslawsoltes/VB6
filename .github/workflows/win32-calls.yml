name: Win32 call arguments
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: win32-calls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-execution:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: node --test tests/win32-calls.test.mjs
      - run: node tools/win32-call-fixtures.mjs
      - name: Execute typed defaults, named arguments and reference temporaries
        shell: pwsh
        run: ./tools/test-win32-calls.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-call-execution
          path: validation/calls/
          retention-days: 14
  browser-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: node tools/win32-fixtures.mjs
      - run: node tools/win32-numeric-fixtures.mjs
      - run: node tools/win32-currency-fixtures.mjs
      - run: node tools/win32-bindings-fixtures.mjs
      - run: node tools/win32-call-fixtures.mjs
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify IDE, SDK and worker call exports against Node output
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tools/browser-native-build-tests.py
      - run: git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calls-browser-export
          path: validation/browser-native/
          retention-days: 14
