name: Diagnose WebKit range orientation
on:
  push:
    branches: [automation/macos26-object-staging]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/automation/macos26-object-staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps webkit
      - run: python .github/macos26-range-diagnostic.py
      - name: Retain versioned compatibility libraries for local engine reproduction
        run: tar -czhf reports/webkit-compat-libraries.tar.gz -C /usr/lib/x86_64-linux-gnu libicudata.so.74 libicui18n.so.74 libicuuc.so.74 libwoff2dec.so.1.0.2 libwoff2common.so.1.0.2 libjpeg.so.8
      - uses: actions/upload-artifact@v4
        with:
          name: webkit-range-diagnostic
          path: reports/range-diagnostic.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: webkit-debug-libraries
          path: reports/webkit-compat-libraries.tar.gz
          compression-level: 0
          retention-days: 1
