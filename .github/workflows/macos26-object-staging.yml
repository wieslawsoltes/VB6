name: Diagnose WebKit range orientation
on:
  push:
    branches: [automation/macos26-object-staging]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/automation/macos26-object-staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps webkit
      - run: python .github/macos26-range-diagnostic.py
      - name: Archive installed engine for reproducible local debugging
        run: tar -czf reports/webkit-2227.tar.gz -C "$HOME/.cache/ms-playwright" webkit-2227
      - uses: actions/upload-artifact@v4
        with:
          name: webkit-range-diagnostic
          path: reports/range-diagnostic.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: webkit-debug-engine
          path: reports/webkit-2227.tar.gz
          compression-level: 0
          retention-days: 1
