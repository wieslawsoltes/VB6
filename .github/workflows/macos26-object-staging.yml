name: Stage reviewed macOS WinUI integration
on:
  push:
    branches: [automation/macos26-object-staging]
permissions: {}
jobs:
  objects:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/automation/macos26-object-staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct exact reviewed source
        run: node .github/macos26-stage-objects.mjs prepare
      - name: Verify all reviewed fingerprints and shared paint contracts
        run: |
          node tools/build.mjs
          node --test tests/theme-paint-composition.test.mjs tests/macos-theme-fidelity.test.mjs tests/winui-theme.test.mjs tests/x11-theme.test.mjs tests/range-orientation.test.mjs
      - name: Publish immutable checked objects without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/macos26-stage-objects.mjs publish
      - uses: actions/upload-artifact@v4
        with:
          name: macos26-reviewed-object-shas
          path: reports/macos26-reviewed-object-shas.json
          retention-days: 7
