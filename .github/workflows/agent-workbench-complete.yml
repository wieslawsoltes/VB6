name: Complete workbench and recovery integration
on:
  push:
    branches: [feat/agent-change-review-queue]
    paths: [.github/workflows/agent-workbench-complete.yml]
permissions:
  contents: write
concurrency:
  group: agent-workbench-complete
  cancel-in-progress: true
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/agent-change-review-queue'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify both reviewed input trees and merge current main
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 44d0faa5587fe948a2ab90bec39a3e8e76a58133
          test "$(git rev-parse 44d0faa5587fe948a2ab90bec39a3e8e76a58133^{tree})" = e7b71ff6fec8345a0015b9a8408cec9ff7a44582
          test "$(git rev-parse bd4f9cfbb753cf18cdc78d89744f31789a6e5b28^{tree})" = bb8d0f5ca8ff5356e6f2833b8ac1002f823220a1
          git rev-parse HEAD > publication-base.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(['git','merge','--no-commit','--no-ff','bd4f9cfbb753cf18cdc78d89744f31789a6e5b28'])
          if result.returncode:
              conflicts=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
              allowed={'README.md','docs/coding-agents.md','src/agents/agent.js','src/agents/studio.js','tools/coding-agents-browser-tests.py','dist/VB6-Studio-Web.html','dist/studio.js'}
              assert result.returncode==1 and conflicts and conflicts <= allowed, sorted(conflicts)
          PY
      - name: Apply locally reproduced source combination and interaction regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, ast
          class GitFile:
            def __init__(self, rev, path): self.rev, self.path = rev, path
            def read_bytes(self): return subprocess.check_output(['git', 'show', self.rev + ':' + self.path])
            def read_text(self): return self.read_bytes().decode('utf-8')
          class GitSource:
            def __init__(self, rev): self.rev = rev
            def __truediv__(self, path): return GitFile(self.rev, path)
          HEAD=GitSource('44d0faa5587fe948a2ab90bec39a3e8e76a58133')
          MAIN=GitSource('bd4f9cfbb753cf18cdc78d89744f31789a6e5b28')
          DEST=Path.cwd()
          copy_paths=['desktop/smoke.cjs','docs/CODING-AGENT-WORKBENCH.md','src/agents/agents.css','src/agents/conversations.js','src/agents/changes.js','src/agents/followups.js','src/agents/workbench-view.js','tests/coding-agents-workbench.test.mjs','tests/native-smoke-harness.test.mjs']
          for rel in copy_paths:
           p=DEST/rel;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes((HEAD/rel).read_bytes())
          def replace(text,old,new):
           assert text.count(old)==1, ('Replacement not unique',old[:120],text.count(old))
           return text.replace(old,new,1)
          for rel in ['README.md','docs/coding-agents.md']:
           heading='\n### Local change review and follow-ups\n'
           main=(MAIN/rel).read_text();head=(HEAD/rel).read_text()
           assert heading not in main and head.count(heading)==1
           (DEST/rel).write_text(main+heading+head.split(heading,1)[1])
          rel='src/agents/agent.js';s=(MAIN/rel).read_text()
          s=replace(s,'      const catalog = toolCatalog(tools);','      const catalog = toolCatalog(tools);\n      if (!compactOnly) this.emit(\'run-start\', \'Run started with freshly reviewed permissions.\');')
          (DEST/rel).write_text(s)
          rel='src/agents/studio.js';s=(MAIN/rel).read_text();h=(HEAD/rel).read_text()
          s=replace(s,"import {AgentThreadView} from './thread-view.js';","import {AgentThreadView} from './thread-view.js';\nimport {AgentWorkbenchView} from './workbench-view.js';")
          s=replace(s,'defaultLimits: loadAgentLimits(),\n','defaultLimits: loadAgentLimits(), getReviewProject: () => ide.project,\n')
          s=replace(s,"    this.root = el('div', {class: 'agent-panel'});","    this.root = el('div', {class: 'agent-panel'});\n    this.workbench = new AgentWorkbenchView(this, cancellableDialog);")
          s=replace(s,"        {id: 'permissions', label: 'Permissions', node: this.permissionsPage()}","        {id: 'changes', label: 'Changes', node: this.workbench.changesPage()}, {id: 'queue', label: 'Queue', node: this.workbench.queuePage()},\n        {id: 'permissions', label: 'Permissions', node: this.permissionsPage()}")
          s=replace(s,"{label: 'Coding agent pages'}","{label: 'Coding agent pages', onSelect: id => { if (id === 'changes') this.workbench.refreshChanges(); }}")
          s=replace(s,"    this.log = this.threadView.scroller;","    this.log = this.threadView.scroller;\n    this.queueDraftButton = button('Queue message', () => this.workbench.queueDraft());\n    this.queueBadge = button('Queued: 0', () => this.pages.select('queue'));")
          s=replace(s,"this.sendButton, this.composerStop,\n","this.sendButton, this.composerStop, this.queueDraftButton, this.queueBadge,\n")
          s=replace(s," — previous project session; start a new task.'); this.refresh();"," — previous project session; start a new task.'); this.refresh(); this.workbench.refreshChanges();")
          s=replace(s,'  async start(continuation = false, compactOnly = false) {\n    if (!continuation && this.prompt.value.trim() === \'/compact\') compactOnly = true;',"  async start(continuation = false, compactOnly = false, queuedId = null) {\n    // A draft /compact command must never replace a separately selected queue item.\n    if (!continuation && !queuedId && this.prompt.value.trim() === '/compact') compactOnly = true;")
          s=replace(s,'      const provider = this.provider.value, model = modelId(this.model.value), prompt = this.prompt.value, limits = this.readLimits();',"      const task = this.api.conversations.active, queued = queuedId ? task.followups.get(queuedId) : null;\n      if (queued && (continuation || compactOnly)) throw new Error('Queued messages require a separately confirmed task run.');\n      if (queued && (!['new', 'completed'].includes(task.agent.state) || !task.agent.matchesWorkspace() || !task.followups.inCurrentWorkspace(queued))) throw new Error('Resume or replace the paused/failed task before sending a queued message.');\n      const provider = this.provider.value, model = modelId(this.model.value), prompt = queued ? queued.text : this.prompt.value, limits = this.readLimits();")
          ql=[l for l in h.splitlines() if 'Send the selected queued message to task' in l][0]
          s=replace(s,"        ...(compactOnly ? [el('p', {},",ql+"\n        ...(compactOnly ? [el('p', {},")
          s=replace(s,"      if (project !== this.ide.project) throw new Error('Project changed; review the current project again.');","      if (task !== this.api.conversations.active || queued && (!task.followups.matches(queued) || !task.followups.inCurrentWorkspace(queued))) throw new Error('Task or queued message changed during confirmation. Review it again.');\n      if (project !== this.ide.project) throw new Error('Project changed; review the current project again.');")
          s=replace(s,'      const run = compactOnly ?', '      this.sendingQueued = queued ? {task, item: queued} : null;\n      const run = compactOnly ?')
          s=replace(s,"    finally { if (this.pending === setup) this.pending = null; this.refresh(); }","    finally { this.sendingQueued = null; if (this.pending === setup) this.pending = null; this.refresh(); }")
          start=h.index("    if (event.type === 'user') {");end=h.index("    if (!['delta'",start)
          s=replace(s,"    if (event.type === 'user') { this.prompt.value = ''; this.api.conversations.active.draft = ''; }\n",h[start:end])
          s=replace(s,'    if (render) this.render();\n','    if (render) this.render();\n    this.workbench.update();\n')
          (DEST/rel).write_text(s)
          rel='src/agents/workbench-view.js';s=(DEST/rel).read_text();s=replace(s,'this.panel.start(false, this.queueList.value)','this.panel.start(false, false, this.queueList.value)');(DEST/rel).write_text(s)
          rel='tools/coding-agents-browser-tests.py';m=(MAIN/rel).read_text();h=(HEAD/rel).read_text()
          def functions(text):
           lines=text.splitlines(True)
           return {n.name:''.join(lines[n.lineno-1:n.end_lineno]) for n in ast.parse(text).body if isinstance(n,(ast.FunctionDef,ast.ClassDef))}
          mf,hf=functions(m),functions(h)
          extra=[name for name in hf if name not in mf]
          for n in mf.keys()&hf.keys():assert mf[n]==hf[n] or n=='request_retry',n
          s=replace(m,'def case(browser,mode,name,fn):','\n\n'.join(hf[n] for n in extra)+'\n\n\ndef case(browser,mode,name,fn):')
          s=replace(s,"                case(browser,mode,provider+'-output-recovery',lambda page,mode,provider=provider:output_recovery(page,mode,provider))", "                case(browser,mode,provider+'-output-recovery',lambda page,mode,provider=provider:output_recovery(page,mode,provider))\n                case(browser,mode,provider+'-queued-followups',lambda page,mode,provider=provider:queued_followups(page,mode,provider))")
          node=next(n for n in ast.walk(ast.parse(h)) if isinstance(n,ast.For) and isinstance(n.target,ast.Tuple) and [getattr(e,'id',None) for e in n.target.elts]==['name','fn'])
          items=[]
          for item in node.iter.elts:
           name,fn=item.elts
           if isinstance(fn,ast.Name) and fn.id in extra:items.append(ast.get_source_segment(h,item))
          s=replace(s,"for name,fn in [('automatic-retry',automatic_retry)","for name,fn in ["+','.join(items)+",('automatic-retry',automatic_retry)")
          compile(s,rel,'exec');(DEST/rel).write_text(s)
          print('Integrated browser additions:', extra)
          import base64,lzma,hashlib
          raw=base64.b64decode('',validate=True)
          assert hashlib.sha256(raw).hexdigest()=='ac626170877fba62121ff8bb9b0b7fd9727ef58b45decb46bec429db5bc8f2df'
          patch=lzma.decompress(raw)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          compile((DEST/'tools/coding-agents-browser-tests.py').read_text(),'coding-agents-browser-tests.py','exec')
          PY
      - name: Regenerate combined distributions
        shell: bash
        run: npm run build | tee build.log
      - name: Verify exact locally tested product tree
        shell: bash
        run: |
          git rm -- .github/workflows/agent-workbench-complete.yml
          git add -- README.md desktop/smoke.cjs dist docs src tests tools/coding-agents-browser-tests.py
          git diff --cached --check
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(git write-tree)" = c20539d3edea72e54f470913e2c9fdd5760d6cbe
      - name: Full suite and agent integration tests
        shell: bash
        run: |
          node --check dist/studio.js
          npm test | tee tests.log
          npm run test:agents | tee agents.log
      - name: Publish tested integration without temporary workflow
        shell: bash
        run: |
          git commit -m 'feat(agents): finish workbench review and queues alongside context recovery'
          test "$(git ls-remote origin refs/heads/feat/agent-change-review-queue | cut -f1)" = "$(cat publication-base.txt)"
          git push origin HEAD:feat/agent-change-review-queue
          git rev-parse HEAD > head.txt
          git rev-parse HEAD^{tree} > tree.txt
          git ls-files -z | xargs -0 sha256sum > tracked-SHA256SUMS.txt
          git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-recovery-integrated
          path: |
            build.log
            tests.log
            agents.log
            head.txt
            tree.txt
            tracked-SHA256SUMS.txt
            source.tar.gz
          retention-days: 7
