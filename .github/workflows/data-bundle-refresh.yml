name: Refresh data feature bundles
on:
  push:
    branches: [feature/data-sources]
    paths: ['.github/workflows/data-bundle-refresh.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate source
        run: |
          set -euo pipefail
          npm run build
          npm test
      - name: Commit generated bundles only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/data-sources | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          if ! git diff --cached --quiet; then
            git commit -m 'build(data): refresh distributions with Data Link Properties checkbox fix'
            git push origin HEAD:refs/heads/feature/data-sources
          fi
      - name: Capture exact validated sources
        run: |
          mkdir -p /tmp/data-bundle-result
          git rev-parse HEAD > /tmp/data-bundle-result/head.txt
          git archive HEAD | gzip > /tmp/data-bundle-result/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: data-bundle-result
          path: /tmp/data-bundle-result
          retention-days: 7
