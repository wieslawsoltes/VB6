name: Publish verified agent recovery source
on:
  push:
    branches: [fix/agent-limit-recovery-reading-state]
permissions:
  contents: write
concurrency:
  group: agent-recovery-publication
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/fix/agent-limit-recovery-reading-state'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply immutable tested source patch over reviewed main
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          base = '5e9a3191ff04d00b13e4f100c48e219a836b7a4b'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == base
          scaffolding = {'.github/workflows/agent-recovery-prepare.yml'} | {'tools/.agent-recovery.part' + str(i) for i in range(3)}
          assert set(subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()) == scaffolding
          data = base64.b64decode(''.join(Path('tools/.agent-recovery.part' + str(i)).read_text() for i in range(3)), validate=True)
          assert hashlib.sha256(data).hexdigest() == 'ddccc3bce7805aeee52f054ab2353dd4b4da3509468dccde89da6dfd3a98f1ac'
          patch = lzma.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == '9acf6b64ee9f50e7926db0458a6ba868fae9374b2c611b6b6bcb4ec9749896f4'
          source = {'docs/CODING-AGENT-THREADS.md', 'docs/coding-agents.md', 'src/agents/agent.js', 'src/agents/agents.css', 'src/agents/providers.js', 'src/agents/studio.js', 'src/agents/thread-view.js', 'tests/coding-agents-recovery.test.mjs', 'tests/coding-agents-tasks.test.mjs', 'tests/coding-agents.test.mjs', 'tools/coding-agents-browser-tests.py'}
          assert not subprocess.check_output(['git', 'diff', '--name-only', 'f4ee8d47bed69ae26b65d20637b8f5f8da13d815', base, '--', *sorted(source)], text=True).strip()
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          assert set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()) == source
          PY
      - name: Rebuild the combined current application
        shell: bash
        run: |
          npm run build | tee agent-recovery-build.log
          node --check dist/studio.js
      - name: Agent recovery, protocol, security and relay regressions
        shell: bash
        run: npm run test:agents | tee agent-recovery-tests.log
      - name: Complete repository suite including current Win32 work
        shell: bash
        run: npm test | tee agent-recovery-full-tests.log
      - name: Remove preparation files and verify the exact publication diff
        shell: bash
        run: |
          git add -- dist/VB6-Studio-Web.html dist/studio.js dist/studio.css
          git rm -- .github/workflows/agent-recovery-prepare.yml tools/.agent-recovery.part0 tools/.agent-recovery.part1 tools/.agent-recovery.part2
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          allowed = {'docs/CODING-AGENT-THREADS.md', 'docs/coding-agents.md', 'src/agents/agent.js', 'src/agents/agents.css', 'src/agents/providers.js', 'src/agents/studio.js', 'src/agents/thread-view.js', 'tests/coding-agents-recovery.test.mjs', 'tests/coding-agents-tasks.test.mjs', 'tests/coding-agents.test.mjs', 'tools/coding-agents-browser-tests.py', 'dist/VB6-Studio-Web.html', 'dist/studio.js', 'dist/studio.css'}
          assert set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', '5e9a3191ff04d00b13e4f100c48e219a836b7a4b'], text=True).splitlines()) == allowed
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          PY
          npm run build
          git diff --exit-code
      - name: Publish tested source and generated bundles without rewriting history
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(agents): recover session limits safely and retain long-thread reading state'
          git push origin HEAD:fix/agent-limit-recovery-reading-state
          git rev-parse HEAD > head.txt
          git rev-parse HEAD^{tree} > tree.txt
          git ls-files -z | xargs -0 sha256sum > tracked-SHA256SUMS.txt
          git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-recovery-source-validation
          path: |
            agent-recovery-build.log
            agent-recovery-tests.log
            agent-recovery-full-tests.log
            head.txt
            tree.txt
            tracked-SHA256SUMS.txt
            source.tar.gz
          retention-days: 7
