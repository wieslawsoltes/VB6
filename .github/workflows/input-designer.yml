name: Input and designer regressions
on:
  pull_request:
  push:
    branches: [main, 'fix/form-keyboard-mouse-input']
permissions:
  contents: read
concurrency:
  group: input-designer-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: node --test tests/runtime-input*.test.mjs
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Reported input and designer regressions
        env:
          VB6_BROWSER: ${{ matrix.browser }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/input
          python tools/browser-designer-selection.py 2>&1 | tee artifacts/input/designer.log
          python tools/browser-editor-control-list.py 2>&1 | tee artifacts/input/control-list.log
          python tools/browser-editor-event-selection.py 2>&1 | tee artifacts/input/event-selection.log
          python tools/browser-input-diagnostics.py 2>&1 | tee artifacts/input/runtime-input.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-designer-${{ matrix.browser }}
          path: artifacts/input/
          if-no-files-found: ignore
          retention-days: 7
