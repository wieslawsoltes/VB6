name: IntelliSense
on:
  push:
    branches: [feature/classic-vb6-intellisense]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/intellisense.yml'
permissions:
  contents: read
concurrency:
  group: intellisense-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and unit tests
        run: npm run build && npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser dependencies
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: IntelliSense browser regression
        run: |
          if test -f tools/browser-intellisense-tests.py; then
            python tools/browser-intellisense-tests.py
          fi
      - name: Reproducible source snapshot
        if: always()
        run: git archive --format=zip --output=intellisense-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intellisense-validation
          path: |
            intellisense-source.zip
            validation/intellisense*
          retention-days: 7
