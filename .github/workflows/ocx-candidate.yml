name: OCX candidate validation
on:
  push:
    branches: [feat/ocx-hosting-lifecycle]
permissions:
  contents: read
concurrency:
  group: ocx-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact source payloads
        if: hashFiles('.ocx-apply.py') != ''
        run: python .ocx-apply.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocx-transport-diagnostics
          include-hidden-files: true
          path: |
            .ocx-*
  native:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    env:
      VB6_COM_ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact source candidate
        if: hashFiles('.ocx-apply.py') != ''
        run: python .ocx-apply.py
      - run: node tools/interop/test-native.mjs
      - run: node tools/interop/test-activex.mjs
      - run: node tools/interop/test-ocx.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocx-candidate-${{ matrix.architecture }}
          path: reports/native-interop
  publish:
    needs: native
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/ocx-hosting-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize checked source
        if: hashFiles('.ocx-apply.py') != ''
        run: |
          python .ocx-apply.py
          # GITHUB_TOKEN has no workflows permission. Workflow edits are applied
          # separately with the authorized connector, not with a stronger token.
          git restore .github/workflows
          rm -f .github/workflows/ocx-controls.yml
          rm .ocx-candidate.1 .ocx-candidate.2 .ocx-candidate.3 .ocx-designer.1 .ocx-designer.2 .ocx-repair.patch .ocx-apply.py
      - run: npm run build
      - run: npm test
      - name: Commit source and record reproducible tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'feat(ocx): native events, licensing and classic designer control integration'
          git bundle create ocx-publication.bundle HEAD
          git rev-parse HEAD HEAD^{tree} > ocx-publication.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ocx-publication
          path: |
            ocx-publication.bundle
            ocx-publication.txt
      - name: Push source without rewriting branch history
        run: git push origin HEAD:refs/heads/feat/ocx-hosting-lifecycle
