name: Refresh runtime compatibility with agent recovery
on:
  push:
    branches: [feat/variant-scalar-compatibility]
    paths: ['.github/workflows/compatibility-agent-refresh.yml']
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/variant-scalar-compatibility'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge pinned agent recovery source without losing runtime work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          git=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          feature='a134014f24bea73f98a566b6d5dce05f854f3562'
          main='f905988a06004cb60f404d2bddeecc1318c361d8'
          assert git('diff','--name-only',feature,'HEAD')=='.github/workflows/compatibility-agent-refresh.yml'
          assert git('merge-base',feature,main)=='5e9a3191ff04d00b13e4f100c48e219a836b7a4b'
          result=subprocess.run(['git','merge','--no-ff','--no-commit',main]);assert result.returncode in (0,1)
          conflicts=git('diff','--name-only','--diff-filter=U').splitlines()
          assert set(conflicts)<={'dist/VB6-Studio-Web.html','dist/studio.js'},conflicts
          if conflicts:
              subprocess.run(['git','checkout','--ours','--',*conflicts],check=True)
              subprocess.run(['git','add','--',*conflicts],check=True)
          for path in ('src/agents','tests/coding-agents-recovery.test.mjs','tools/coding-agents-browser-tests.py'):
              assert not git('diff','--cached','--name-only',main,'--',path),path
          for path in ('src/runtime','src/language','tools/interop','packages/win32-browser'):
              assert not git('diff','--cached','--name-only',feature,'--',path),path
          PY
      - name: Rebuild and run all Node regressions
        run: |
          set -o pipefail
          mkdir -p compatibility-agent-refresh
          npm run build 2>&1 | tee compatibility-agent-refresh/build.log
          npm test 2>&1 | tee compatibility-agent-refresh/node.log
          git add -- dist examples src/exporter/runtime-payload.js src/editor/diagnostics-payload.js
          git diff --cached --check
          git commit -m 'Merge agent stream recovery and regenerate final runtime compatibility bundles'
          npm run build
          git diff --exit-code -- dist examples src/exporter/runtime-payload.js src/editor/diagnostics-payload.js
      - name: Publish only this feature branch without forcing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/compat-askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token ;; *) printf '%s\n' "$GH_TOKEN" ;; esac
          SH
          chmod 700 "$RUNNER_TEMP/compat-askpass"
          trap 'rm -f "$RUNNER_TEMP/compat-askpass"' EXIT
          GIT_ASKPASS="$RUNNER_TEMP/compat-askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/feat/variant-scalar-compatibility
      - name: Preserve exact final source and logs for independent verification
        if: always()
        run: |
          mkdir -p compatibility-agent-refresh
          git rev-parse HEAD > compatibility-agent-refresh/head.txt
          git status --porcelain > compatibility-agent-refresh/status.txt
          git diff --cached > compatibility-agent-refresh/staged.diff
          git bundle create compatibility-agent-refresh/repository.bundle HEAD --all
          git bundle verify compatibility-agent-refresh/repository.bundle
          sha256sum compatibility-agent-refresh/repository.bundle > compatibility-agent-refresh/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-agent-refresh
          path: compatibility-agent-refresh/
          retention-days: 7
