name: Issue 39 guarded final integration
on:
  push:
    branches: [fix/issue-39-visual-fidelity]
    paths: [.github/workflows/issue39-integrate-final.yml]
permissions:
  contents: write
concurrency:
  group: issue39-guarded-final-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/fix/issue-39-visual-fidelity'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REVIEWED_BASE: ebb25c12f587c0676fe4231ba401d50b78b096dc
      MAIN_SHA: 72dae4fa89e165f6f0dc0ba0aad5cb7615508ea3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge reviewed main and regenerate only known derived conflicts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue39-integration
          git merge-base --is-ancestor "$REVIEWED_BASE" HEAD
          git fetch origin main fix/issue-39-visual-fidelity
          test "$(git rev-parse origin/fix/issue-39-visual-fidelity)" = "$GITHUB_SHA"
          git cat-file -e "$MAIN_SHA^{commit}"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          printf 'PR head: %s\nMain input: %s\n' "$GITHUB_SHA" "$MAIN_SHA" | tee /tmp/issue39-integration/inputs.txt
          if ! git merge --no-commit --no-ff "$MAIN_SHA"; then
            git diff --name-only --diff-filter=U | tee /tmp/issue39-integration/conflicts.txt
            test -s /tmp/issue39-integration/conflicts.txt
            git diff --cc > /tmp/issue39-integration/conflicts.diff
            python - <<'PY'
          import subprocess
          paths = list(filter(None, subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U', '-z']).decode().split('\0')))
          generated = {'src/exporter/runtime-payload.js', 'src/editor/diagnostics-payload.js'}
          handwritten = [p for p in paths if not (p.startswith('dist/') or p.startswith('packages/win32-browser/dist/') or p in generated)]
          if handwritten:
              raise SystemExit('Handwritten conflicts require review; no publication: ' + ', '.join(handwritten))
          for path in paths:
              subprocess.run(['git', 'checkout', '--ours', '--', path], check=True)
              subprocess.run(['git', 'add', '--', path], check=True)
          PY
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git apply --check tools/issue39-close-race.patch
          git apply tools/issue39-close-race.patch
          git rm tools/issue39-close-race.patch
          git add tools/browser-windows-tests.py .github/workflows/issue39.yml
      - name: Build combined sources, run the complete Node suite, and verify reproducibility
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/issue39-integration/build.log
          npm test 2>&1 | tee /tmp/issue39-integration/node-tests.log
          git add dist packages/win32-browser/dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples src/theme/palette.css
          git diff --cached --check
          npm run build
          git diff --exit-code
      - name: Publish only the validated integration to this PR branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/issue-39-visual-fidelity
          test "$(git rev-parse origin/fix/issue-39-visual-fidelity)" = "$GITHUB_SHA"
          git commit -m 'Merge current main, rebuild issue 39 distributions and fix popup-close event synchronization'
          git push origin HEAD:refs/heads/fix/issue-39-visual-fidelity
          git rev-parse HEAD | tee /tmp/issue39-integration/published-sha.txt
      - name: Record exact sources and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/issue39-integration
          git status --short > /tmp/issue39-integration/git-status.txt
          git log -8 --oneline > /tmp/issue39-integration/history.txt
          git ls-tree -r HEAD > /tmp/issue39-integration/tree.txt
          git archive --format=zip HEAD > /tmp/issue39-integration/source.zip
          git archive --format=zip "$MAIN_SHA" > /tmp/issue39-integration/main-source.zip
          git diff > /tmp/issue39-integration/unstaged.diff
          git diff --cached > /tmp/issue39-integration/staged.diff
          sha256sum /tmp/issue39-integration/*.zip > /tmp/issue39-integration/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-guarded-integration-${{ github.run_id }}
          path: /tmp/issue39-integration
          retention-days: 7
