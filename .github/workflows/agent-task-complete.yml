name: Complete agent task integration
on:
  push:
    branches: [feat/agent-conversations]
    paths: [.github/workflows/agent-task-complete.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/agent-conversations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate pinned main without choosing away source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 9652b9c87a7638f9de17d6c51f6593d97deaa923
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff --no-commit f9842a02f5917ff0679178f27346a27ec38acb27 || {
            python - <<'PY'
          import subprocess
          conflicts=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          assert conflicts and conflicts <= {'dist/studio.js','dist/VB6-Studio-Web.html'}, 'Unexpected source conflicts: '+str(conflicts)
          PY
          }
          git checkout --ours -- dist/studio.js dist/VB6-Studio-Web.html
          git add dist
          git diff --exit-code HEAD -- src/agents tests/coding-agents-tasks.test.mjs tools/coding-agents-browser-tests.py docs/coding-agents.md
      - name: Apply locally regression-tested question context fix and verify every changed source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def edit(name,old,new):
              p=Path(name); s=p.read_text(); assert s.count(old)==1,(name,s.count(old)); p.write_text(s.replace(old,new))
          edit('src/agents/task-tools.js',"        const answer = await awaitAbort(Promise.resolve(askUser(structuredClone(args), {signal})), signal);", "        // Keep the prompt paired with its answer in public transcripts/handoffs.\n        // Only validated public text is recorded; no native history or authority.\n        agent.emit('question', args.question);\n        const answer = await awaitAbort(Promise.resolve(askUser(structuredClone(args), {signal})), signal);")
          edit('src/agents/conversations.js',"['user', 'assistant', 'answer'].includes(event.type)","['user', 'assistant', 'question', 'answer'].includes(event.type)")
          edit('src/agents/conversations.js',"event.type === 'assistant' ? 'Agent' : event.type === 'answer' ? 'User answer' : 'User'", "event.type === 'assistant' ? 'Agent' : event.type === 'question' ? 'Agent question' : event.type === 'answer' ? 'User answer' : 'User'")
          p=Path('src/agents/studio.js'); s=p.read_text(); assert s.count("['user', 'assistant', 'answer'].includes(event.type)")==2
          s=s.replace("['user', 'assistant', 'answer'].includes(event.type)","['user', 'assistant', 'question', 'answer'].includes(event.type)")
          s=s.replace("event.type === 'assistant' ? 'Agent' : 'You'", "event.type === 'assistant' ? 'Agent' : event.type === 'question' ? 'Agent question' : event.type === 'answer' ? 'Your answer' : 'You'"); p.write_text(s)
          edit('tools/coding-agents-browser-tests.py', "    check(len(requests)==5); check(page.evaluate('vb6Studio.codingAgents.agent.plan.revision')==2)", "    check(len(requests)==5); check(page.evaluate('vb6Studio.codingAgents.agent.plan.revision')==2)\n    conversation=page.get_by_label('Agent conversation',exact=True).text_content()\n    check('Agent question:\\nWhich form should I inspect?' in conversation)\n    check('Your answer:\\nCustomer' in conversation)\n    check(conversation.index('Agent question:') < conversation.index('Your answer:'))\n    check(page.get_by_label('Agent conversation',exact=True).locator('img').count()==0)\n    tab(page,'Tasks');page.get_by_role('button',name='New Task with Context…',exact=True).click()\n    context_dialog=page.get_by_role('dialog',name='AI Coding Agent — Review Context',exact=True);context_dialog.wait_for()\n    context=page.get_by_label('Reviewed task context',exact=True).input_value()\n    check('Agent question:\\nWhich form should I inspect?' in context)\n    check('User answer:\\nCustomer' in context)\n    check(context.index('Agent question:') < context.index('User answer:'))\n    context_dialog.get_by_role('button',name='Cancel',exact=True).click()\n    check(len(requests)==5)")
          p=Path('docs/coding-agents.md'); s=p.read_text(); s+='\n### Questions in task context\n\nThe public conversation and reviewed context handoff keep each validated agent question before its answer, so short answers such as “Yes” do not lose their meaning when switching tasks. Cancelling a question records the question but does not invent an answer or permit continuation. Questions remain inert text; the handoff is an editable excerpt, not authorization or proof of the current project state. Native provider signatures, raw tool results and permission grants remain excluded.\n'; p.write_text(s)
          p=Path('tests/coding-agents-tasks.test.mjs'); p.write_text(p.read_text()+r'''
          for (const provider of providers) test(`tasks: ${provider} public handoff preserves each question before its answer`, async t => {
            let current = 0;
            const f = fixture(t, {askUser: async ({question}) => {
              assert.equal(f.agent.transcript.at(-1).type, 'question');
              assert.equal(f.agent.transcript.at(-1).text, question);
              return question.startsWith('Use') ? 'Yes' : 'No';
            }});
            await run(f.agent, async (_, {receive}) => {
              const questions = ['Use a Customer form?', 'Include a delete button?'];
              receive(packet(provider, current < questions.length ? [{name: 'vb6_agent_question', args: {question: questions[current++], options: ['Yes', 'No']}}] : []));
            }, provider, {mode: 'readonly'});
            const publicContext = f.conversations.handoff();
            assert.match(publicContext, /Agent question:\nUse a Customer form\?\n\nUser answer:\nYes/);
            assert.match(publicContext, /Agent question:\nInclude a delete button\?\n\nUser answer:\nNo/);
            assert.ok(!publicContext.includes('private-signature'));
            assert.ok(!publicContext.includes('private-thought'));
            const task = f.conversations.createFromContext(publicContext);
            assert.ok(task.draft.includes('Use a Customer form?')); assert.equal(task.agent.history.length, 0);
            assert.equal(f.approvals(), 0); assert.equal(f.ide.history.undoStack.length, 0);
          });

          test('tasks: cancelled question remains visible without inventing an answer', async t => {
            const f = fixture(t, {askUser: async () => null});
            await assert.rejects(run(f.agent, async (_, {receive}) => receive(packet('openai', [{name: 'vb6_agent_question', args: {question: 'Should the project be changed?'}}]))), /denied/);
            assert.equal(f.agent.transcript.filter(event => event.type === 'question').length, 1);
            assert.equal(f.agent.transcript.filter(event => event.type === 'answer').length, 0);
            assert.ok(f.conversations.handoff().includes('Agent question:\nShould the project be changed?'));
            assert.equal(f.agent.canResume, false);
          });

          test('tasks: rejected question arguments do not enter the public conversation', async t => {
            const f = fixture(t, {askUser: async () => { throw new Error('must not ask'); }});
            const question = f.agent.tools.find(tool => tool.name === 'vb6.agent.question');
            await assert.rejects(question.execute({question: 'Should this be trusted?', options: ['duplicate', 'duplicate']}));
            assert.equal(f.agent.transcript.length, 0);
          });
          ''')
          expected={
            'src/agents/conversations.js':'35908c1b52cd48092d1cbf5b36b10daacf3b8fa59127bcd64ea1e8341c0c7c09',
            'src/agents/studio.js':'4000000a90a0ba069a542107753da2627c7273f8cbd40af315b23c217cf4c015',
            'src/agents/task-tools.js':'e9d7748ae2afdeaf601ef630c834cf8823c69e1098467e02d1cf9d0ec5be7aa1',
            'tests/coding-agents-tasks.test.mjs':'37aa2714c04c305ca3ea0bb2390c5f8c6b95a18de58dbad9bcc4063a31ce2b65',
            'tools/coding-agents-browser-tests.py':'fa84d8e02496207723bb79cef33d48658c19922869a488342ac270b6ee2bc4e9',
            'docs/coding-agents.md':'1cd604b23e21348cfea769319c277d5adb29845b94a1c73e32ed605e49fb24cc'}
          for name,digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest, 'Source transfer mismatch: '+name
          PY
      - name: Rebuild and run full integrated tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent-task-complete
          npm run build
          node --check dist/studio.js
          npm test | tee /tmp/agent-task-complete/node-tests.txt
          npm run test:agents | tee /tmp/agent-task-complete/agent-tests.txt
          git add -A
          npm run build
          git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git diff --cached --check
      - name: Publish tested integration without force and record exact product tree
        shell: bash
        run: |
          set -euo pipefail
          index=$(mktemp)
          cp .git/index "$index"
          GIT_INDEX_FILE="$index" git update-index --force-remove .github/workflows/agent-task-complete.yml
          GIT_INDEX_FILE="$index" git write-tree > /tmp/agent-task-complete/product-tree.txt
          rm "$index"
          git commit -m 'fix(agents): preserve question context and current native workspace integration'
          git push origin HEAD:refs/heads/feat/agent-conversations
          git rev-parse HEAD > /tmp/agent-task-complete/head.txt
          git bundle create /tmp/agent-task-complete/repository.bundle HEAD
          cd /tmp/agent-task-complete
          sha256sum repository.bundle > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-tasks-complete-source
          path: /tmp/agent-task-complete/
          retention-days: 3
