name: Project compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build browser and standalone application
        run: npm run build
      - name: Run complete regression suite
        run: npm test
      - name: Verify reproducible distributions
        run: git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
      - name: Retain reproducible source and build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-compatibility-${{ github.sha }}
          retention-days: 7
          path: |
            src/
            tools/
            tests/
            examples/
            packages/
            desktop/
            dist/
            package.json
            LICENSE
            LICENSES/
            THIRD-PARTY-NOTICES.md
            README.md
            docs/
  source-archive:
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Deliberately no checkout: test what users download, including the
      # notices required by attributed CSS and Windows application staging.
      - uses: actions/download-artifact@v4
        with:
          name: project-compatibility-${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild freshly downloaded source without installed dependencies
        run: npm run build
      - name: Test the downloaded archive, including native export and staging
        run: npm test
      - name: Verify nested notices survive all release and recovery ZIP formats
        run: python tools/test-package-notices.py
  native-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Native projects over HTTP and standalone file origins
        env:
          VB6_BROWSER: ${{ matrix.browser }}
        run: npm run test:project-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-project-browser-${{ matrix.browser }}
          path: reports/native-projects
          if-no-files-found: ignore
          retention-days: 7
