name: Integrate current agent main with native export
on:
  push:
    branches: [feat/native-compatibility-boundaries]
    paths: [.github/workflows/native-agent-main-integration.yml]
permissions:
  contents: write
concurrency:
  group: native-agent-main-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge pinned agent changes without discarding authored source
        run: |
          set -euo pipefail
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          target=f905988a06004cb60f404d2bddeecc1318c361d8
          git merge-base --is-ancestor 5e9a3191ff04d00b13e4f100c48e219a836b7a4b "$target"
          if ! git merge --no-commit --no-ff "$target"; then
            python3 - <<'PY'
          import subprocess
          paths=[p for p in subprocess.check_output(['git','diff','--name-only','--diff-filter=U','-z']).decode().split('\0') if p]
          if not paths: raise SystemExit('Merge failed without generated conflicts')
          for p in paths:
              if not (p.startswith('dist/') or p in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js']):
                  raise SystemExit('Readable source conflict requires review: '+p)
              subprocess.run(['git','checkout','--ours','--',p],check=True)
              subprocess.run(['git','add','--',p],check=True)
          PY
          fi
          npm run build
          npm test
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js packages/win32-browser/dist examples
          git diff --cached --check
          git commit -m 'merge: retain agent recovery and streaming fixes in native export release' -m 'Preserve pinned main f905988a06004cb60f404d2bddeecc1318c361d8 and all callback, interval and array work. Rebuild only generated conflicts and run the full suite. No readable source conflict was automatically resolved.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/feat/native-compatibility-boundaries
          git bundle create /tmp/native-release-review.bundle HEAD refs/remotes/origin/main
          git archive HEAD --output=/tmp/native-release-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-review
          path: |
            /tmp/native-release-review.bundle
            /tmp/native-release-source.zip
          retention-days: 2
