name: Publish reviewed native String ownership fix
on:
  push:
    branches: [feat/native-declare-strings]
    paths: [.github/workflows/native-strings-ownership-publish.yml]
permissions:
  contents: write
concurrency:
  group: native-strings-ownership-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/.review-native-string-ownership.py
      - run: npm run build && npm test
      - run: node tools/win32-string-fixtures.mjs && node tools/win32-string-edge-fixture.mjs
      - name: Publish corrected binding, ownership tests and reproducible bundles
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git rm tools/.review-native-string-ownership.py
          git add src docs tests tools dist
          git diff --cached --check
          git commit -m 'fix(native): respect StrPtr constant bindings and validate String output ownership' -m 'Remove spelling-only NULL lowering, retain actual intrinsic detection, and add independent native alias/named-order/grouped/partial-output failure tests. Apply exact reviewed source postimages and rebuild the full suite. No native ABI or failure assertion is relaxed.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/feat/native-declare-strings
