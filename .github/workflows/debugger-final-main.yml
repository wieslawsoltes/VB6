name: Reconcile final debugger with main
on:
  push:
    branches: [feat/debugger-compatibility-boundaries]
    paths: ['.github/workflows/debugger-final-main.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/debugger-compatibility-boundaries'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge reviewed main without overriding source conflicts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          target='728a9201806a4d455113867d2778c3262666a05b'
          result=subprocess.run(['git','merge','--no-commit','--no-ff',target])
          if result.returncode:
              paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
              assert paths, 'Unexpected merge failure'
              for path in paths:
                  assert path.startswith('dist/') or path in {'src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js'}, 'Source conflict requires review: '+path
              for path in paths:
                  subprocess.run(['git','checkout','--ours','--',path],check=True)
                  subprocess.run(['git','add','--',path],check=True)
          PY
      - run: npm run build
      - name: Full combined Node suite
        run: |
          set -o pipefail
          npm test | tee /tmp/debugger-final-main-tests.log
      - name: Commit and independently repeat the build
        run: |
          git add -A
          git diff --cached --check
          git commit -m 'merge: integrate issue39 visual fidelity and portable bundling with verified debugger'
          npm run build
          git diff --exit-code
      - name: Publish without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/debugger-compatibility-boundaries | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/debugger-compatibility-boundaries
          git rev-parse HEAD HEAD^{tree} > /tmp/debugger-final-main.refs
          git bundle create /tmp/debugger-final-main.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debugger-final-main
          path: /tmp/debugger-final-main*
          if-no-files-found: ignore
          retention-days: 7
