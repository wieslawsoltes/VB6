name: Win32 services integration
on:
  push:
    branches: [feature/win32-common-services]
    paths: [.github/workflows/services-materialize.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record and verify the exact publication starting point
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/services-original-head.txt
          expected=$(cat /tmp/services-original-head.txt)
          actual=$(git ls-remote origin refs/heads/feature/win32-common-services | cut -f1)
          printf 'Checked out: %s\nBranch tip: %s\n' "$expected" "$actual"
          test "$actual" = "$expected"
      - name: Recover checksum-verified authored services implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git merge --no-commit --no-ff f905988a06004cb60f404d2bddeecc1318c361d8
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path, PurePosixPath
          parts=[Path('.services-staging')/(str(i)+'.b64') for i in range(3)]
          encoded=''.join(p.read_text().strip() for p in parts)
          assert len(encoded)==49836
          compressed=base64.b64decode(encoded,validate=True)
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          data=decoder.decompress(compressed,max_length=144131)
          assert decoder.eof and not decoder.unused_data and len(data)==144130
          assert hashlib.sha256(data).hexdigest()=='e9bbf108a02b670b64a07bd5acf29d5cd7ce18428d95ac19fb85bb7122cc6bcd'
          entries=json.loads(data)['files']
          assert len(entries)==23 and len({e['path'] for e in entries})==23
          for e in entries:
              p=PurePosixPath(e['path'])
              assert not p.is_absolute() and '..' not in p.parts
              f=Path(p)
              if e['before'] is None:
                  assert not f.exists(), str(f)
              else:
                  assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==e['before'], str(f)
          for e in entries:
              f=Path(e['path'])
              if 'patch' in e:
                  subprocess.run(['git','apply','--whitespace=error'],input=e['patch'].encode(),check=True)
              else:
                  f.parent.mkdir(parents=True,exist_ok=True)
                  f.write_text(e['content'],encoding='utf-8')
              assert hashlib.sha256(f.read_bytes()).hexdigest()==e['after'], str(f)
          for p in parts: p.unlink()
          Path('.services-staging').rmdir()
          print('Verified all 23 authored preimages and results.')
          PY
          npm run build
          node tools/win32-api-inventory.mjs
          git add -A
          # New generated sample HTML retains upstream license comments verbatim.
          # Validate authored whitespace; generated output is checked by reproducibility.
          git diff --cached --check -- . ':!dist' ':!src/exporter/runtime-payload.js' ':!src/editor/diagnostics-payload.js' ':!packages/win32-browser/dist'
          git commit -m 'feat(win32): common file, text, synchronization, registry, GUID and property services with six samples'
      - name: Preserve current main and rebuild only generated conflicts
        shell: bash
        run: |
          set -euo pipefail
          git merge --no-commit --no-ff 6aeeae789151397c58648cd9d99678105935979f || true
          python3 - <<'PY'
          import subprocess
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert all(p.startswith('dist/') or p in ('src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js') for p in conflicts), conflicts
          PY
          rm .github/workflows/services-materialize.yml
          npm run build
          node tools/win32-api-inventory.mjs
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check -- . ':!dist' ':!src/exporter/runtime-payload.js' ':!src/editor/diagnostics-payload.js' ':!packages/win32-browser/dist'
          npm test | tee /tmp/services-integration-tests.txt
          npm run pack:win32-browser | tee /tmp/services-package-tests.txt
          git diff --exit-code
          git commit -m 'fix(win32): retain native callbacks and agent permission changes in combined services build'
          npm run build
          node tools/win32-api-inventory.mjs
          git diff --exit-code
      - name: Publish only to the unchanged feature branch
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat /tmp/services-original-head.txt)
          actual=$(git ls-remote origin refs/heads/feature/win32-common-services | cut -f1)
          printf 'Expected starting head: %s\nCurrent branch tip: %s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          git push origin HEAD:refs/heads/feature/win32-common-services
          git archive --format=zip HEAD -o /tmp/vb6-services-source.zip
          git rev-parse HEAD HEAD^{tree} > /tmp/services-revision.txt
      - name: Retain exact history and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git bundle create /tmp/vb6-services-source.bundle HEAD refs/remotes/origin/main
          git status --short > /tmp/services-source-status.txt
          git diff --binary HEAD > /tmp/services-working.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-services-integration
          path: |
            /tmp/vb6-services-source.zip
            /tmp/vb6-services-source.bundle
            /tmp/services-revision.txt
            /tmp/services-integration-tests.txt
            /tmp/services-package-tests.txt
            /tmp/services-source-status.txt
            /tmp/services-working.patch
            release/vb6-win32-browser-*.tgz
          retention-days: 14
