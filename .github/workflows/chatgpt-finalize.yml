name: Finalize ChatGPT integration
on:
  push:
    branches: [feature/chatgpt-plan-login]
    paths: ['.github/workflows/chatgpt-finalize.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feature/chatgpt-plan-login'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve only the independently reviewed merge conflicts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff 5ad8ea7815877347230dda6e5254ada4181aa61c || test -f .git/MERGE_HEAD
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, hashlib
          conflicts = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
          allowed = {'README.md', 'docs/coding-agents.md', 'src/agents/studio.js', 'dist/studio.js', 'dist/VB6-Studio-Web.html'}
          assert set(conflicts) <= allowed, 'Unexpected merge conflict: ' + repr(conflicts)
          pattern = r'<<<<<<<[^\n]*\n(.*?)=======\n(.*?)>>>>>>>[^\n]*\n'
          for name in ['README.md', 'docs/coding-agents.md']:
              path = Path(name)
              text, count = re.subn(pattern, lambda m: m[2] + '\n' + m[1], path.read_text(), flags=re.S)
              assert count <= 1
              path.write_text(text)
          path = Path('src/agents/studio.js')
          replacement = "  async start(continuation = false, compactOnly = false, queuedId = null) {\n    // A draft /compact command must never replace a separately selected queue item.\n    if (!continuation && !queuedId && this.prompt.value.trim() === '/compact') compactOnly = true;\n    if (this.pending || this.api.agent.busy || this.chatgpt?.busy) return;\n"
          text, count = re.subn(pattern, lambda _: replacement, path.read_text(), flags=re.S)
          assert count <= 1
          path.write_text(text)
          for name, expected in {
              'README.md': '1ada11df2426eb955fbe331f938835c40fcf8901d288c4cc36640e7effcb4152',
              'docs/coding-agents.md': '8f2645dfca40a871128591410d230655968346340d666652554c5fe84ca8f1b0',
              'src/agents/studio.js': 'b6e58bd57b4aeddd86ca703a3f45791740fe10c13ef7e487d01acc0c2d4ba510'
          }.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
              subprocess.run(['git', 'add', '--', name], check=True)
          for name in conflicts:
              if name.startswith('dist/'):
                  subprocess.run(['git', 'checkout', '--ours', '--', name], check=True)
                  subprocess.run(['git', 'add', '--', name], check=True)
          PY
      - run: npm run build
      - run: npm test
      - name: Verify complete reviewed tree and publish feature-branch integration
        run: |
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git rm .github/workflows/chatgpt-finalize.yml
          git diff --cached --check
          test "$(git write-tree)" = '9c05cd8f0ab71d857719fc6027a807773e9e9ed3'
          test "$(git ls-remote origin refs/heads/feature/chatgpt-plan-login | cut -f1)" = "$GITHUB_SHA"
          git commit -m 'Merge main agent workbench with account-bound ChatGPT sign-in'
          git push origin HEAD:refs/heads/feature/chatgpt-plan-login
