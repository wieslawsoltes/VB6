name: Complete debugger compatibility integration
on:
  push:
    branches: [feat/debugger-compatibility-boundaries]
    paths: ['.github/workflows/debugger-final-integration.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/debugger-compatibility-boundaries'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode reviewed source deltas
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          import crypto from 'node:crypto';
          for(const [name,decode,expected] of [
            ['hardening',zlib.inflateSync,'e6b746579c854648effa2e3be4aa8aadfb30acb855d109eede47d1e5a5ecbaa8'],
            ['final-edits',zlib.inflateSync,'745b00d7335d1aac629872b5d2ccd208b8714d704bf6c8089e86ce31ec2c9cd7']
          ]){
            const data=decode(Buffer.from(fs.readFileSync('.github/debugger-'+name+'.b64','utf8').trim(),'base64'));
            const actual=crypto.createHash('sha256').update(data).digest('hex');
            if(actual!==expected)throw new Error(name+' source integrity mismatch: '+actual);
            fs.writeFileSync('/tmp/debugger-'+name+'.json',data);
          }
          JS
      - name: Apply reviewed source changes and merge current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          def apply(name):
              updates={}
              for item in json.loads(Path('/tmp/debugger-'+name+'.json').read_text()):
                  path=Path(item['path'])
                  assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink(),str(path)
                  assert str(path)=='.gitignore' or str(path).startswith(('src/','tests/','tools/','docs/','packages/native-debugger/')),str(path)
                  old=path.read_bytes()
                  assert hashlib.sha256(old).hexdigest()==item['old'],'Before hash: '+str(path)
                  lines=old.decode().splitlines(keepends=True)
                  for start,end,replacement in reversed(item['edits']):
                      assert 0<=start<=end<=len(lines),str(path)
                      lines[start:end]=replacement
                  text=''.join(lines)
                  assert hashlib.sha256(text.encode()).hexdigest()==item['new'],'After hash: '+str(path)
                  updates[path]=text
              for path,text in updates.items():path.write_text(text)
              print('Applied',len(updates),'verified files:',name,flush=True)
          apply('hardening')
          subprocess.run(['git','add','packages/native-debugger','src','tests','tools'],check=True)
          subprocess.run(['git','commit','-m','fix(debugger): protect static storage and add bounded native data breakpoints'],check=True)
          target='f4ee8d47bed69ae26b65d20637b8f5f8da13d815'
          result=subprocess.run(['git','merge','--no-commit','--no-ff',target])
          if result.returncode:
              conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
              assert conflicts,'Merge failed without conflicts'
              for path in conflicts:
                  assert path.startswith('dist/') or path in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js'],'Unreviewed source conflict: '+path
                  subprocess.run(['git','checkout','--ours','--',path],check=True)
                  subprocess.run(['git','add','--',path],check=True)
          apply('final-edits')
          for path in ['.github/debugger-hardening.b64','.github/debugger-final-edits.b64','.github/workflows/debugger-main-sync.yml','.github/workflows/debugger-review-snapshot.yml','.github/workflows/debugger-final-integration.yml']:
              Path(path).unlink()
          PY
      - run: npm run build
      - name: Full unit suite on combined sources
        run: |
          set -o pipefail
          npm test | tee /tmp/debugger-completed-unit.log
      - name: Install Chromium for real origin validation
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH='+p.chromium.executable_path)
          PY
      - name: Existing source debugger and new modular HTTP standalone HTTP and file cases
        run: |
          python tools/browser-debugger-runtime.py
          python tools/browser-debugger-boundaries.py
      - name: Commit and check reproducibility
        run: |
          git diff --check f4ee8d47bed69ae26b65d20637b8f5f8da13d815
          git add -A
          git commit -m 'feat(debugger): complete native data watches and ordered state with deployed browser validation'
          npm run build
          git diff --exit-code
      - name: Push validated branch without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/debugger-compatibility-boundaries | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/debugger-compatibility-boundaries
          git rev-parse HEAD > /tmp/debugger-completed.sha
      - name: Preserve source and validation evidence
        if: always()
        run: |
          git bundle create /tmp/debugger-completed.bundle --all
          git diff > /tmp/debugger-completed-uncommitted.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debugger-completed-integration
          path: |
            /tmp/debugger-completed*
            /tmp/debugger-hardening.json
            /tmp/debugger-final-edits.json
            reports/debugger-runtime
            reports/debugger-boundaries
          retention-days: 7
