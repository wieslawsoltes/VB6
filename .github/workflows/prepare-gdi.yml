name: Prepare reviewed GDI source
on:
  push:
    branches: [feature/win32-gdi-bitmaps]
    paths: [.github/workflows/prepare-gdi.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply reviewed source delta
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          base='0cc1fee9beb68e418a773eb57d9ee3313a1c9e63'
          workflow='.github/workflows/win32-gdi.yml'
          allowed={'.gdi-source/part'+str(i)+'.b64' for i in range(4)}|{'.github/workflows/prepare-gdi.yml',workflow}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          if changed!=allowed: raise SystemExit('Unexpected preparation tree: '+repr(changed))
          if hashlib.sha256(pathlib.Path(workflow).read_bytes()).hexdigest()!='4b06cb7f807b6d8b27208d30b374cbe806f50d3b76ca5322c898e26c461c55c7': raise SystemExit('Preinstalled workflow differs from reviewed source')
          parts=[pathlib.Path('.gdi-source/part'+str(i)+'.b64').read_bytes() for i in range(4)]
          compressed=base64.b64decode(b''.join(parts),validate=True)
          actual=hashlib.sha256(compressed).hexdigest()
          print('Compressed bytes',len(compressed),'SHA256',actual,flush=True)
          if actual!='28c32cbb4ad780c1fed3756a792018a8387a61dd41917307f1b8c3e619583668': raise SystemExit('Source transfer hash mismatch')
          patch=lzma.decompress(compressed,memlimit=256*1024*1024)
          if len(patch)!=117548: raise SystemExit('Unexpected patch size')
          sections=patch.split(b'diff --git ')
          omitted=[s for s in sections[1:] if s.startswith(('a/'+workflow+' b/'+workflow+'\n').encode())]
          if len(omitted)!=1 or sections[0]: raise SystemExit('Unexpected workflow patch section')
          patch=b''.join(b'diff --git '+s for s in sections[1:] if s not in omitted)
          pathlib.Path('/tmp/gdi-source.patch').write_bytes(patch)
          subprocess.run(['git','apply','--unidiff-zero','--index','--check','/tmp/gdi-source.patch'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index','/tmp/gdi-source.patch'],check=True)
          PY
      - name: Rebuild and test integrated source and isolated package
        run: |
          node tools/win32-api-inventory.mjs
          npm run build
          npm test
          npm run pack:win32-browser
          git add -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples packages/win32-browser/dist
          git rm -- .gdi-source/part*.b64
      - name: Publish only to feature branch after lease check
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feature/win32-gdi-bitmaps | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat(win32-browser): add memory DCs, writable DIBs, raster transfers and hDC'
          git push origin HEAD:refs/heads/feature/win32-gdi-bitmaps
          git rev-parse HEAD HEAD^{tree} > /tmp/gdi-revision.txt
          git archive --format=zip HEAD -o /tmp/gdi-reviewed-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdi-reviewed-source
          path: |
            /tmp/gdi-revision.txt
            /tmp/gdi-reviewed-source.zip
            release/vb6-win32-browser-*.tgz
          retention-days: 7
