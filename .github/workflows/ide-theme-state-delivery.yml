name: Verify IDE theme control-state follow-up
on:
  push:
    branches: [validation/ide-theme-state-followup]
permissions:
  contents: read
jobs:
  verify-source:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/validation/ide-theme-state-followup'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      THEME_BASE: 70bca41dfa9763be57965effe75b1f8e9077c002
      PINNED_MAIN: b70becd023f4b72122ed0e193830f098349c845a
      EXPECTED_TREE: e61311584087f7aebd3ec28e826ca538a0b6fe35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 70bca41dfa9763be57965effe75b1f8e9077c002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed, hash-verified source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$THEME_BASE"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          python - <<'PY'
          import base64,zlib,hashlib,subprocess
          payload=''
          # Correct transcription is mandatory: no patch runs on a hash mismatch.
          payload=payload.replace('njH7H/vM','njH/vM').replace('ys8dFYQp','8dFYQp')
          patch=zlib.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='6ae62e49dc3f41bd923abd3b126c076cd55a9d7bc858832982786f225944f3fb'
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
          git commit --quiet -m 'Local staging of reviewed theme control-state patch'
      - name: Reconcile the three reviewed conflicts against pinned main
        shell: bash
        run: |
          set -euo pipefail
          git merge --no-commit --no-ff "$PINNED_MAIN" || test "$?" = 1
          python - <<'PY'
          import subprocess,os,json
          from pathlib import Path
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert conflicts==['.gitignore','tools/build.mjs','tools/ide-artifacts.json'],conflicts
          subprocess.run(['git','checkout','--ours','--','.gitignore','tools/build.mjs'],check=True)
          p=Path('.gitignore');p.write_text(p.read_text()+'\n# Source-derived OCX lab, verified by the same exact artifact manifest.\n/dist/OCX-Source-Control-Lab.html\n')
          p=Path('tools/build.mjs');s=p.read_text();key="if(process.argv.includes('--update-ide-manifest'))"
          assert s.count(key)==1
          p.write_text(s.replace(key,"const {buildOcxLab}=await import('./build-ocx-lab.mjs');buildOcxLab(root);\n"+key))
          data=json.loads(subprocess.check_output(['git','show',os.environ['PINNED_MAIN']+':tools/ide-artifacts.json']))
          data['files']['dist/studio.js']={'bytes':5768478,'sha256':'b7a48d93828c03c78e7a66be43899632552f990cec996ca615f55f731a897edc'}
          data['files']['dist/VB6-Studio-Web.html']={'bytes':5978177,'sha256':'8cd6a9b373755f92fe84c55edcf2306bb6b6d4bd4c6438861472ac2dad915c17'}
          Path('tools/ide-artifacts.json').write_text(json.dumps(data,indent=2)+'\n')
          subprocess.run(['git','add','.gitignore','tools/build.mjs','tools/ide-artifacts.json'],check=True)
          PY
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test "$(find .github/workflows -maxdepth 1 -name '*.yml' | sort | tr '\n' ' ')" = '.github/workflows/pages.yml .github/workflows/validate.yml '
      - name: Validate exact source and retained artifact expectations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/theme-evidence
          npm run build | tee /tmp/theme-evidence/build.log
          node --test tests/*.test.mjs > /tmp/theme-evidence/node.log 2>&1
          npm run verify:ide-artifacts | tee /tmp/theme-evidence/fingerprints.log
          git diff --exit-code
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Publish only a clean result ref, never main or the task ref
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$(git ls-remote --heads origin refs/heads/validation/ide-theme-state-result)"; then
            echo 'Result ref already exists; refusing to replace it.' >&2
            exit 1
          fi
          result=$(git commit-tree "$EXPECTED_TREE" -p "$THEME_BASE" -p "$PINNED_MAIN" -m 'fix(theme): preserve selected control states, accessible focus and current-main integration')
          git push origin "$result:refs/heads/validation/ide-theme-state-result"
          printf '%s\n%s\n' "$result" "$EXPECTED_TREE" | tee /tmp/theme-evidence/revision.txt
          printf 'Verified result: `%s`\n\nSource tree: `%s`\n' "$result" "$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ide-theme-state-verification
          path: /tmp/theme-evidence
          retention-days: 7
          if-no-files-found: ignore
