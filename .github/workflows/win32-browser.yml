name: Win32 browser compatibility
on:
  push:
    branches: [feature/win32-browser-compat]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7d821e026b7c7cd34cfc07c452647260080e492e
      - name: Archive exact source for integration testing
        run: git archive --format=zip HEAD -o /tmp/vb6-win32-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: win32-browser-source
          path: /tmp/vb6-win32-source.zip
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm test
