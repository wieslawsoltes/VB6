name: Native Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      classic:
        description: 'Run licensed VB6 compiler tests on a trusted self-hosted Windows runner'
        type: boolean
        default: false
      diagnostics:
        description: 'Capture isolated stock Electron GPU backend diagnostics'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - run: npm run build:classic -- --project examples/classic/HelloRuntime.vbp --stage-only --codegen pcode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validation-workspace
          path: |
            src/
            tests/
            tools/
            examples/
            desktop/
            package.json
            README.md
            LICENSE
            THIRD-PARTY-NOTICES.md
          retention-days: 7
  windows-package:
    needs: runtime-tests
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - run: npm run fixtures:native
      - run: npm run build:windows -- --project validation/NativeSmoke.vb6web --graphics webgpu --stage-only
      - name: Validate strict WebGPU startup or its explicit unsupported-hardware diagnostic
        run: node tools/test-native-host.mjs .native-build/nativesmoke-x64 --allow-graphics-block
      - name: Isolated GPU diagnostics
        if: github.event_name == 'workflow_dispatch' && inputs.diagnostics
        run: node tools/probe-windows-gpu.mjs
      - run: npm run build:windows -- --project validation/NativeSmoke.vb6web --graphics auto --stage-only
      - run: node tools/test-native-host.mjs .native-build/nativesmoke-x64
      - run: npm run build:windows -- --project validation/NativeSmoke.vb6web --graphics auto --out release/windows/app
      - name: Launch isolated single-file application
        shell: pwsh
        run: |
          $exe = (Get-ChildItem release/windows/app -Filter *.exe).FullName
          node tools/test-portable.mjs "$exe"
      - run: npm run build:windows -- --graphics auto --stage-only
      - run: node tools/test-native-host.mjs .native-build/vb6-studio-x64
      - run: npm run build:windows -- --graphics auto --out release/windows/studio
      - name: Launch isolated single-file IDE
        shell: pwsh
        run: |
          $exe = (Get-ChildItem release/windows/studio -Filter *.exe).FullName
          node tools/test-portable.mjs "$exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-reports
          path: |
            validation/*.json
            validation/*.log
            desktop/package-lock.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-portable-x64
          path: |
            release/windows/app/*.exe
            release/windows/app/*.json
            release/windows/app/*.txt
            release/windows/studio/*.exe
            release/windows/studio/*.json
            release/windows/studio/*.txt
            validation/*.json
            desktop/package-lock.json
          retention-days: 14
  classic-compiler:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.classic
    runs-on: [self-hosted, Windows, vb6]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and run actual VB6 native-code and P-code executables
        shell: pwsh
        run: |
          foreach ($mode in @('native', 'pcode')) {
            $out = "release/classic/$env:GITHUB_RUN_ID-$mode"
            node tools/build-classic.mjs --project examples/classic/HelloRuntime.vbp --codegen $mode --out $out
            if ($LASTEXITCODE -ne 0) { throw "VB6 compilation failed: $mode" }
            $exe = (Resolve-Path "$out/HelloRuntime.exe").Path
            $process = Start-Process -FilePath $exe -ArgumentList '/smoke' -PassThru
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'VB6 runtime test timed out' }
            if ($process.ExitCode -ne 0) { throw 'VB6 runtime test failed' }
            if ((Get-Content "$out/classic-smoke.txt").Trim() -ne 'VB6 runtime OK') { throw 'Missing VB6 runtime evidence' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-vb6-validation
          path: release/classic/
