name: Native Windows
on:
  push:
    branches: [main, feat/win32-standalone-webgpu]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validation-workspace
          path: |
            src/
            tests/
            tools/
            examples/
            desktop/
            package.json
            README.md
            LICENSE
          retention-days: 7
