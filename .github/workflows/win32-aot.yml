name: Win32 AOT and ARM64
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: win32-aot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm run build
      - run: node tools/win32-fixtures.mjs
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Export identical PE bytes from standalone IDE and Web Worker
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tools/browser-native-build-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-native-export
          path: validation/browser-native/
          retention-days: 14
  aot-runtime:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run test:win32
      - run: node tools/win32-fixtures.mjs
      - name: Execute freestanding PE32 files with native controls and MDI
        shell: pwsh
        run: ./tools/test-win32-aot.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-aot-validation
          path: validation/win32/
          retention-days: 14
  desktop-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: arm64
      - name: Require ARM64 execution rather than emulated x64
        run: node -e "if(process.arch!=='arm64')process.exit(1)"
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - run: npm run fixtures:native
      - run: npm run build:windows -- --project validation/NativeSmoke.vb6web --graphics auto --arch arm64 --stage-only
      - run: node tools/test-native-host.mjs .native-build/nativesmoke-arm64
      - run: npm run build:windows -- --graphics auto --arch arm64 --stage-only
      - run: node tools/test-native-host.mjs .native-build/vb6-studio-arm64
      - run: npm run build:windows -- --graphics auto --arch arm64 --out release/windows-arm64
      - name: Launch isolated ARM64 portable IDE
        shell: pwsh
        run: |
          $exe = (Get-ChildItem release/windows-arm64 -Filter *.exe).FullName
          node tools/test-portable.mjs "$exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-arm64-validation
          path: |
            validation/*.json
            validation/*.log
            release/windows-arm64/*.exe
            release/windows-arm64/*.json
            release/windows-arm64/*.txt
          retention-days: 14
