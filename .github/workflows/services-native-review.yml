name: Services native fix validation
on:
  push:
    branches: [feature/win32-common-services]
    paths: [.github/workflows/services-native-review.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed source corrections with exact preimage and output checks
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/services-starting-head.txt
          test "$(git ls-remote origin refs/heads/feature/win32-common-services | cut -f1)" = "$(cat /tmp/services-starting-head.txt)"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          hashes={
            'packages/win32-browser/src/crypt32-codec.js':('9ec16bed2a34d8ce132c57fa754dd042015aaaee23fe915addadb356ca9428f7','28b0ba93ebd410547f82fa3844891d59f26bd5f6b00e8fefacce496341b11e0a'),
            'packages/win32-browser/src/kernel32-nls.js':('533830e15960282245de3ecd6fbb47aef0dd392dc53d22c392396f02d623d9ec','f8e363e05622767ffccfe7cdde0fb5fd4fd58d8d71aa66e4c2ecca4abedb59ec'),
            'packages/win32-browser/test/services.test.mjs':('d327bfc96cb9c5dd3f77a83366453a7a60ee0233fbf015edbc3edb3208b76161','7a2bd09309685a127f365b74b6a416fdebdba99c2a7e3313099ade6f2790d5e4'),
            'tools/win32-services-contracts.mjs':('38981999ff6f2e60c73ac273047ab8f432a580e95ee55de5afa4d75cfd32d151','3f54845b1bdf2390a049d816e199d5946a0d7b745222dbaf4199e97082aef9b5'),
            'tools/win32-services-oracle.ps1':('7d2a7c7fbd89998d59f55f24824d547a688ab80347db1fd40f872f4427964bee','5391cc3c97c7773bed1b251245beaae00fe7d03c91c0c83c01363831bc122f00'),
            'tools/browser-win32-services.py':('e24fd967894d0e5f45ec6f42e0878c4f4ac86278ff5c6c7f419caf764587e821','d6e410cd605b08ea82981a034f589a1887d2e5118eb04450dc4b101c7a09902e')}
          for name,(before,after) in hashes.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==before,name
          p=Path('packages/win32-browser/src/kernel32-nls.js');s=p.read_text();s=s.replace('integer,unsigned,encodeANSI,decodeANSI','integer,unsigned,decodeANSI')
          s=s.replace('export const NLS_CONSTANTS','// Reverse the process code page once; WideCharToMultiByte consumes UTF-16 units,\n// including one default byte for each half of an unrepresentable surrogate pair.\nconst ANSI_CODE_UNITS=new Map(Array.from({length:256},(_,value)=>[decodeANSI(Uint8Array.of(value)).charCodeAt(0),value]));\n\nexport const NLS_CONSTANTS',1)
          old='result=encodeANSI(text);let i=0;\n      for(const character of text){if(decodeANSI(result.subarray(i,i+1))!==character){result[i]=replacement;used=true;}i++;}'
          assert old in s;s=s.replace(old,'result=new Uint8Array(text.length);\n      for(let i=0;i<text.length;i++){const byte=ANSI_CODE_UNITS.get(text.charCodeAt(i));if(byte===undefined){result[i]=replacement;used=true;}else result[i]=byte;}');p.write_text(s)
          p=Path('packages/win32-browser/src/crypt32-codec.js');s=p.read_text();old="const bytes=count?m.bytes(input,count):new Uint8Array();let value='';";assert old in s;s=s.replace(old,"if(!input)throw new Win32Error('A binary input pointer is required');\n    const bytes=m.bytes(input,count);let value='';");p.write_text(s)
          p=Path('tools/win32-services-oracle.ps1');s=p.read_text();old='Wide("ansi-astral",1252,1024,"😀",2);';assert old in s;s=s.replace(old,old+'\n  '+r'Wide("ansi-astral-tail",1252,1024,"A😀é",4);Wide("ansi-unpaired",1252,1024,"\ud800A\udc00",3);Wide("ansi-astral-terminated",1252,1024,"😀",-1);')
          old='for(int i=0;i<labels.Length;i++){uint n=0;if(wide)EncodeW(data[i],(uint)data[i].Length,flags[i],IntPtr.Zero,ref n);else EncodeA(data[i],(uint)data[i].Length,flags[i],IntPtr.Zero,ref n);uint q=n;n=256;int ok=wide?EncodeW(data[i],(uint)data[i].Length,flags[i],output,ref n):EncodeA(data[i],(uint)data[i].Length,flags[i],output,ref n);result["base64-"+suffix+"-"+labels[i]]=new object[]{q,ok,n,Text(output,wide)};}'
          new='''// A managed zero-length array marshals as NULL. Use an allocated one-byte
             // array with a zero count to match the JS probe's non-NULL empty buffer.
             for(int i=0;i<labels.Length;i++){byte[] binary=data[i].Length==0?new byte[1]:data[i];uint n=0;int query=wide?EncodeW(binary,(uint)data[i].Length,flags[i],IntPtr.Zero,ref n):EncodeA(binary,(uint)data[i].Length,flags[i],IntPtr.Zero,ref n);if(query==0)throw new InvalidOperationException("Base64 query failed: "+suffix+"/"+labels[i]+" error "+Marshal.GetLastWin32Error());uint q=n;n=256;Marshal.WriteInt32(output,0);int ok=wide?EncodeW(binary,(uint)data[i].Length,flags[i],output,ref n):EncodeA(binary,(uint)data[i].Length,flags[i],output,ref n);if(ok==0)throw new InvalidOperationException("Base64 conversion failed: "+suffix+"/"+labels[i]+" error "+Marshal.GetLastWin32Error());result["base64-"+suffix+"-"+labels[i]]=new object[]{q,ok,n,Text(output,wide)};}
             {uint n=77;int query=wide?EncodeW(null,0,1,IntPtr.Zero,ref n):EncodeA(null,0,1,IntPtr.Zero,ref n);int queryError=query==0?Marshal.GetLastWin32Error():0;uint q=n;n=256;Marshal.WriteInt32(output,0);int ok=wide?EncodeW(null,0,1,output,ref n):EncodeA(null,0,1,output,ref n);int error=ok==0?Marshal.GetLastWin32Error():0;result["base64-"+suffix+"-null"]=new object[]{query,queryError,q,ok,error,n,Text(output,wide)};}'''
          assert old in s;s=s.replace(old,new);p.write_text(s)
          p=Path('tools/win32-services-contracts.mjs');s=p.read_text();old="wide('ansi-astral',1252,1024,'😀',2);";assert old in s;s=s.replace(old,old+'\n '+r"wide('ansi-astral-tail',1252,1024,'A😀é',4);wide('ansi-unpaired',1252,1024,'\ud800A\udc00',3);wide('ansi-astral-terminated',1252,1024,'😀',-1);")
          old=r"  const input=m.allocString(' QcOp\r\n4oKs ',wide)";assert old in s;s=s.replace(old,"  {const n=u32(77),out=m.alloc(256*step);w.lastError=0;const query=call('crypt32','CryptBinaryToString'+suffix,0,0,1,0,n),queryError=query?0:w.lastError,q=m.readU32(n);m.writeU32(n,256);w.lastError=0;const ok=call('crypt32','CryptBinaryToString'+suffix,0,0,1,out,n);results['base64-'+suffix+'-null']=[query,queryError,q,ok,ok?0:w.lastError,m.readU32(n),m.string(out,wide)];}\n"+old);p.write_text(s)
          p=Path('packages/win32-browser/test/services.test.mjs');s=p.read_text();s+=r'''
          
          test('ANSI conversion substitutes per UTF-16 unit without losing following text',t=>{
            const {w,m,call}=setup(t),out=m.alloc(64),used=u32(m,0),replacement=bytes(m,[33]);
            for(const [text,expected]of [['A😀é',[65,33,33,233]],['\ud800A\udc00',[33,65,33]],['😀😀',[33,33,33,33]]]){
              const source=m.allocString(text,true);
              assert.equal(call('WideCharToMultiByte',1252,1024,source,text.length,0,0,replacement,used),expected.length);
              assert.equal(m.readU32(used),1);
              assert.equal(call('WideCharToMultiByte',1252,1024,source,text.length,out,64,replacement,used),expected.length);
              assert.deepEqual([...m.bytes(out,expected.length)],expected);
              m.bytes(out,64).fill(17);m.writeU32(used,55);
              assert.equal(call('WideCharToMultiByte',1252,1024,source,text.length,out,expected.length-1,replacement,used),0);
              assert.equal(w.lastError,122);assert.deepEqual([...m.bytes(out,64)],Array(64).fill(17));assert.equal(m.readU32(used),55);
            }
          });
          test('Windows-1252 NLS roundtrip preserves all 256 code units without substitution',t=>{
            const {m,call}=setup(t),input=bytes(m,Array.from({length:256},(_,i)=>i)),wide=m.alloc(512),output=m.alloc(256),used=u32(m,99);
            assert.equal(call('MultiByteToWideChar',1252,0,input,256,wide,256),256);
            assert.equal(call('WideCharToMultiByte',1252,1024,wide,256,output,256,0,used),256);
            assert.deepEqual([...m.bytes(output,256)],[...m.bytes(input,256)]);assert.equal(m.readU32(used),0);
          });
          for(const wide of [false,true])test('Base64 '+(wide?'W':'A')+' distinguishes empty storage from a NULL input pointer',t=>{
            const {w,m}=setup(t),api=(...args)=>w.invoke('crypt32','CryptBinaryToString'+(wide?'W':'A'),args),input=m.alloc(1),output=m.alloc(32*(wide?2:1)),size=u32(m,0);
            for(const [flags,text]of [[1,'\r\n'],[0x80000001,'\n'],[0x40000001,'']]){
              assert.equal(api(input,0,flags,0,size),1);assert.equal(m.readU32(size),text.length+1);
              m.writeU32(size,32);assert.equal(api(input,0,flags,output,size),1);assert.equal(m.string(output,wide),text);assert.equal(m.readU32(size),text.length);
            }
            m.putString(output,'keep',32,wide);m.writeU32(size,77);
            assert.equal(api(0,0,1,0,size),0);assert.equal(w.lastError,87);assert.equal(m.readU32(size),77);
            assert.equal(api(0,0,1,output,size),0);assert.equal(w.lastError,87);assert.equal(m.readU32(size),77);assert.equal(m.string(output,wide),'keep');
          });
          ''';p.write_text(s)
          p=Path('tools/browser-win32-services.py');s=p.read_text()
          old="""   result=page.evaluate('''async()=>{const api=await import('/src/runtime/entry.js'),project=await(await fetch('/examples/win32-text.vb6web')).json();document.body.replaceChildren();const host=await api.mountApplication(project,document.body,{persist:false});try{await host.vm.dispatch(host.forms[0].instance,'cmdRun_Click',[]);return document.querySelector('[data-control="txtOutput"] textarea').value;}finally{host.dispose();}}''')
             check(all(part in result for part in SAMPLES['win32-text']),'SDK sample failed');results.append({'case':'runtime-sdk-services','passed':True})"""
          new="""   page.evaluate('''async()=>{const api=await import('/src/runtime/entry.js'),project=await(await fetch('/examples/win32-text.vb6web')).json();document.body.replaceChildren();globalThis.vb6Application=await api.mountApplication(project,document.body,{persist:false});}''')
             # Property setters batch DOM updates through requestAnimationFrame. Reuse the
             # real UI/status and queue-drain assertions instead of reading stale DOM in
             # the same microtask as dispatch, and verify SDK cleanup over repeated runs.
             try:
              output=verify(page,'win32-text')
              results.append({'case':'runtime-sdk-services','passed':True,'output':output})
             finally:page.evaluate('()=>{vb6Application.dispose();delete globalThis.vb6Application;}')"""
          assert old in s;s=s.replace(old,new);p.write_text(s)
          for name,(before,after) in hashes.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==after,name
          print('All six authored corrections match independently tested source hashes.')
          PY
          npm run build
          npm test > /tmp/services-tests.txt
          npm run pack:win32-browser > /tmp/services-package-tests.txt
          git diff --check -- . ':!dist' ':!src/exporter/runtime-payload.js' ':!src/editor/diagnostics-payload.js' ':!packages/win32-browser/dist'
          git diff --exit-code -- .github
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add packages/win32-browser tools/browser-win32-services.py tools/win32-services-contracts.mjs tools/win32-services-oracle.ps1 dist src/exporter/runtime-payload.js
          git commit -m 'fix(win32-browser): match native UTF-16 substitution, validate Base64 pointers and await SDK paint'
          test "$(git ls-remote origin refs/heads/feature/win32-common-services | cut -f1)" = "$(cat /tmp/services-starting-head.txt)"
          git push origin HEAD:refs/heads/feature/win32-common-services
      - name: Retain exact source and test output
        if: always()
        run: |
          git bundle create /tmp/services-fixed.bundle HEAD
          git rev-parse HEAD HEAD^{tree} > /tmp/services-fixed-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: services-native-fix
          path: |
            /tmp/services-fixed.bundle
            /tmp/services-fixed-revision.txt
            /tmp/services-tests.txt
            /tmp/services-package-tests.txt
            release/vb6-win32-browser-*.tgz
          retention-days: 7
