name: Debugger final source review
on:
  push:
    branches: [feat/debugger-compatibility-boundaries]
    paths: ['.github/workflows/debugger-finish-review.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git bundle create /tmp/debugger-finish.bundle --all
          git rev-parse HEAD origin/main > /tmp/debugger-finish.refs
      - uses: actions/upload-artifact@v4
        with:
          name: debugger-finish-review
          path: /tmp/debugger-finish.*
          retention-days: 3
