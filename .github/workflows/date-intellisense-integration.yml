name: Integrate current declarations with native Date
on:
  push:
    branches: [feat/win32-date-export]
    paths: [.github/workflows/date-intellisense-integration.yml]
permissions:
  contents: write
concurrency:
  group: date-intellisense-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/win32-date-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve pinned main and regenerate only generated conflicts
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          target=bd7716067f0a30dc49e4d621c892a8475100363d
          git merge-base --is-ancestor 2b4f9dd50fc20c36f2a48d3c8586e4063277ff69 "$target"
          if ! git merge --no-commit --no-ff "$target"; then
            python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=U']).decode().splitlines()
          assert paths,'Merge failed without generated conflicts'
          for p in paths:
            assert p.startswith('dist/') or p in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js'],'Unreviewed source conflict: '+p
          for p in paths:
            subprocess.run(['git','checkout','--ours','--',p],check=True)
            subprocess.run(['git','add','--',p],check=True)
          PY
          fi
          npm run build
          npm test
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git commit -m 'merge: preserve latest declaration context alongside native Date support' -m 'Retain main bd7716067f0a30dc49e4d621c892a8475100363d, rebuild generated conflicts only and rerun the complete integrated suite. DateSerial correction and all original and expanded Windows reference tests remain intact.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/feat/win32-date-export
