name: Prepare agent thread bundles
on:
  push:
    branches: [feat/agent-conversation-thread-budgets]
permissions:
  contents: write
concurrency:
  group: agent-thread-preparation
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/agent-conversation-thread-budgets'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply immutable hash-checked source and documentation update
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          source = subprocess.check_output(['git', 'show', '12be991febdba59ffad5f431fdb39934e8b7e88a:.github/workflows/agent-thread-prepare.yml'], text=True)
          assert subprocess.check_output(['git', 'hash-object', '--stdin'], input=source, text=True).strip() == '1a95b2dcb3e160b08b8b575f2871a7dc55be18dc'
          marker = "          python3 - <<'PY'\n"
          assert source.count(marker) == 1
          block = source.split(marker, 1)[1].split('          PY\n', 1)[0]
          exec(compile(textwrap.dedent(block), 'verified-agent-thread-update.py', 'exec'))
          PY
      - name: Preserve source changes and integrate reviewed current main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'feat(agents): add live VB6 conversation threads and cumulative session budgets'
          test "$(git rev-parse a098f73921a624e30c26a3aad07c76a14e10073e^{tree})" = a3ae6fdecbb63424aea1dedeb3eaefefd308ac4b
          git merge --no-commit --no-ff a098f73921a624e30c26a3aad07c76a14e10073e
      - name: Build standalone artifacts from combined source
        shell: bash
        run: npm run build | tee agent-thread-build.log
      - name: Agent protocol, limits, relay and thread tests
        shell: bash
        run: npm run test:agents | tee agent-thread-tests.log
      - name: Complete repository test suite
        shell: bash
        run: npm test | tee agent-thread-full-tests.log
      - name: Install the pinned cross-browser validation environment
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Resolve Chromium executable
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PY
      - name: Chromium real HTTP, standalone HTTP and standalone file conversations
        run: python tools/coding-agents-browser-tests.py --browser chromium
      - name: Firefox real HTTP, standalone HTTP and standalone file conversations
        run: python tools/coding-agents-browser-tests.py --browser firefox
      - name: WebKit real HTTP, standalone HTTP and standalone file conversations
        run: python tools/coding-agents-browser-tests.py --browser webkit
      - name: Commit tested merge and reproducible bundles; remove all preparation files
        shell: bash
        run: |
          git add -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git rm -- .github/workflows/agent-thread-prepare.yml tools/.agent-thread-update.part0 tools/.agent-thread-update.part1 tools/.agent-thread-update.part2 tools/.agent-thread-update.part3
          git diff --cached --check
          git commit -m 'build(agents): validate all browser origins and preserve current main in standalone bundles'
          git push origin HEAD:feat/agent-conversation-thread-budgets
          git rev-parse HEAD > head.txt
          git ls-files -z | xargs -0 sha256sum > tracked-SHA256SUMS.txt
          git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-thread-preparation-validation
          path: |
            agent-thread-build.log
            agent-thread-tests.log
            agent-thread-full-tests.log
            reports/coding-agents/
            head.txt
            tracked-SHA256SUMS.txt
            source.tar.gz
          retention-days: 7
