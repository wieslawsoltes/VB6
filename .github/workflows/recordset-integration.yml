name: Integrate client recordsets
on:
  push:
    branches: [feat/data-recordset-compat]
    paths: [.github/workflows/recordset-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decode exact reviewed source patch
        run: |
          python - <<'PY'
          import base64,hashlib,pathlib,subprocess
          paths=['src/data/connected-recordset.js','src/data/common.js','src/data/sqlite.js','docs/DATA-SOURCES.md']
          dictionary=b''.join(subprocess.check_output(['git','show','7d821e026b7c7cd34cfc07c452647260080e492e:'+p]) for p in paths)
          assert hashlib.sha256(dictionary).hexdigest()=='40a1c875a213369378cf49f7af5fbb599a8b09ae93c91391314807eae7741677'
          pathlib.Path('/tmp/recordset-dictionary').write_bytes(dictionary)
          packed=''''''
          pathlib.Path('/tmp/recordsets.zst').write_bytes(base64.b64decode(packed,validate=True))
          subprocess.run(['zstd','-d','--patch-from=/tmp/recordset-dictionary','/tmp/recordsets.zst','-o','/tmp/recordsets.patch'],check=True)
          patch=pathlib.Path('/tmp/recordsets.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='b1adedda7e9d00bb49b597398c349bff95112868d3b8d452d742c33c32559ca2'
          subprocess.run(['git','apply','--check','/tmp/recordsets.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/recordsets.patch'],check=True)
          PY
      - name: Build and validate complete implementation
        run: |
          set -euo pipefail
          mkdir -p /tmp/recordset-result
          npm run build
          npm test | tee /tmp/recordset-result/node-tests.log
      - name: Publish validated source and generated bundles
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/data-recordset-compat | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code HEAD -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data docs/DATA-SOURCES.md tests/data-batch.test.mjs tools/browser-data-recordsets.py dist src/exporter/runtime-payload.js
          git commit -m 'feat(data): client batch recordsets, clones, conflicts and keyed resynchronization'
          git push origin HEAD:refs/heads/feat/data-recordset-compat
          git rev-parse HEAD > /tmp/recordset-result/head.txt
          git archive HEAD | gzip > /tmp/recordset-result/source.tar.gz
          git bundle create /tmp/recordset-result/repository.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recordset-integration
          path: /tmp/recordset-result
          retention-days: 7
