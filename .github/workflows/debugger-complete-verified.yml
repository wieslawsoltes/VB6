name: Complete verified debugger integration
on:
  push:
    branches: [feat/vb6-debugger-runtime]
    paths: ['.github/workflows/debugger-complete-verified.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/vb6-debugger-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce locally reviewed source integration
        run: |
          python - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          data=''
          # Reverse transport-only transcription corrections before checksum validation.
          data=data.replace('ubtZVtV2','ubtZtV2').replace('82vqWZZ+','82vqWZ+').replace('M/XroZictM','M/XroZvcM')
          raw=zlib.decompress(base64.b64decode(data))
          assert hashlib.sha256(raw).hexdigest()=='c62d1ba40db1cdd5e27427a0321e2f19e2b3f6dab594c26c496ee2d475ec4b85'
          Path('/tmp/debugger-reviewed-integration.py').write_bytes(raw)
          PY
          python /tmp/debugger-reviewed-integration.py
      - name: Unit regressions
        run: npm test | tee /tmp/debugger-verified-unit.log
      - name: Install browser test engines
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium firefox webkit
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH='+p.chromium.executable_path)
          PY
      - name: Debugger Chromium Firefox and WebKit
        run: |
          for browser in chromium firefox webkit; do
            VB6_BROWSER="$browser" python tools/browser-debugger-runtime.py
            cp reports/debugger-runtime/results.json "/tmp/debugger-verified-$browser.json" || true
          done
      - name: Existing core editor Win32 and MCP browser regressions
        run: |
          python tools/browser-tests.py
          python tools/browser-intellisense-tests.py
          python tools/browser-win32-compat-tests.py
          python tools/mcp-agent-browser-tests.py
      - name: Reproducible generated output
        run: |
          npm run build
          git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples packages/win32-browser/dist
      - name: Publish only if branch has not changed
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/vb6-debugger-runtime | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/vb6-debugger-runtime
          git rev-parse HEAD > /tmp/debugger-verified.sha
          git bundle create /tmp/debugger-verified.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debugger-verified-integration
          path: |
            /tmp/debugger-verified.*
            /tmp/debugger-verified-*.log
            /tmp/debugger-verified-*.json
            /tmp/debugger-reviewed-integration.py
            reports/debugger-runtime
            reports/browser-tests.json
            reports/intellisense
            reports/mcp-agent-browser.json
          retention-days: 7
