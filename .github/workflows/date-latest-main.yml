name: Reconcile Date export with current classic IDE
on:
  push:
    branches: [feat/win32-date-export]
    paths: [.github/workflows/date-latest-main.yml]
permissions:
  contents: write
concurrency:
  group: date-latest-main
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/win32-date-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve pinned main and regenerate only generated conflicts
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          target=2b4f9dd50fc20c36f2a48d3c8586e4063277ff69
          git merge-base --is-ancestor 29c77082c9bf854c7f6fbbf3ed63d5277036b761 "$target"
          if ! git merge --no-commit --no-ff "$target"; then
            python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=U']).decode().splitlines()
          if not paths:raise SystemExit('Merge failed without generated conflicts')
          for p in paths:
              if not (p.startswith('dist/') or p in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js']):
                  raise SystemExit('Source conflict requires review: '+p)
          for p in paths:
              subprocess.run(['git','checkout','--ours','--',p],check=True)
              subprocess.run(['git','add','--',p],check=True)
          PY
          fi
          npm run build
          npm test
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git rm .github/workflows/date-normalization-fix.yml
          git diff --cached --check
          git commit -m 'merge: preserve classic HTML rendering and notices with native Date fixes' -m 'Retain pinned main 2b4f9dd50fc20c36f2a48d3c8586e4063277ff69 and exact DateSerial corrections. Regenerate only generated conflicts, keep all original source changes and attribution, run the complete suite and remove the finished source-correction helper.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/feat/win32-date-export
