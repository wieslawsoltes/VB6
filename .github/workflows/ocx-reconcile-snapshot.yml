name: OCX reconciliation validation
on:
  push:
    branches: [feat/ocx-container-source]
permissions:
  contents: read
concurrency:
  group: ocx-reconcile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/ocx-container-source'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce exact locally tested source
        run: |
          python .ocx-prepare.py
          git archive $(git write-tree) | gzip > "$RUNNER_TEMP/ocx-source.tar.gz"
      - name: Complete regression suite and artifact verification
        run: |
          npm test
          git diff --exit-code -- src tests tools docs examples dist
      - uses: actions/upload-artifact@v4
        with:
          name: ocx-verified-source
          path: ${{ runner.temp }}/ocx-source.tar.gz
          retention-days: 7
  native:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    env:
      VB6_COM_ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ocx-verified-source
      - run: tar -xzf ocx-source.tar.gz
      - name: Real COM container, persistence and property-browsing contracts
        run: node tools/interop/test-container-contracts.mjs
      - name: Existing native Automation, ActiveX and OCX compatibility
        run: |
          node tools/interop/test-native.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/interop/test-activex.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/interop/test-ocx.mjs
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocx-final-native-${{ matrix.architecture }}
          path: reports/native-interop
          if-no-files-found: error
          retention-days: 7
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      VB6_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ocx-verified-source
      - run: tar -xzf ocx-source.tar.gz
      - run: npm run build
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Actual modular HTTP, standalone HTTP and file-origin OCX workflows
        run: python tools/browser-ocx-tests.py
      - name: Actual source-control lab HTTP and file workflows
        run: python tools/browser-ocx-source-lab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocx-final-browser-${{ matrix.browser }}
          path: reports/ocx-browser
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [source, native, browser]
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/ocx-container-source'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish only the exact source validated by all three jobs
        run: |
          python .ocx-prepare.py
          # Keep workflow editing outside the job token's authority. The authorized
          # connector removes this temporary workflow after verifying publication.
          git restore --staged .github/workflows/ocx-reconcile-snapshot.yml
          rm .ocx-source.{1,2,3,4,5,6} .ocx-prepare.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ocx): execute source PropertyPages and preserve typed-array event contracts'
          git bundle create "$RUNNER_TEMP/ocx-final.bundle" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/ocx-final.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ocx-final-publication
          path: |
            ${{ runner.temp }}/ocx-final.bundle
            ${{ runner.temp }}/ocx-final.txt
          retention-days: 7
      - name: Push with normal fast-forward protection
        run: git push origin HEAD:refs/heads/feat/ocx-container-source
