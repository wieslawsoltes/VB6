name: Integrate verified debugger fixes
on:
  push:
    branches: [feat/debugger-compatibility-boundaries]
    paths: ['.github/workflows/debugger-finish-integrate.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge reviewed main and apply exact tested fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          patch=Path('.github/debugger-final.patch')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='038fee06bf91ce59fd383fd999ac0c5667fd7c11d0900b1a2ede9ae23585c6a3'
          result=subprocess.run(['git','merge','--no-commit','--no-ff','5e9a3191ff04d00b13e4f100c48e219a836b7a4b'])
          if result.returncode:
              conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
              assert conflicts and all(p.startswith('dist/') or p=='src/exporter/runtime-payload.js' for p in conflicts), conflicts
              subprocess.run(['git','checkout','--ours','--',*conflicts],check=True)
              subprocess.run(['git','add','--',*conflicts],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          expected={'tools/native-debugger-smoke.mjs':'8b3880dfda17feaf2c3cdba01c7018099036ac3d2e630259a9322b09d6c4a78f','tools/recovery-browser-tests.py':'dd7b6d0c1b4fb933e26ad791bea1ca8844784ccf806330fff8699dc06a6ae686','tests/native-debugger-stop.test.mjs':'70a89c536cb5b3b76f98b331b72302988251bba8fb2d8b63a9feb2e68a478a92','tools/native-debugger-stop.mjs':'caf56d21fe8d9e3cf73d8c788271adf1ced9073f1444b950db393f36a3829e63'}
          for path,digest in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          patch.unlink()
          PY
      - run: npm run build
      - name: Complete Node regressions
        run: npm test | tee /tmp/debugger-finish-unit.log
      - name: Commit validated source and regenerated bundles
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git add -A
          git diff --cached --check
          git commit -m 'fix(debugger): verify native stop context, preserve debugger panes and integrate current main'
          test "$(git ls-remote origin refs/heads/feat/debugger-compatibility-boundaries | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/debugger-compatibility-boundaries
          git rev-parse HEAD > /tmp/debugger-finish-candidate.sha
          git bundle create /tmp/debugger-finish-candidate.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debugger-finish-candidate
          path: /tmp/debugger-finish-*
          retention-days: 7
