name: Integrate main into browser windows
on:
  push:
    branches: [feat/detached-browser-windows]
    paths: [.github/workflows/materialize-windows.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge reviewed main change and resolve generated files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 9fbad97ed453a05f83ce217ccbd77a32114c5444 || true
          python - <<'PY'
          import subprocess
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          for path in conflicts:
              assert path.startswith('dist/') or path == 'src/exporter/runtime-payload.js', 'Manual source conflict: ' + path
          for path in conflicts:
              subprocess.run(['git','checkout','--ours','--',path],check=True)
              subprocess.run(['git','add','--',path],check=True)
          PY
      - name: Use the newly merged command icon catalog in popup menus
        run: |
          python - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('src/ide/browser-windows.js')
          text=p.read_text()
          assert hashlib.sha256(text.encode()).hexdigest() == 'c8158fe5002863c04529efeb3ced71af19bc15979b44db631379e03ad91f996b'
          text=text.replace("import {showMenu, menuIsOpen, closeMenu} from '../theme/menu.js';", "import {menuIsOpen, closeMenu} from '../theme/menu.js';\nimport {showMenu} from './ui.js';")
          p.write_text(text)
          PY
      - run: npm run build
      - run: npm test
      - name: Commit integrated source and deterministic generated builds
        run: |
          git diff --check
          git add -A
          git commit -m 'merge: preserve main icon improvements alongside detached window support'
          git merge-base --is-ancestor 9fbad97ed453a05f83ce217ccbd77a32114c5444 HEAD
          git archive --format=tar HEAD > /tmp/windows-source.tar
          git push origin HEAD:refs/heads/feat/detached-browser-windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-window-source
          path: /tmp/windows-source.tar
          if-no-files-found: ignore
          retention-days: 7
