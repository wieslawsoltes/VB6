name: Materialize detached-window source
on:
  push:
    branches: [feat/detached-browser-windows]
    paths: [.windows-stage/**, .github/workflows/materialize-windows.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply exact reviewed source images
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil
          root = pathlib.Path.cwd()
          stage = root / '.windows-stage'
          manifest = ''.join(p.read_text() for p in sorted(stage.glob('part-*.txt')))
          assert hashlib.sha256(manifest.encode()).hexdigest() == 'b58bce1c037e93e6b3a08ddf0c88cd44d20933a1d681dcdd95a295fcc5faaa5d', 'Manifest transfer mismatch'
          pending = []
          for entry in json.loads(manifest):
              path = root / entry['path']
              assert path.resolve().is_relative_to(root) and '.git' not in path.parts
              before = path.read_text() if path.exists() else None
              digest = lambda text: hashlib.sha256(text.encode()).hexdigest() if text is not None else None
              if digest(before) == entry['after']:
                  continue
              assert digest(before) == entry['before'], 'Base changed: ' + entry['path']
              if 'content' in entry:
                  after = entry['content']
              elif 'chunks' in entry:
                  after = ''.join(entry['chunks'])
              else:
                  after = before
                  for start, end, replacement in reversed(entry['edits']):
                      assert 0 <= start <= end <= len(before)
                      after = after[:start] + replacement + after[end:]
              assert digest(after) == entry['after'], 'Post-image mismatch: ' + entry['path']
              assert not entry['path'].startswith('.github/'), 'Workflow changes must use the authenticated connector'
              pending.append((path, after))
          for path, after in pending:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(after)
          shutil.rmtree(stage)
          print('Verified and applied', len(pending), 'source images')
          PY
      - run: npm run build
      - run: npm test
      - name: Commit exact source and generated builds without force pushing
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: detach live IDE tools, documents and toolbars into browser windows'
          git push origin HEAD:refs/heads/feat/detached-browser-windows
          git archive --format=tar HEAD > /tmp/windows-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: detached-window-source
          path: /tmp/windows-source.tar
          retention-days: 7
