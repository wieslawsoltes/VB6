name: Rebuild final debugger distributions
on:
  push:
    branches: [feat/debugger-compatibility-boundaries]
    paths: ['.github/workflows/debugger-integrate.yml']
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/debugger-compatibility-boundaries'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Record reproducible output and remove this one-time build workflow
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          rm .github/workflows/debugger-integrate.yml
          git add -u
          git diff --cached --check
          npm run build
          git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples packages/win32-browser/dist
          test "$(git ls-remote origin refs/heads/feat/debugger-compatibility-boundaries | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: regenerate validated debugger bundles and remove temporary build workflow'
          git push origin HEAD:refs/heads/feat/debugger-compatibility-boundaries
