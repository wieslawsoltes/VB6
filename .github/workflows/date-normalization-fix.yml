name: Apply measured DateSerial normalization fix
on:
  push:
    branches: [feat/win32-date-export]
    paths: [.github/workflows/date-normalization-fix.yml]
permissions:
  contents: write
concurrency:
  group: date-normalization-fix
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/win32-date-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed corrections with exact source fingerprints
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 5672359df7007709f7c6be62d7c324087244971a HEAD
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          hashes={
           'src/native/dates.js':('52981673fb7f807d0cc85a5133d8940909a845ccf302e196e00fbb6e6123b9e1','c5eb3b2c064348babad699a6dff4b000fae01f5fbed044daa407f91f55827d31'),
           'tools/win32-date-fixtures.mjs':('15ccb7b4aa779180f4bc2cf47162eb13cac1db9cfa8699a5c2575f62c4942c28','84393e1634a33ebc706e30195445ed33c1406f6aa28a62477d8c01a35e21c3ab'),
           'tools/win32-date-reference.mjs':('6465b965799aeac2cbc2c13ee70e1d6170ed6cd621904eb39951ded096efcb3f','9e221c01d944c3bd4388b7aa076c247d67bdf6571574b4d39c4d0fc762788acf'),
           'tests/win32-date-reference.test.mjs':('a1603b106816e895fe0c75e9e94afff4a8c4e02b306db86bd12c13ed7b5ece0e','96d240d98e847ec15bde9a1aa94d15ff41067583a4b384519411d1f18da2fd07'),
           'docs/WIN32-DATES.md':('fd74e39335ba7012f5e71bc5159152e198201ec159ac4b772df106f103d88a16','409c616c1ec0ad9efa8d12ce793bc057fc4a03e3b5d098dacf371879ae42973f')
          }
          digest=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          for p,(before,after) in hashes.items():assert digest(p)==before,'Unexpected input: '+p
          p=Path('src/native/dates.js');s=p.read_text();a=s.index('  // dateserial(year,month,day,out):');b=s.index('  x.emit(0x83,0xfa,2)',a)
          replacement=[
           '  // Month normalization precedes the short-year window. Expanding first would',
           '  // turn DateSerial(99,13,1) into 2000 rather than year 0100. The expanded year',
           '  // must be valid before the day offset: a negative day cannot rescue year 10000.',
           "  x.label(D+'dateserial').enter(24).value(arg(8)).emit(0x89,0xc3);",
           '  // floor((month-1)/12), with a positive remainder in 0..11.',
           "  x.value(arg(12)).emit(0x48,0x99,0xb9).imm(12).emit(0xf7,0xf9,0x85,0xd2).branch('ns',normalized).emit(0x48,0x83,0xc2,12).label(normalized).emit(0x01,0xc3,0x42,0x89,0x55,0xf8);",
           "  x.emit(0x89,0xd8).compare(100).branch('ge',fullYear);",
           "  x.api('kernel32.dll','GetCalendarInfoW',[0x400,1,0x20000030,0,0,addr(-4)]).test().branch('e','error:5');",
           "  x.value(arg(-4)).emit(0x31,0xd2,0xb9).imm(100).emit(0xf7,0xf1,0x6b,0xc0,100,0x39,0xd3).branch('le',century).emit(0x83,0xe8,100).label(century).emit(0x01,0xc3);",
           "  x.label(fullYear).emit(0x89,0xd8).compare(100).branch('l','error:5').compare(9999).branch('g','error:5').emit(0x8b,0x55,0xf8);"
          ];p.write_text(s[:a]+'\n'.join(replacement)+'\n'+s[b:])
          p=Path('tools/win32-date-fixtures.mjs');s=p.read_text().replace("check('DateSerial(100,0,32) = #0100-01-01# And DateSerial(9999,13,-30) = #9999-12-01#','DateSerial checks final normalized range, not intermediate fields');", "check('DateSerial(99,13,1) = #0100-01-01# And DateSerial(101,0,1) = #0100-12-01#','DateSerial normalizes months before expanding a short year');\n  check('DateSerial(10000,0,1) = #9999-12-01#','month normalization can first bring a large year back in range');\n  check('DateSerial(100,0,32) = DateSerial(99,12,32)','month-derived short years use the same current NLS window');")
          s=s.replace("['d = DateSerial(100,1,0)',5,'DateSerial final result out of range'],", "['d = DateSerial(100,1,0)',5,'DateSerial final result out of range'],\n    ['d = DateSerial(9999,13,-30)',5,'DateSerial invalid normalized year cannot be rescued by a negative day'],");p.write_text(s)
          p=Path('tools/win32-date-reference.mjs');s=p.read_text().replace(' ])))\n];', ' ]))),\n // Extend, never replace, the original 177 independent reference expressions.\n // Negative years and large month/day offsets exercise both normalization orders.\n ...[-32768,-2001,-2000,-1999,-1901,-1900,-1899,-101,-100,-99,49,50,32767].flatMap(y=>[-32768,0,1,13,32767].flatMap(m=>[-32768,1,32767].map(d=>[\n   `DateSerial extended (${y},${m},${d})`, `CLng(CDbl(DateSerial(${y},${m},${d})))`\n ])))\n];');p.write_text(s)
          p=Path('tests/win32-date-reference.test.mjs');s=p.read_text()+"\n\ntest('Date differential coverage retains the original boundary probes and adds negative-year and extreme offsets',async()=>{\n const {DATE_CONTRACTS}=await import('../tools/win32-date-reference.mjs');\n assert.equal(DATE_CONTRACTS[29][1],'CLng(CDbl(DateSerial(100,0,32)))');\n assert.equal(DATE_CONTRACTS[30][1],'CLng(CDbl(DateSerial(9999,13,-30)))');\n assert.equal(DATE_CONTRACTS.length,372);\n for(const expression of ['DateSerial(-32768,32767,1)','DateSerial(-1900,1,32767)','DateSerial(-99,0,-32768)','DateSerial(32767,-32768,1)'])\n  assert.ok(DATE_CONTRACTS.some(([,source])=>source===`CLng(CDbl(${expression}))`));\n assert.equal(new Set(DATE_CONTRACTS.map(([name])=>name)).size,DATE_CONTRACTS.length);\n});\n";p.write_text(s)
          p=Path('docs/WIN32-DATES.md');s=p.read_text().replace("nearest-even numeric conversion, month/day normalization and a final year-range\ncheck (100 through 9999), including normalization across intermediate range\nboundaries. Two-digit years use the Windows user's Gregorian calendar window;", "nearest-even numeric conversion and Gregorian normalization. The month is\nnormalized first; the resulting short year is expanded with the Windows user's\nGregorian calendar window. That expanded year must be within 100 through 9999\nbefore normalizing the day, and the final date must also remain in range.\n`DateSerial(99,13,1)` therefore denotes year 0100, while\n`DateSerial(9999,13,-30)` fails: a negative day cannot rescue normalized year\n10000. The separate installed Script Host suite measures these edge cases;\nordinary-calendar tests alone did not expose the earlier normalization-order bug.\nTwo-digit years use the Windows user's Gregorian calendar window;")
          s+='\nThe Script Host suite retains its original 177 expressions and adds 195 probes\nfor negative years, cutoff-adjacent years and extreme signed month/day offsets.\nExpected values and errors are obtained from the installed host on each run,\nnot recomputed using the native compiler\'s arithmetic. The ordinary Date fixture\nalso checks both intermediate-year and final-date rejection without overwriting\nthe assignment target. This reference is not licensed Microsoft VB6 certification.\n';p.write_text(s)
          for p,(before,after) in hashes.items():assert digest(p)==after,'Incorrect result: '+p
          PY
          npm run build
          npm test
          node tools/win32-date-fixtures.mjs
          node tools/win32-date-reference.mjs --prepare
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add src/native/dates.js tests/win32-date-reference.test.mjs tools/win32-date-fixtures.mjs tools/win32-date-reference.mjs docs/WIN32-DATES.md dist
          git diff --cached --check
          git commit -m 'fix(native): normalize DateSerial months before year expansion and range checks' -m 'Fix the actual installed-Windows differential failure, retain all 177 original reference inputs, add 195 boundary probes, and update incorrect core fixture assumptions based on measured reference results. Rebuild and test complete source; native differential execution remains mandatory.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/feat/win32-date-export
