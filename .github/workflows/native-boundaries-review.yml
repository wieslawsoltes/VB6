name: Native boundaries review snapshot
on:
  push:
    branches: [feat/native-compatibility-boundaries]
    paths: [.github/workflows/native-boundaries-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git bundle create native-review.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: native-boundaries-review-history
          path: native-review.bundle
          retention-days: 2
