name: Integrate issue 39 visual fixes
on:
  push:
    branches: [fix/issue-39-visual-fidelity]
    paths: [.github/workflows/issue39-integrate.yml]
permissions:
  contents: write
concurrency:
  group: issue39-source-integration
  cancel-in-progress: true
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/fix/issue-39-visual-fidelity'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild portable bundles and validate the full integrated source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge-base --is-ancestor 30febe16733be5d71eb4428d4888866947a088fe HEAD
          npm run build
          npm test
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git commit -m 'Regenerate platform-independent issue 39 bundles after full 2474-test validation'
          npm run build
          git diff --exit-code
          mkdir -p issue39-artifact
          git archive --format=tar.gz HEAD > issue39-artifact/source.tar.gz
          git rev-parse HEAD HEAD^{tree} > issue39-artifact/revision.txt
          sha256sum issue39-artifact/source.tar.gz > issue39-artifact/SHA256SUMS.txt
          test "$(git ls-remote origin refs/heads/fix/issue-39-visual-fidelity | cut -f1)" = '${{ github.sha }}'
          git push origin HEAD:fix/issue-39-visual-fidelity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-integrated-source
          path: issue39-artifact/
          retention-days: 3
