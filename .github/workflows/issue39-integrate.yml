name: Integrate issue 39 visual fixes
on:
  push:
    branches: [fix/issue-39-visual-fidelity]
    paths: [.github/workflows/issue39-integrate.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/fix/issue-39-visual-fidelity'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge pinned main, rejecting handwritten conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 30febe16733be5d71eb4428d4888866947a088fe || {
            test -n "$(git diff --name-only --diff-filter=U)"
            while IFS= read -r path; do
              case "$path" in
                dist/*|src/exporter/runtime-payload.js|src/editor/diagnostics-payload.js) git checkout --ours -- "$path"; git add -- "$path" ;;
                *) echo "Handwritten conflict requires review: $path"; exit 1 ;;
              esac
            done < <(git diff --name-only --diff-filter=U)
          }
          npm run build
          npm test
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git commit -m 'Merge current main into issue 39 visual fixes and regenerate combined distributions'
          npm run build
          git diff --exit-code
          test "$(git ls-remote origin refs/heads/fix/issue-39-visual-fidelity | cut -f1)" = '${{ github.sha }}'
          git push origin HEAD:fix/issue-39-visual-fidelity
      - name: Archive reviewed integration sources
        run: |
          mkdir -p /tmp/issue39-source
          git archive --format=tar.gz HEAD > /tmp/issue39-source/source.tar.gz
          git rev-parse HEAD HEAD^{tree} > /tmp/issue39-source/revision.txt
          sha256sum /tmp/issue39-source/source.tar.gz > /tmp/issue39-source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: issue39-integrated-source
          path: /tmp/issue39-source/
          retention-days: 3
