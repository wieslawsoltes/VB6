name: Publish saved data continuation
on:
  push:
    branches: [feat/data-rdo-gateway-compat]
    paths: [.data-publish/source.json]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify saved source and preserve concurrent main changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/data-rdo-gateway-compat | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/data-publish-result
          python - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          spec = json.loads(pathlib.Path('.data-publish/source.json').read_text())
          base = '0a0b6448718e4836074b2acf1912fa1dab3c9563'
          assert spec['base'] == base
          assert spec['source_commit'] == '352ebd6f961c4f199d2db07af7f831f615cc7fbd'
          dictionary = b''
          for path in spec['paths']:
              assert path.startswith(('docs/', 'src/data/', 'tests/', 'tools/')) and '..' not in path.split('/')
              result = subprocess.run(['git', 'show', base + ':' + path], capture_output=True)
              if result.returncode == 0: dictionary += result.stdout
          assert hashlib.sha256(dictionary).hexdigest() == '8c073a1273a61f280046a22b5dd9ddb68ff318611b2ad6039544c0b306ac762a'
          pathlib.Path('/tmp/data-publish.dictionary').write_bytes(dictionary)
          pathlib.Path('/tmp/data-publish.zst').write_bytes(base64.b64decode(spec['patch_zstd_base64'], validate=True))
          subprocess.run(['zstd', '-d', '--patch-from=/tmp/data-publish.dictionary', '/tmp/data-publish.zst', '-o', '/tmp/data-publish.patch'], check=True)
          assert hashlib.sha256(pathlib.Path('/tmp/data-publish.patch').read_bytes()).hexdigest() == '98e324b928b6ca151f7ae5a67c3c031980956d621bee302e2aa46c52d9f83ba6'
          result = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', '29c77082c9bf854c7f6fbbf3ed63d5277036b761'])
          conflicts = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
          assert all(p.startswith('dist/') or p == 'src/exporter/runtime-payload.js' for p in conflicts), conflicts
          assert result.returncode == 0 or conflicts, 'Unexpected merge failure'
          if conflicts: subprocess.run(['git', 'restore', '--source=HEAD', '--staged', '--worktree', '--', *conflicts], check=True)
          subprocess.run(['git', 'apply', '--3way', '--index', '/tmp/data-publish.patch'], check=True)
          PY
      - name: Rebuild and validate integrated applications
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee /tmp/data-publish-result/build.log
          npm test | tee /tmp/data-publish-result/node-tests.log
          git diff --exit-code HEAD -- .github/workflows
      - name: Publish validated source without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/data-rdo-gateway-compat | cut -f1)" = "$GITHUB_SHA"
          git rm -f .data-publish/source.json
          git add -A
          git commit -m 'fix(data): publish saved native compatibility continuation and integrate current main' -m 'Recover source from local commit 352ebd6f961c4f199d2db07af7f831f615cc7fbd using SHA-256 verified delta 98e324b928b6ca151f7ae5a67c3c031980956d621bee302e2aa46c52d9f83ba6. Preserve merged provider PR #29 and main 29c77082c9bf854c7f6fbbf3ed63d5277036b761. Regenerate application distributions and run the complete Node suite before publication.'
          git push origin HEAD:refs/heads/feat/data-rdo-gateway-compat
          git rev-parse HEAD > /tmp/data-publish-result/head.txt
          git ls-tree -r HEAD > /tmp/data-publish-result/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-data-continuation
          path: /tmp/data-publish-result
          retention-days: 14
