name: Prepare selective agent review source
on:
  push:
    branches: [feat/agent-selective-review]
    paths: [.github/workflows/agent-selective-prepare.yml]
permissions:
  contents: write
concurrency:
  group: agent-selective-preparation
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/agent-selective-review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed source patch
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = d38aa69ceaa2838d561e2e2c0f34c7e58ad5f643
          test "$(git rev-parse HEAD~2)" = 5ad8ea7815877347230dda6e5254ada4181aa61c
          test "$(git rev-parse 'HEAD~2^{tree}')" = de70c9377ba3bfab13539ddf43c1283c52fd6b93
          git rev-parse HEAD > publication-base.txt
          python3 - <<'PY'
          import base64, hashlib, subprocess, zlib
          from pathlib import Path
          hashes = ['8e11200dbcff95bdec2f58a7c9193a79ef08dcdd','e66cc51c6b2a6310604425073c9c5e17a297a94f','d553847331ecea4e4cd478afadb4ba4794bc59aa','0521549a35bfcdec42d979fe0fddaef31a24a028','223663673d7f85473dff1739c6b702815f1fb690']
          pieces = []
          for i, expected in enumerate(hashes):
              p = Path('tools/.agent-selective-update.part' + str(i))
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == expected
              pieces.append(p.read_text())
          patch = zlib.decompress(base64.b64decode(''.join(pieces), validate=True))
          assert len(patch) == 60225
          assert hashlib.sha256(patch).hexdigest() == '6af72ec48b3485f706a1c200b33ad406b641f733d393585f5bdef5ebe1b1c9cb'
          Path('selective-reviewed.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          allowed = {'README.md','docs/CODING-AGENT-WORKBENCH.md','src/agents/changes.js','src/agents/followups.js','src/agents/review-hunks.js','src/agents/studio.js','src/agents/workbench-view.js','tests/coding-agents-compaction.test.mjs','tests/coding-agents-hunks.test.mjs','tools/coding-agents-browser-tests.py'}
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual == allowed, actual ^ allowed
          PY
      - name: Build reproducible distributions
        shell: bash
        run: npm run build | tee selective-build.log
      - name: Complete repository tests
        shell: bash
        run: npm test | tee selective-full-tests.log
      - name: Agent and relay tests
        shell: bash
        run: npm run test:agents | tee selective-agent-tests.log
      - name: Remove preparation files and verify complete tested product tree
        shell: bash
        run: |
          git add -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git rm -- .github/workflows/agent-selective-prepare.yml tools/.agent-selective-update.part0 tools/.agent-selective-update.part1 tools/.agent-selective-update.part2 tools/.agent-selective-update.part3 tools/.agent-selective-update.part4
          git diff --cached --check
          test "$(git write-tree)" = df06e98e6ed8b0a298d4e1668688250a613e270f
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(agents): selective source restoration and stable review state'
      - name: Publish tested feature branch only
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/feat/agent-selective-review | cut -f1)" = "$(cat publication-base.txt)"
          git push origin HEAD:feat/agent-selective-review
          git rev-parse HEAD > head.txt
          git rev-parse HEAD^{tree} > tree.txt
          git ls-files -z | xargs -0 sha256sum > tracked-SHA256SUMS.txt
          git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-review-source-validation
          path: |
            selective-build.log
            selective-full-tests.log
            selective-agent-tests.log
            selective-reviewed.patch
            publication-base.txt
            head.txt
            tree.txt
            tracked-SHA256SUMS.txt
            source.tar.gz
          retention-days: 7
