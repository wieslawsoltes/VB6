name: Win32 common services
on:
  push:
    branches: [main, feature/win32-common-services]
  pull_request:
permissions:
  contents: read
concurrency:
  group: win32-services-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture actual installed Windows service contracts
        shell: pwsh
        run: ./tools/win32-services-oracle.ps1
      - name: Require exact comparison of every recorded field
        run: node tools/win32-services-contracts.mjs reports/win32-services-native/windows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-services-native
          path: reports/win32-services-native/
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Six real samples through HTTP, file, classic IDE, SDK and worker
        env:
          BROWSER: ${{ matrix.browser }}
        run: python tools/browser-win32-services.py
      - name: Require every scenario without inline substitution or skips
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reports/win32-services/results.json'))
          assert not r['inline']
          assert len(r['results'])==21
          assert all(x.get('passed') is True and not x.get('skipped') for x in r['results'])
          PY
      - name: Reproducible generated distributions and examples
        run: git diff --exit-code -- dist examples src/exporter/runtime-payload.js src/editor/diagnostics-payload.js packages/win32-browser/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-services-${{ matrix.browser }}
          path: reports/win32-services/
          retention-days: 14
