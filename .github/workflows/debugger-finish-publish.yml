name: Publish reviewed debugger completion
on:
  push:
    branches: [feat/debugger-compatibility-boundaries]
    paths: ['.github/workflows/debugger-finish-publish.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/debugger-compatibility-boundaries'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate exact reviewed main; rebuild generated conflicts only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          target='6aeeae789151397c58648cd9d99678105935979f'
          result=subprocess.run(['git','merge','--no-commit','--no-ff',target])
          if result.returncode:
              paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
              assert paths, 'Unexpected merge failure'
              assert set(paths)=={'dist/VB6-Studio-Web.html','dist/studio.js'}, 'Unreviewed source conflict: '+str(paths)
              for path in paths:
                  subprocess.run(['git','checkout','--ours','--',path],check=True)
                  subprocess.run(['git','add','--',path],check=True)
          PY
      - name: Restore saved preview and strict-policy commits with before/after verification
        run: |
          python - <<'PY'
          import base64,hashlib,json,zlib
          from pathlib import Path
          encoded=Path('.github/debugger-finish-edits.b64').read_text().strip()
          # Normalize transport transcription only; decoded source must match the
          # independently verified local manifest before any source is written.
          encoded=encoded.replace('K/y5kbkbLyk','K/y5kbLyk').replace('FB1DyN4yp','FB1+N4yp')
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='6c4c15a6e79098a02388eaecc7db2fb55814f14f630ee290af560b7b529246c1', 'Source manifest integrity failure'
          updates={}
          for item in json.loads(raw):
              path=Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              assert str(path).startswith(('src/','desktop/','tests/','tools/','docs/'))
              old=path.read_text() if path.exists() else ''
              actual=hashlib.sha256(old.encode()).hexdigest() if path.exists() else None
              assert actual==item['old'], 'Source changed before integration: '+str(path)
              text=old
              for start,end,replacement in reversed(item['edits']):
                  assert 0<=start<=end<=len(old)
                  text=text[:start]+replacement+text[end:]
              assert hashlib.sha256(text.encode()).hexdigest()==item['new'], 'Reconstruction mismatch: '+str(path)
              updates[path]=text
          for path,text in updates.items():
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text)
          print('Verified and restored',len(updates),'files from locally committed continuation')
          PY
      - name: Complete Node suite
        run: |
          set -o pipefail
          npm test | tee /tmp/debugger-finish-unit.log
      - name: Rebuild and verify exact reviewed source tree
        run: |
          npm run build
          cp .github/debugger-finish-edits.b64 /tmp/debugger-finish-edits.b64
          rm .github/debugger-finish-edits.b64
          git add -A
          git diff --cached --check
          # Compare the complete tree to the local replay, excluding this publisher
          # only. The snapshot workflow remains until explicit connector cleanup.
          git rm --cached .github/workflows/debugger-finish-publish.yml
          test "$(git write-tree)" = '3d424fda8cb19bad95a431bc023fe0fba6de7c3b'
          git add .github/workflows/debugger-finish-publish.yml
          git commit -m 'fix(debugger): finish approved previews and strict live-edit validation on current main'
          npm run build
          git diff --exit-code
      - name: Push validated integration without replacing concurrent edits
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/debugger-compatibility-boundaries | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/debugger-compatibility-boundaries
          git rev-parse HEAD > /tmp/debugger-finish-published.sha
          git bundle create /tmp/debugger-finish-published.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debugger-finish-publication
          path: |
            /tmp/debugger-finish-*
            .github/debugger-finish-edits.b64
          if-no-files-found: ignore
          retention-days: 7
