name: Classic HTML rendering
on:
  pull_request:
  push:
    branches: [main, fix/classic-bevels-and-list-reuse]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: classic-html-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build && npm test
      - run: python -m pip install playwright==1.57.0 Pillow
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Resolve Chromium
        if: matrix.engine == 'chromium'
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PY
      - run: python tools/browser-classic-html.py --engine ${{ matrix.engine }}
      - name: Verify reproducible distributions
        run: git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-html-${{ matrix.engine }}
          path: reports/classic-html
          retention-days: 14
