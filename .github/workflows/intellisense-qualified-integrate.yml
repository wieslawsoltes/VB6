name: Integrate IntelliSense with current Win32 compiler
on:
  push:
    branches: [feature/intellisense-qualified-arrays]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feature/intellisense-qualified-arrays'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate reviewed main revision
        run: |
          mkdir -p reports/intellisense-qualified-integration
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin ee89d2107b5119945a66c8440b9d088ee4a035be
          if ! git merge --no-commit --no-ff ee89d2107b5119945a66c8440b9d088ee4a035be; then
            conflicts=$(git diff --name-only --diff-filter=U)
            test -n "$conflicts" || exit 1
            while IFS= read -r path; do
              case "$path" in
                dist/*|src/exporter/runtime-payload.js|src/editor/diagnostics-payload.js) git checkout --ours -- "$path"; git add "$path" ;;
                *) git diff -- "$path" >> reports/intellisense-qualified-integration/merge.diff ;;
              esac
            done <<< "$conflicts"
            test -z "$(git diff --name-only --diff-filter=U)" || exit 1
          fi
      - name: Rebuild and validate combined source
        run: |
          npm run build
          git diff --check
          set -o pipefail
          npm test 2>&1 | tee reports/intellisense-qualified-integration/node.log
          git add -u
          test -z "$(git diff --cached --name-only -- .github/workflows)" || exit 1
          git commit -m 'merge: preserve current Win32 call compiler and rebuild IntelliSense distributions'
          git push origin HEAD:feature/intellisense-qualified-arrays
      - name: Reproducible source snapshot
        if: always()
        run: git archive --format=zip --output=intellisense-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intellisense-qualified-source
          path: |
            intellisense-source.zip
            reports/intellisense-qualified-integration/
          retention-days: 7
