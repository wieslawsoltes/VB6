name: Integrate qualified IntelliSense sources
on:
  push:
    branches: [feature/intellisense-qualified-arrays]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feature/intellisense-qualified-arrays'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact reviewed source delta
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, subprocess, zlib
          def digest(text): return hashlib.sha256(text.encode()).hexdigest()
          parts=[Path(f'tools/intellisense-qualified-part{i}.txt').read_text().strip() for i in range(1,5)]
          raw=zlib.decompress(base64.b64decode(''.join(parts),validate=True))
          assert len(raw)==35188 and hashlib.sha256(raw).hexdigest()=='8dc1f8f43827fae46b4c1920030e1f13664077c1bd48f5d2acf754ef3b1c824d', 'Source transfer checksum mismatch'
          changes=json.loads(raw)
          allowed={'docs/INTELLISENSE-COMPATIBILITY.md','docs/INTELLISENSE.md','src/editor/declaration-index.js','src/editor/editor.js','src/editor/expression-assistance.js','src/editor/intelligence.js','src/editor/reference-metadata.js','src/editor/type-completion.js','tests/intellisense-qualified-arrays.test.mjs','tools/browser-intellisense-compatibility.py'}
          assert set(changes)==allowed, 'Unexpected source paths'
          for name,change in changes.items():
              path=Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              if change['base'] is None:
                  assert not path.exists(), 'New file already exists: '+name
                  source=''
              else:
                  source=path.read_text()
                  assert digest(source)==change['base'], 'Source base changed since review: '+name
              if 'content' in change: source=change['content']
              else:
                  for start,end,text in reversed(change['edits']):
                      assert 0<=start<=end<=len(source)
                      source=source[:start]+text+source[end:]
              assert digest(source)==change['result'], 'Source result mismatch: '+name
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(source)
              subprocess.run(['git','add','--',name],check=True)
              print('Verified',name)
          PY
      - name: Build and validate exact combined source
        run: |
          mkdir -p reports/intellisense-qualified
          npm run build
          git diff --check
          set -o pipefail
          npm test 2>&1 | tee reports/intellisense-qualified/node.log
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={'dist/studio.js':'cf191aac00c151b7db0f2729478790a10dad420d51a4a6a071f6d1d9486751cd','dist/VB6-Studio-Web.html':'b2f0fb8fb549f4be2fb8787103cf189a87bd0c511cb836a5035c794c28bbadbb'}
          for name,sha in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha, 'Generated distribution differs from reviewed local build: '+name
          PY
      - name: Commit readable sources and remove transport files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/intellisense-qualified-part{1,2,3,4}.txt
          git add -u
          test -z "$(git diff --cached --name-only -- .github/workflows)" || exit 1
          git commit -m 'fix(intellisense): resolve qualified types and ReDim arrays with inert reference snapshots'
          git push origin HEAD:feature/intellisense-qualified-arrays
      - name: Reproducible source snapshot
        if: always()
        run: git archive --format=zip --output=intellisense-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intellisense-qualified-source
          path: |
            intellisense-source.zip
            reports/intellisense-qualified/
          retention-days: 7
