name: PR159 reviewed integration publication
on:
  push:
    branches: [test/pr159-integration-recovery]
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d9b9c34b3ecf1083e1a3ab00f830ae1097d3ef6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce the locally reviewed merge and authored fingerprints
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff 3b704daf7dd14722b369179a59f046e8c560094d
          result=$?
          set -e
          test "$result" = 1
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,re,subprocess,zlib
          expected={'src/ide/main.js','tools/browser-advanced-editor-tests.py','tools/browser-winui-tests.py',
            'tools/figma-presentation-browser-tests.py','tools/ide-artifacts.json','tools/intelligent-ui-browser-tests.py',
            'tools/intelligent-ui-workbench-tests.py','tools/recovery-browser-tests.py'}
          files=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert set(files)==expected,files
          for filename in files:
            if filename=='tools/ide-artifacts.json':continue
            p=Path(filename)
            def resolve(match):
              ours=match[1]
              if filename=='src/ide/main.js':
                assert ours.count('validateMacOS26Properties({...target.properties,[key]:value},target.type);')==1
                assert ours.count('clearMacOS26ColorRoles(target.properties,{[key]:value});')==1
                ours=ours.replace('validateMacOS26Properties({...target.properties,[key]:value},target.type);','validateMacOS26Properties({...target.properties,[key]:value},target.type);validateWinUI3Properties({...target.properties,[key]:value},target.type);')
                ours=ours.replace('clearMacOS26ColorRoles(target.properties,{[key]:value});','clearMacOS26ColorRoles(target.properties,{[key]:value});clearWinUI3Overrides(target.properties,{[key]:value});')
              return ours
            text,count=re.subn(r'<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>>[^\n]*\n',resolve,p.read_text(),flags=re.S)
            assert count==1,(filename,count)
            p.write_text(text)
          p=Path('tools/ci/browser_partition.py')
          text=p.read_text().replace('# the job deadline even though all five scripts passed their process deadlines.','# the job deadline even though each script passed its process deadline.\n# WinUI3 joins the application-theme owner; both scripts keep their full cases.').replace("'2': ('browser-application-theme-tests.py',),","'2': ('browser-application-theme-tests.py', 'browser-winui3-tests.py'),")
          p.write_text(text)
          p=Path('tools/ci/test_run.py');p.write_text(p.read_text().replace("['browser-application-theme-tests.py'],","['browser-application-theme-tests.py', 'browser-winui3-tests.py'],"))
          p=Path('docs/CI.md');p.write_text(p.read_text().replace('theme, native caption, macOS reference and WinUI suites.','theme, native caption, macOS reference, WinUI and WinUI3 XAML suites.').replace('those groups each receive the existing 15-minute job deadline. Both partitions','those groups each receive the inherited 25-minute job deadline. Both partitions').replace('all five scripts','all six scripts').replace('all five durations','all six durations').replace('| 2 | Application theme |','| 2 | Application theme and WinUI3 XAML |').replace('All five appearance scripts','All six appearance scripts'))
          # These are the already reviewed local manifest bytes, NOT expectations
          # computed from whatever the CI build happens to generate.
          encoded=''
          # Guard the exact payload against transcription and transport errors.
          encoded=encoded.replace('BxeiXqDaDX4','BxeiXqDX4').replace('DGWRJJjdJ','DGWRJjdJ')
          manifest=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(manifest).hexdigest()=='8ac9cb3f7b3969e45b13693cbfb1f49cf5635e55f0429bd325fabdddac8ef6f7'
          Path('tools/ide-artifacts.json').write_bytes(manifest)
          PY
          git add -u
          test "$(git write-tree)" = d66ad191fe8a22eadb5bc28287f65072a9606102
          git diff --cached --check
      - name: Validate combined compiler, editor, rendering and coverage contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/integration
          npm run build
          python -m pip install -r tools/ci/requirements-checks.txt
          python tools/ci/check.py > reports/integration/coverage.json
          python -m unittest discover -s tools/ci -p 'test_*.py' 2>&1 | tee reports/integration/ci-fixtures.log
          node --test --test-concurrency=4 tests/pascal-*.test.mjs tests/winui*.test.mjs tests/xaml-*.test.mjs > reports/integration/compiler.log
          node --test --test-concurrency=4 tests/*browser-startup.test.mjs tests/figma-browser-reload.test.mjs tests/linux-packaging-process-group.test.mjs tests/rendering-*.test.mjs > reports/integration/rendering.log
          npm run build
          git diff --exit-code
          test "$(git write-tree)" = d66ad191fe8a22eadb5bc28287f65072a9606102
      - name: Publish only the reviewed merge to its staging branch
        shell: bash
        run: |
          set -euo pipefail
          # This workflow does not update main or the PR. The connector performs
          # the separately inspected, expected-SHA fast-forward after publication.
          commit=$(git commit-tree d66ad191fe8a22eadb5bc28287f65072a9606102 -p 5d9b9c34b3ecf1083e1a3ab00f830ae1097d3ef6 -p 3b704daf7dd14722b369179a59f046e8c560094d <<'MESSAGE'
          Merge main into Pascal compiler and preserve shared WinUI editing

          Retain language-aware renaming, WinUI3 validation and live resource
          override release. Preserve bounded startup and cleanup contracts,
          qualify all six appearance entrypoints, and review regenerated output
          fingerprints. Exact source tree verified against local qualification.
          MESSAGE
          )
          printf '%s\n' "$commit" > reports/integration/published-commit.txt
          git push origin "$commit:refs/heads/work/pr159-main-integration-20261029"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr159-reviewed-integration
          path: reports/integration
          if-no-files-found: warn
          retention-days: 7
