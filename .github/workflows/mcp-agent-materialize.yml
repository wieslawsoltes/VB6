name: Finalize MCP agent integration
on:
  push:
    branches: [feat/mcp-agent-control]
    paths: ['.github/workflows/mcp-agent-materialize.yml']
permissions:
  contents: write
concurrency:
  group: mcp-agent-materialize
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore reviewed source and integrate current compiler/runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = '954262de5ed2472a6e089d4b7ffa71b97ee6d33d'
          python - <<'PY'
          import pathlib, subprocess, textwrap, re, json
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def run(*args): subprocess.run(args,check=True)
          main='954262de5ed2472a6e089d4b7ffa71b97ee6d33d'
          workflow='.github/workflows/mcp-agent-materialize.yml'
          helper=pathlib.Path('tools/.mcp-agent-fixes.py').read_text()
          original=git('show','c44aa8466367cda25f038fb6e0751d71a65e6daf:'+workflow)
          decoder=textwrap.dedent(original.split("python - <<'PY'\n",1)[1].split('          PY\n',1)[0])
          decoder=decoder.replace('set(pieces+[workflow])',"set(pieces+[workflow,'tools/.mcp-agent-review.b64','tools/.mcp-agent-fixes.py'])")
          exec(compile(decoder,'verified-source-reconstruction','exec'),{})
          # The superseded encoded review transfer is never decoded or executed.
          pathlib.Path('tools/.mcp-agent-review.b64').unlink()
          pathlib.Path('tools/.mcp-agent-fixes.py').unlink()
          run('npm','run','build')
          run('git','add','-A','--','.github','README.md','docs','package.json','src','tools','tests','dist','examples')
          print('Recovered tree:',git('write-tree'),flush=True)
          run('git','commit','-m','feat: server-only MCP agent access across IDE, projects, compiler and debugger')
          result=subprocess.run(['git','merge','--no-commit','--no-ff',main])
          assert result.returncode in [0,1]
          conflicts=set(git('diff','--name-only','--diff-filter=U').splitlines())
          allowed={'README.md','package.json','src/runtime/host.js','src/exporter/runtime-payload.js'}
          assert all(p in allowed or p.startswith('dist/') or p.startswith('examples/') for p in conflicts),conflicts
          pattern=r'<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>>[^\n]+\n'
          p=pathlib.Path('README.md');s=p.read_text();s=re.sub(pattern,lambda m:m[1]+'\n'+m[2][m[2].index('### Compiler/runtime compatibility workstream'):],s,flags=re.S);p.write_text(s)
          p=pathlib.Path('package.json');s=p.read_text();s=re.sub(pattern,lambda m:m[1].rstrip()+',\n'+m[2],s,flags=re.S);p.write_text(json.dumps(json.loads(s),indent=2)+'\n')
          p=pathlib.Path('src/runtime/host.js');p.write_text(re.sub(pattern,lambda m:m[1],p.read_text(),flags=re.S))
          exec(compile(helper,'reviewed-agent-lifecycle-fixes','exec'),{})
          run('npm','run','build')
          run('npm','test')
          run('git','add','-A','--','.github','README.md','docs','package.json','src','tools','tests','dist','examples')
          assert not git('diff','--name-only','--diff-filter=U')
          run('git','diff','--cached','--check')
          tree=git('write-tree');print('Final integrated tree:',tree,flush=True)
          assert tree=='596c0d5d033bcb276d5c35a55f59e825a7abcf2e',tree
          run('git','commit','-m','merge: preserve current compiler and Windows targets; harden scoped agent authority')
          PY
          # A normal push rejects concurrent branch advances; never force this ref.
          git push origin HEAD:refs/heads/feat/mcp-agent-control
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Real external-agent deployment workflows
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          npm run test:mcp:browser
          npm run test:mcp:agent
      - name: Preserve source history and any failed reconstruction for diagnosis
        if: always()
        run: |
          mkdir -p reports
          git status --short > reports/mcp-integration-status.txt
          git ls-files --stage > reports/mcp-integration-index.txt
          git bundle create repository.bundle --all HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vb6-mcp-agent-integration-${{ github.sha }}
          retention-days: 7
          path: |
            repository.bundle
            reports
            src
            tools
            tests
            docs
            dist
            examples
            package.json
            README.md
