name: Issue 39 reference evidence
on:
  push:
    branches: [fix/issue-39-visual-fidelity]
    paths: [.github/workflows/issue-39-reference.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download the public reporter annotation for visual review
        run: |
          mkdir -p evidence
          curl --fail --location --max-time 45 --max-filesize 5242880 --proto '=https' --proto-redir '=https' 'https://github.com/user-attachments/assets/5af91515-c38f-42bf-9043-f03f7c927f9c' -o evidence/issue-39-reference.png
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          p = Path('evidence/issue-39-reference.png')
          data = p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Expected the PNG annotation'
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (1312, 966), (width, height)
          Path('evidence/SHA256SUMS.txt').write_text(hashlib.sha256(data).hexdigest() + '  issue-39-reference.png\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue-39-public-reference
          path: evidence/
          retention-days: 7
