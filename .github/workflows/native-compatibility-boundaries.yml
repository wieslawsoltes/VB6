name: Native calendar arrays and callbacks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-boundaries-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [intervals, invariants, arrays, callbacks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: node --test tests/win32-date-intervals.test.mjs tests/win32-interval-policy.test.mjs tests/win32-interval-precision.test.mjs tests/win32-large-arrays.test.mjs tests/win32-callbacks.test.mjs
      - if: matrix.suite == 'intervals'
        shell: pwsh
        run: ./tools/test-win32-date-intervals.ps1
      - if: matrix.suite == 'invariants'
        shell: pwsh
        run: |
          node tools/win32-interval-contract-fixture.mjs
          if($LASTEXITCODE -ne 0){throw 'Interval contract build failed'}
          ./tools/test-win32-dates.ps1 -Directory validation/interval-contract -Program AotIntervalContract -Manifest interval-contract-build.json -ReportName interval-contract-execution.json
      - if: matrix.suite == 'arrays'
        shell: pwsh
        run: |
          node tools/win32-large-array-fixtures.mjs
          if($LASTEXITCODE -ne 0){throw 'Large array build failed'}
          ./tools/test-win32-dates.ps1 -Directory validation/large-arrays -Program AotLargeArrays -Manifest large-array-build.json -ReportName large-array-execution.json -LifetimeCycles 0
          node tools/win32-array-budget-fixture.mjs
          if($LASTEXITCODE -ne 0){throw 'Array budget build failed'}
          ./tools/test-win32-dates.ps1 -Directory validation/array-budget -Program AotArrayBudget -Manifest array-budget-build.json -ReportName array-budget-execution.json -LifetimeCycles 0
      - if: matrix.suite == 'callbacks'
        shell: pwsh
        run: |
          node tools/win32-callback-fixtures.mjs
          if($LASTEXITCODE -ne 0){throw 'Callback build failed'}
          ./tools/test-win32-callbacks.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-boundaries-${{ matrix.suite }}
          path: |
            validation/date-intervals/
            validation/interval-contract/
            validation/large-arrays/
            validation/array-budget/
            validation/callbacks/
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - name: Generate the existing and new native export fixtures
        run: |
          node tools/win32-fixtures.mjs
          node tools/win32-numeric-fixtures.mjs
          node tools/win32-currency-fixtures.mjs
          node tools/win32-bindings-fixtures.mjs
          node tools/win32-date-fixtures.mjs
          node tools/win32-date-abi-fixtures.mjs
          node tools/win32-date-call-fixtures.mjs
          node tools/win32-call-fixtures.mjs
          node tools/win32-interval-contract-fixture.mjs
          node tools/win32-large-array-fixtures.mjs
          node tools/win32-callback-fixtures.mjs
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify classic IDE, SDK and worker output matches Node
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tools/browser-native-build-tests.py
      - run: git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-boundaries-browser
          path: validation/browser-native/
          retention-days: 14
