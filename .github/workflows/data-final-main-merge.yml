name: Final data main integration
on:
  push:
    branches: [feat/data-rdo-gateway-compat]
    paths: [.github/workflows/data-final-main-merge.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge reviewed main without discarding source edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/data-rdo-gateway-compat | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          target = '30febe16733be5d71eb4428d4888866947a088fe'
          result = subprocess.run(['git','merge','--no-commit','--no-ff',target])
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          generated = {'dist/VB6-Studio-Web.html','dist/studio.js','src/exporter/runtime-payload.js'}
          assert set(conflicts) <= generated, 'Unreviewed source conflict: '+repr(conflicts)
          assert result.returncode == 0 or conflicts, 'Unexpected merge failure'
          if conflicts:
              subprocess.run(['git','restore','--source=HEAD','--staged','--worktree','--',*conflicts],check=True)
          PY
      - name: Rebuild and validate exact combined application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/data-final-result
          npm run build | tee /tmp/data-final-result/build.log
          npm test | tee /tmp/data-final-result/node-tests.log
          git diff --exit-code HEAD -- .github/workflows
      - name: Publish validated merge without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/data-rdo-gateway-compat | cut -f1)" = "$GITHUB_SHA"
          git add -A
          git commit -m 'Merge current main into data compatibility and regenerate shipped applications'
          git push origin HEAD:refs/heads/feat/data-rdo-gateway-compat
          git rev-parse HEAD > /tmp/data-final-result/head.txt
          git archive HEAD | gzip > /tmp/data-final-result/source.tar.gz
          git ls-files -z | xargs -0 sha256sum > /tmp/data-final-result/tracked-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-final-main-result
          path: /tmp/data-final-result
          retention-days: 14
