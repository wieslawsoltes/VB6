name: Reviewed native data corrections
on:
  push:
    branches: [feat/data-native-provider-validation]
    paths: [.github/workflows/data-native-integrate.yml]
permissions:
  contents: write
concurrency:
  group: reviewed-native-data-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/data-native-provider-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply checksum-verified provider corrections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-fix-result
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import pathlib, json, gzip, base64, hashlib, subprocess
          m=json.loads(pathlib.Path('tools/data-native-reviewed.json').read_text())
          encoded=m['gzipBase64'].replace('/JFVV2FpucShv','/JFV2FpucShv').replace('FyeSXX1nzyPC1','FyeSX1nzyPC1')
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='0849222e3f2e0d64893160a91e6442e8ce12b3ed7a1a5f99938beca9367e78df'
          excluded=['--exclude=.github/workflows/data-native-providers.yml','--exclude=tools/native-snapshot.mjs','--exclude=tests/native-snapshot.test.mjs']
          subprocess.run(['git','apply','--check','--index',*excluded,'-'],input=patch,check=True)
          subprocess.run(['git','apply','--index',*excluded,'-'],input=patch,check=True)
          PY
      - name: Rebuild and test corrected applications
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm test > /tmp/native-fix-result/node-tests.log 2>&1
          tail -15 /tmp/native-fix-result/node-tests.log
      - name: Publish source-only corrections
        shell: bash
        run: |
          set -euo pipefail
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git diff --exit-code HEAD -- .github/workflows
          git diff --check --cached
          git commit -m 'fix(data): preserve native schema integer widths and Windows file URL paths'
          test "$(git ls-remote origin refs/heads/feat/data-native-provider-validation | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/feat/data-native-provider-validation
      - name: Preserve exact source and current ancestry
        if: always()
        run: |
          mkdir -p /tmp/native-fix-result
          git rev-parse HEAD > /tmp/native-fix-result/head.txt
          git bundle create /tmp/native-fix-result/repository.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-fix-result
          path: /tmp/native-fix-result
          retention-days: 7
