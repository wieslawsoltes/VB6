name: Retain merged visual fixes in native String export
on:
  push:
    branches: [feat/native-declare-strings]
    paths: [.github/workflows/native-strings-fidelity-integrate.yml]
permissions:
  contents: write
concurrency:
  group: native-strings-fidelity-integrate
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge pinned visual changes without discarding authored conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          python3 - <<'PY'
          import subprocess
          target='728a9201806a4d455113867d2778c3262666a05b'
          subprocess.run(['git','merge-base','--is-ancestor','72dae4fa89e165f6f0dc0ba0aad5cb7615508ea3',target],check=True)
          result=subprocess.run(['git','merge','--no-commit','--no-ff',target])
          if result.returncode:
              paths=[p for p in subprocess.check_output(['git','diff','--name-only','--diff-filter=U','-z']).decode().split('\0') if p]
              if not paths: raise SystemExit('Merge failed without generated conflicts')
              for p in paths:
                  if not (p.startswith('dist/') or p in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js']):
                      raise SystemExit('Readable source conflict requires review: '+p)
              for p in paths:
                  subprocess.run(['git','checkout','--ours','--',p],check=True)
                  subprocess.run(['git','add','--',p],check=True)
          PY
          npm run build
          npm test
          node tools/win32-string-fixtures.mjs
          node tools/win32-string-edge-fixture.mjs
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js packages/win32-browser/dist examples
          git diff --cached --check
          git commit -m 'merge: preserve issue 39 visual corrections in native Declare String export' -m 'Integrate pinned main 728a9201806a4d455113867d2778c3262666a05b. Regenerate combined distributions only after resolving generated conflicts; authored conflicts abort. Preserve native String ABI, ownership tests and all classic UI corrections. Full Node suite and fixture compilation passed.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/feat/native-declare-strings
          git bundle create /tmp/native-strings-final.bundle HEAD refs/remotes/origin/main
          git archive HEAD --output=/tmp/native-strings-final-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: native-strings-final-review
          path: |
            /tmp/native-strings-final.bundle
            /tmp/native-strings-final-source.zip
          retention-days: 2
