name: Agent recovery current-main integration
on:
  push:
    branches: [fix/agent-recovery-compaction]
    paths: [.github/workflows/agent-main-integration.yml]
permissions:
  contents: write
concurrency:
  group: agent-recovery-current-main-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/fix/agent-recovery-compaction'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate reviewed concurrent main without discarding authored sources
        run: |
          mkdir -p /tmp/agent-main-validation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, hashlib
          main = 'e7cfde0a219569f4ab5bd5abadb2d337b6722efb'
          files = list(Path('src/agents').glob('*')) + [Path('src/editor/diagnostics-scheduler.js'), Path('src/ide/diagnostics.js')]
          before = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in files if p.is_file()}
          result = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', main])
          conflicts = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
          allowed = {'dist/studio.js', 'dist/VB6-Studio-Web.html'}
          if any(p not in allowed for p in conflicts) or (result.returncode and not conflicts):
              raise SystemExit('Authored merge conflict or merge failure; stop for review')
          if conflicts:
              subprocess.run(['git', 'checkout', '--ours', '--', *conflicts], check=True)
              subprocess.run(['git', 'add', '--', *conflicts], check=True)
          for p, digest in before.items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest() == digest, p
          Path('/tmp/agent-main-validation/integrated-main.txt').write_text(main+'\n')
          PY
      - name: Rebuild combined source and run complete regressions
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/agent-main-validation/build.log
          node --check dist/studio.js
          npm test 2>&1 | tee /tmp/agent-main-validation/tests.log
          npm run test:agents 2>&1 | tee /tmp/agent-main-validation/agents.log
          git diff --check
          git add -A
          npm run build
          git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
      - name: Publish validated current-main integration with branch lease
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/fix/agent-recovery-compaction | cut -f1)" = "$EXPECTED_HEAD"
          git commit -m 'chore: integrate current native String main without changing agent recovery contracts'
          git rev-parse HEAD > /tmp/agent-main-validation/source-head.txt
          git rev-parse HEAD^{tree} > /tmp/agent-main-validation/source-tree.txt
          git archive HEAD | gzip > /tmp/agent-main-validation/verified-source.tar.gz
          sha256sum /tmp/agent-main-validation/verified-source.tar.gz > /tmp/agent-main-validation/SHA256SUMS.txt
          git push origin HEAD:refs/heads/fix/agent-recovery-compaction
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-current-main-validation
          path: /tmp/agent-main-validation/
          retention-days: 7
