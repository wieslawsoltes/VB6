name: Final scalar integration
on:
  push:
    branches: [feat/variant-scalar-compatibility]
    paths: ['.github/workflows/scalar-final-integration.yml']
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/variant-scalar-compatibility'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve both reviewed implementations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          git=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          feature='6c955b82020a8e16650a5d5d4a60fbade043ebc5'
          main='6aeeae789151397c58648cd9d99678105935979f'
          assert git('diff','--name-only',feature,'HEAD')=='.github/workflows/scalar-final-integration.yml'
          assert git('merge-base',feature,main)=='f905988a06004cb60f404d2bddeecc1318c361d8'
          result=subprocess.run(['git','merge','--no-ff','--no-commit',main]);assert result.returncode in (0,1)
          conflicts=git('diff','--name-only','--diff-filter=U').splitlines()
          assert set(conflicts)=={'dist/VB6-Studio-Web.html','dist/studio.js'},conflicts
          subprocess.run(['git','checkout','--ours','--',*conflicts],check=True)
          subprocess.run(['git','add','--',*conflicts],check=True)
          for path in ('src/agents','src/mcp','src/native','tools/coding-agents-browser-tests.py'):
              assert not git('diff','--cached','--name-only',main,'--',path),path
          for path in ('src/runtime','src/language','tools/interop'):
              assert not git('diff','--cached','--name-only',feature,'--',path),path
          PY
      - name: Rebuild and test exact combined source
        run: |
          set -o pipefail
          mkdir -p final-integration
          npm run build 2>&1 | tee final-integration/build.log
          npm test 2>&1 | tee final-integration/node.log
          git add -- dist examples src/exporter/runtime-payload.js src/editor/diagnostics-payload.js
          git diff --cached --check
          git commit -m 'Merge current native calendar callbacks and agent permission profiles into scalar compatibility'
          npm run build
          git diff --exit-code -- dist examples src/exporter/runtime-payload.js src/editor/diagnostics-payload.js
          GIT_INDEX_FILE="$RUNNER_TEMP/product-index" git read-tree HEAD
          GIT_INDEX_FILE="$RUNNER_TEMP/product-index" git rm --cached -- .github/workflows/scalar-final-integration.yml
          test "$(GIT_INDEX_FILE="$RUNNER_TEMP/product-index" git write-tree)" = 425bc6c63c65cc7e53aaf7417c8622343ba515d4
      - name: Publish only the existing feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token ;; *) printf '%s\n' "$GH_TOKEN" ;; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass"
          trap 'rm -f "$RUNNER_TEMP/askpass"' EXIT
          GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/feat/variant-scalar-compatibility
      - name: Preserve validation and exact source
        if: always()
        run: |
          mkdir -p final-integration
          git rev-parse HEAD > final-integration/head.txt
          git diff --cached > final-integration/staged.diff
          git bundle create final-integration/repository.bundle HEAD --all
          git bundle verify final-integration/repository.bundle
          sha256sum final-integration/repository.bundle > final-integration/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalar-final-integration
          path: final-integration/
          retention-days: 14
