name: Win32 geometry contracts
on:
  push:
    branches: [main, feature/win32-gdi-boundaries]
  pull_request:
permissions:
  contents: read
concurrency:
  group: win32-geometry-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record real GDI curved and polygon regions
        shell: pwsh
        run: ./tools/win32-geometry-oracle.ps1
      - name: Compare implemented polygon contracts and report curved-edge differences
        run: node tools/win32-geometry-contracts.mjs reports/win32-geometry/native.json
      - name: Record native font-independent text semantics
        shell: pwsh
        run: ./tools/win32-text-oracle.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-geometry-contracts
          path: reports/win32-geometry
          retention-days: 14
