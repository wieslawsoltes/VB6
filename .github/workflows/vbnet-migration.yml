name: VB.NET migration conformance
on:
  pull_request:
    paths:
      - 'src/language/**'
      - 'src/project/**'
      - 'src/migration/**'
      - 'src/ide/vbnet-export.js'
      - 'src/mcp/studio-entry.js'
      - 'packages/vbnet-*/**'
      - 'tests/migration-*'
      - 'tools/*vbnet*'
      - 'tools/browser-migration-tests.py'
      - '.github/workflows/vbnet-migration.yml'
  push:
    branches: [main]
    paths:
      - 'src/migration/**'
      - 'packages/vbnet-*/**'
      - 'tests/migration-*'
      - '.github/workflows/vbnet-migration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vbnet-migration-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm run build
      - name: Initialize .NET before parallel conformance tests
        # First-use NuGet migrations create a process-shared mutex directory.
        # Initialize once so concurrent fixtures cannot race mkdir with EEXIST.
        # Keep all compilation/execution assertions and concurrency unchanged.
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: dotnet new console --dry-run --no-restore --output "${{ runner.temp }}/vb6-dotnet-init"
      - name: Require real .NET compilation and execution
        run: npm run test:migration
        env:
          VB6_REQUIRE_DOTNET: '1'
      - run: npm run pack:vbnet-migration
      - run: node tools/test-vbnet-package.mjs
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: python -m pip install playwright==1.57.0
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Verify actual HTTP IDE export and downloads
        if: runner.os == 'Linux'
        run: npm run test:migration:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vbnet-migration-${{ matrix.os }}
          path: |
            reports/vbnet-migration
            artifacts/vbnet-migration
          retention-days: 7
