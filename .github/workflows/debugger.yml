name: Debugger runtime
on:
  push:
    branches: [main, feat/vb6-debugger-runtime]
    paths:
      - 'src/runtime/**'
      - 'src/language/**'
      - 'src/ide/**'
      - 'src/editor/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/debugger.yml'
  pull_request:
    paths:
      - 'src/runtime/**'
      - 'src/language/**'
      - 'src/ide/**'
      - 'src/editor/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/debugger.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: debugger-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  debugger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run build
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Resolve Chromium executable
        if: matrix.browser == 'chromium'
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PY
      - name: Classic debugger and shipped-app integration
        env:
          VB6_BROWSER: ${{ matrix.browser }}
        run: npm run test:debugger:browser
      - name: Reproducible generated bundles
        run: git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debugger-${{ matrix.browser }}
          path: reports/debugger-runtime
          if-no-files-found: ignore
          retention-days: 7
