name: Debugger scalar integration snapshot
on:
  push:
    branches: [feat/debugger-compatibility-boundaries]
    paths: ['.github/workflows/debugger-scalar-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git bundle create /tmp/debugger-scalar.bundle --all
          git rev-parse HEAD origin/main > /tmp/debugger-scalar.refs
      - uses: actions/upload-artifact@v4
        with:
          name: debugger-scalar-source
          path: /tmp/debugger-scalar.*
          retention-days: 7
