name: Coding agents main integration
on:
  push:
    branches: [feat/coding-agents]
    paths: [.github/workflows/coding-agents-sync.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/coding-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge reviewed main source and resolve only generated bundle conflicts
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit e6c9dfc6732b9e99b8eb9756f9562784048fa114 || {
            python - <<'PY'
          import subprocess
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          allowed = {'dist/studio.js','dist/VB6-Studio-Web.html','dist/studio.css'}
          assert conflicts and set(conflicts) <= allowed, 'Source conflicts require review: '+str(conflicts)
          for path in conflicts:
              subprocess.run(['git','checkout','--ours','--',path],check=True)
              subprocess.run(['git','add','--',path],check=True)
          PY
          }
          node -e "const p=require('./package.json');if(!p.scripts['test:project-files'].includes('native-zip.test.mjs')||!p.scripts['test:agents']||!p.scripts.validate.includes('coding-agents-browser-tests.py'))process.exit(1)"
      - run: npm run build && node --check dist/studio.js && npm test
      - name: Commit combined source and regenerated output without force-push
        run: |
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git diff --cached --check
          git commit -m 'Merge latest native-project compatibility fixes and regenerate coding-agent IDE'
          git push origin HEAD:refs/heads/feat/coding-agents
      - name: Export exact combined source for local verification
        run: |
          mkdir -p /tmp/agent-source
          git bundle create /tmp/agent-source/repository.bundle HEAD
          git rev-parse HEAD > /tmp/agent-source/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coding-agents-combined-source
          path: /tmp/agent-source/
          retention-days: 3
