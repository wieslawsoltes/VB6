name: Win32 Calculator and numeric export
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: win32-numeric-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-numeric:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run test:win32
      - run: node tools/win32-numeric-fixtures.mjs
      - name: Execute original Calculator and numeric ABI regression PEs
        shell: pwsh
        run: ./tools/test-win32-numeric.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-numeric-validation
          path: validation/numeric/
          retention-days: 14
  browser-numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm run build && npm test
      - run: node tools/win32-fixtures.mjs && node tools/win32-numeric-fixtures.mjs
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Export identical Calculator bytes in IDE, SDK, and Web Worker
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tools/browser-native-build-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeric-browser-export
          path: validation/browser-native/
          retention-days: 14
