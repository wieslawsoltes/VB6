name: Win32 Currency export
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: win32-currency-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-execution:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: node --test tests/win32-currency.test.mjs tests/win32-bindings.test.mjs
      - run: node tools/win32-currency-fixtures.mjs
      - name: Execute exact Currency storage, arithmetic, calls and arrays
        shell: pwsh
        run: ./tools/test-win32-currency.ps1
      - run: node tools/win32-bindings-fixtures.mjs
      - name: Verify typed constants and foreign return values against an independent C test DLL
        shell: pwsh
        run: ./tools/test-win32-bindings.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-currency-execution
          path: validation/currency/
          retention-days: 14
  browser-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: node tools/win32-fixtures.mjs
      - run: node tools/win32-numeric-fixtures.mjs
      - run: node tools/win32-currency-fixtures.mjs
      - run: node tools/win32-bindings-fixtures.mjs
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify IDE, SDK and worker Currency exports against Node output
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tools/browser-native-build-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: currency-browser-export
          path: validation/browser-native/
          retention-days: 14
