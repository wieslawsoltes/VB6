name: Win32 Declare String interoperability
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: win32-string-interop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: node --test tests/win32-string-interop.test.mjs tests/win32-callbacks.test.mjs
      - run: node tools/win32-string-fixtures.mjs
      - name: Execute ANSI byte-BSTR ABI and real Windows String buffer calls
        shell: pwsh
        run: ./tools/test-win32-string-interop.ps1
      - run: node tools/win32-callback-fixtures.mjs
      - name: Retain independent callback registers and LastDLLError frame behavior
        shell: pwsh
        run: ./tools/test-win32-callbacks.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-string-interop-execution
          path: |
            validation/string-interop/
            validation/callbacks/
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - name: Build prior and String native export fixtures
        run: |
          node tools/win32-fixtures.mjs
          node tools/win32-numeric-fixtures.mjs
          node tools/win32-currency-fixtures.mjs
          node tools/win32-bindings-fixtures.mjs
          node tools/win32-date-fixtures.mjs
          node tools/win32-date-abi-fixtures.mjs
          node tools/win32-date-call-fixtures.mjs
          node tools/win32-call-fixtures.mjs
          node tools/win32-interval-contract-fixture.mjs
          node tools/win32-large-array-fixtures.mjs
          node tools/win32-callback-fixtures.mjs
          node tools/win32-string-fixtures.mjs
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify classic IDE, SDK and Blob worker byte equality
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tools/browser-native-build-tests.py
      - run: git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-string-interop-browser
          path: validation/browser-native/
          retention-days: 14
