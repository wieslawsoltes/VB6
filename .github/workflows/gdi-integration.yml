name: Integrate reviewed GDI branch
on:
  push:
    branches: [feature/win32-gdi-bitmaps]
    paths: [.github/workflows/gdi-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge exact reviewed main; only generated conflicts may be rebuilt
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git merge --no-commit --no-ff 900c3c3f82af1f6020e496cb252043010af90666 || true
          python - <<'PY'
          import subprocess
          conflicts=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          allowed={'dist/VB6-Studio-Web.html','dist/studio.js'}
          if conflicts-allowed: raise SystemExit('Source conflict requires review: '+repr(conflicts))
          PY
          npm run build
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples packages/win32-browser/dist
          test -z "$(git diff --name-only --diff-filter=U)"
          npm test
          npm run pack:win32-browser
      - name: Publish combined tested source to feature branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feature/win32-gdi-bitmaps | cut -f1)" = "$EXPECTED_SHA"
          git commit -m 'fix(win32-browser): preserve native Currency and binding updates in GDI integration'
          git push origin HEAD:refs/heads/feature/win32-gdi-bitmaps
          git rev-parse HEAD HEAD^{tree} > /tmp/gdi-integrated-revision.txt
          git archive --format=zip HEAD -o /tmp/gdi-integrated-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gdi-integrated-source
          path: |
            /tmp/gdi-integrated-revision.txt
            /tmp/gdi-integrated-source.zip
            release/vb6-win32-browser-*.tgz
          retention-days: 7
