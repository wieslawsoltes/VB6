name: Finalize verified MCP refinements
on:
  push:
    branches: [feat/mcp-lifecycle-and-data]
    paths: ['.github/workflows/mcp-refine-publish.yml']
permissions:
  contents: write
concurrency:
  group: mcp-refinement-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify input tree and apply the reproduced local-expiry regression fix
        run: |
          set -euo pipefail
          git rm --cached .github/workflows/mcp-refine-publish.yml
          test "$(git write-tree)" = 'b7cca34f9a137be9b07ac7f1669b31080c27f946'
          git restore --staged --source=HEAD -- .github/workflows/mcp-refine-publish.yml
          python - <<'PY'
          from pathlib import Path
          p=Path('src/mcp/tasks.js');s=p.read_text()
          old="  cancelLocal(id) { const entry=this.entries.get(id); if (!entry) return false; this.cancel(id,{principal:entry.principal}); return true; }"
          new="  cancelLocal(id) { this.purge(); const entry=this.entries.get(id); if (!entry) return false; this.cancelEntry(entry); return true; }"
          assert old in s;s=s.replace(old,new)
          old="  cancel(id, ctx) {\n    const entry = this.find(id, ctx);"
          new="  cancel(id, ctx) { this.cancelEntry(this.find(id, ctx)); return {}; }\n  cancelEntry(entry) {"
          assert old in s;s=s.replace(old,new)
          old="    return {};\n  }\n  update(id, responses, ctx)"
          assert old in s;s=s.replace(old,"  }\n  update(id, responses, ctx)")
          p.write_text(s)
          p=Path('tests/mcp-refinement.test.mjs')
          s=p.read_text()+'''
          test('MCP tasks: local cancellation safely handles expiry before the timer fires',()=>{
            let now=0;
            const tasks=new McpTasks({now:()=>now,ttlMs:100});
            const handle=tasks.create(()=>new Promise(()=>{}),{principal:'A'});
            now=101;
            assert.equal(tasks.cancelLocal(handle.taskId),false);
            assert.equal(tasks.inspect().length,0);
            tasks.clear();
          });
          '''
          p.write_text(s)
          PY
          npm run build
          npm test
          git add src/mcp/tasks.js tests/mcp-refinement.test.mjs dist
          git diff --cached --check
          git rm --cached .github/workflows/mcp-refine-publish.yml
          test "$(git write-tree)" = 'd4c8ba91736868ebe51ebad6c16896a89d5136e9'
          git restore --staged --source=HEAD -- .github/workflows/mcp-refine-publish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(mcp): cancel expired local tasks without a stale-handle exception'
          npm run build
          git diff --exit-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Final standalone, HTTP, HTTPS and localhost agent workflows
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          npm run test:mcp:browser
          npm run test:mcp:agent
      - name: Publish tested source without force or workflow edits
        run: git push origin HEAD:refs/heads/feat/mcp-lifecycle-and-data
      - name: Preserve exact source and validation reports
        if: always()
        run: git bundle create repository.bundle --all HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vb6-mcp-refinement-${{ github.sha }}
          retention-days: 7
          path: |
            repository.bundle
            reports
