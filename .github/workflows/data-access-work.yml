name: Data access development
on:
  push:
    branches: [feature/data-sources]
permissions:
  contents: read
jobs:
  integration-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 92a955acd6ad0c21b41d43a606c9adcc5e16ff49
      - name: Archive verified integration baseline
        run: |
          mkdir -p /tmp/vb6-data-baseline
          git archive HEAD > /tmp/vb6-data-baseline/main.tar
          git rev-parse HEAD > /tmp/vb6-data-baseline/main-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: data-integration-baseline
          path: /tmp/vb6-data-baseline
          retention-days: 7
