name: Data source integration
on:
  push:
    branches: [feature/data-sources]
    paths: ['.data-transfer/READY.json']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/data-sources | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/data-integration-result
          cp -r .data-transfer /tmp/data-integration-result/transfer
          python - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          root = pathlib.Path('.data-transfer')
          spec = json.loads((root/'READY.json').read_text())
          assert spec['base'] == '92a955acd6ad0c21b41d43a606c9adcc5e16ff49'
          dictionary = b''
          for path in spec['paths']:
              assert not path.startswith('/') and '..' not in path.split('/')
              result = subprocess.run(['git','show',spec['base']+':'+path], capture_output=True)
              if result.returncode == 0: dictionary += result.stdout
          assert hashlib.sha256(dictionary).hexdigest() == spec['dictionary_sha256']
          pathlib.Path('/tmp/data-dictionary').write_bytes(dictionary)
          chunks = [(root/f'part{i}.txt').read_text() for i in range(1,spec['parts']+1)]
          chunks[0] = chunks[0].replace('OAVLGCgwLbekeGGID8E8','OAVLGCgwLbekeGID8E8')
          original = chunks[0].encode()
          assert hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest() == '9f7a254270f2b2a7e3693643b00699f779e4bd50'
          packed = base64.b64decode(''.join(chunks), validate=True)
          pathlib.Path('/tmp/data-source.zst').write_bytes(packed)
          subprocess.run(['zstd','-d','--patch-from=/tmp/data-dictionary','/tmp/data-source.zst','-o','/tmp/data-source.patch'],check=True)
          patch = pathlib.Path('/tmp/data-source.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == spec['patch_sha256']
          PY
          git merge --no-edit e6c9dfc6732b9e99b8eb9756f9562784048fa114
          git apply --3way --index --exclude=.github/workflows/data-sources.yml /tmp/data-source.patch
      - name: Reproduce pinned engine and all distributions
        run: |
          set -euo pipefail
          mkdir -p /tmp/vb6-data-engine
          (cd /tmp/vb6-data-engine && npm pack sql.js@1.14.2 --ignore-scripts && tar xf sql.js-1.14.2.tgz)
          node tools/vendor-sqlite.mjs /tmp/vb6-data-engine/package
          npm run build
          npm test | tee /tmp/data-integration-result/data-node-tests.log
      - name: Prepare validated source commit
        run: |
          set -euo pipefail
          git rm -rf .data-transfer
          git add -A
          git commit -m 'feat(data): classic Data Environment, SQLite, REST and native gateway in shipped apps'
          git rev-parse HEAD > /tmp/data-integration-result/head.txt
          git archive HEAD | gzip > /tmp/data-integration-result/source.tar.gz
      - name: Publish source without modifying workflow files
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/data-sources | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code HEAD^ HEAD -- .github/workflows
          git push origin HEAD:refs/heads/feature/data-sources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-integration-result
          path: /tmp/data-integration-result
          if-no-files-found: ignore
          retention-days: 7
