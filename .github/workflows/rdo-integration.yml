name: Integrate RDO compatibility
on:
  push:
    branches: [feat/data-rdo-gateway-compat]
    paths: [.github/workflows/rdo-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply source delta
        run: |
          python - <<'PY'
          import base64,hashlib,pathlib,subprocess
          base='c066690c71032714b5e7f2633b8968ef88e29b4c'
          paths=['docs/DATA-SOURCES.md','src/data/connection.js','src/data/context.js','src/data/dao.js','src/data/defaults.js','src/data/http.js','src/data/rdo.js','src/runtime/vm.js','tests/data-gateway.test.mjs','tests/data-positional.test.mjs','tests/data-rdo.test.mjs','tests/fixtures/rdo-compat.bas','tools/browser-data-recordsets.py','tools/data-gateway.mjs','tools/data-live-drivers.mjs','tools/data/positional.mjs']
          dictionary=b''
          for p in paths:
              r=subprocess.run(['git','show',base+':'+p],capture_output=True)
              if not r.returncode: dictionary+=r.stdout
          assert hashlib.sha256(dictionary).hexdigest()=='5c80e784c73e61796a223da2e8a52a62ec2c78582b5d8697e3638e8b45cf45bb'
          pathlib.Path('/tmp/rdo-dict').write_bytes(dictionary)
          text=''.join(pathlib.Path(f'.rdo-transfer/part{i}.txt').read_text().strip() for i in (1,2))
          pathlib.Path('/tmp/rdo.zst').write_bytes(base64.b64decode(text,validate=True))
          subprocess.run(['zstd','-d','--patch-from=/tmp/rdo-dict','/tmp/rdo.zst','-o','/tmp/rdo.patch'],check=True)
          assert hashlib.sha256(pathlib.Path('/tmp/rdo.patch').read_bytes()).hexdigest()=='dd873971befb0775272e317ca20391d50a96c1030c040470c8161d22160f0efc'
          subprocess.run(['git','apply','--3way','--index','/tmp/rdo.patch'],check=True)
          PY
      - name: Build and test
        run: |
          set -euo pipefail
          mkdir -p /tmp/rdo-result
          npm run build
          npm test | tee /tmp/rdo-result/node-tests.log
      - name: Publish validated source
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/data-rdo-gateway-compat | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code HEAD -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .rdo-transfer
          git add -A
          git commit -m 'feat(data): RDO client APIs and cross-provider DAO/RDO positional binding'
          git push origin HEAD:refs/heads/feat/data-rdo-gateway-compat
          git rev-parse HEAD > /tmp/rdo-result/head.txt
          git archive HEAD | gzip > /tmp/rdo-result/source.tar.gz
          git bundle create /tmp/rdo-result/repository.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rdo-integration
          path: /tmp/rdo-result
          retention-days: 7
