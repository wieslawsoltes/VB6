name: Variant source snapshot
on:
  push:
    branches: [feat/variant-scalar-compatibility]
    paths: ['.github/workflows/variant-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact repository history
        run: |
          mkdir snapshot
          git bundle create snapshot/repository.bundle --all HEAD
          git rev-parse HEAD > snapshot/head.txt
          git bundle verify snapshot/repository.bundle
          sha256sum snapshot/repository.bundle > snapshot/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: variant-source-snapshot
          path: snapshot/
          retention-days: 7
