name: Reconcile agent workbench with approved native previews
on:
  push:
    branches: [feat/agent-change-review-queue]
    paths: [.github/workflows/agent-workbench-final-reconcile.yml]
permissions:
  contents: write
concurrency:
  group: agent-workbench-final-reconcile
  cancel-in-progress: true
jobs:
  reconcile:
    if: github.ref == 'refs/heads/feat/agent-change-review-queue'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reviewed source and merge current native debugger main
        shell: bash
        run: |
          git merge-base --is-ancestor ff3ac636b19864aec793105f8f41f428fee6fd2b HEAD
          test "$(git diff --name-only ff3ac636b19864aec793105f8f41f428fee6fd2b HEAD)" = .github/workflows/agent-workbench-final-reconcile.yml
          test "$(git rev-parse 2a45fce5f25b5f9e214acb82384119d00d7510cc^{tree})" = 2f1d225632544078efa06e6be006de92ae07a2e6
          git rev-parse HEAD > publication-base.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(['git','merge','--no-commit','--no-ff','2a45fce5f25b5f9e214acb82384119d00d7510cc'])
          conflicts = set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          assert result.returncode == 1 and conflicts == {'desktop/smoke.cjs','dist/VB6-Studio-Web.html','dist/studio.js'}, sorted(conflicts)
          subprocess.run(['git','checkout','--ours','--','dist/VB6-Studio-Web.html','dist/studio.js'],check=True)
          PY
      - name: Apply immutable source reconciliation with verified file hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          source = subprocess.check_output(['git','show','c948bd595baf3458f898f16103771cafb1ecbf30:.github/workflows/agent-workbench-final-reconcile.yml'],text=True)
          assert subprocess.check_output(['git','hash-object','--stdin'],input=source,text=True).strip() == '9c6a13ce9d10e9afbc2d2be6a4bd0e5f7301382b'
          section = source.split('      - name: Combine both native smoke assertions and add reviewed browser regressions\n',1)[1]
          block = section.split("          python3 - <<'PY'\n",1)[1].split('          PY\n',1)[0]
          assert block.count('new+old.lstrip()') == 1
          block = block.replace('new+old.lstrip()', 'new+old')
          exec(compile(textwrap.dedent(block),'verified-workbench-reconcile.py','exec'))
          PY
      - name: Build combined distributions and run complete regression suites
        shell: bash
        run: |
          npm run build | tee workbench-build.log
          node --check desktop/smoke.cjs
          node --test tests/native-smoke-harness.test.mjs tests/runtime-document.test.mjs | tee workbench-native-contracts.log
          npm run test:agents | tee workbench-agent-tests.log
          npm test | tee workbench-full-tests.log
      - name: Remove publisher and verify independently reproduced final tree
        shell: bash
        run: |
          git add -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples packages/win32-browser/dist
          git rm -- .github/workflows/agent-workbench-final-reconcile.yml
          git diff --cached --check
          test "$(git write-tree)" = 286d1dff2e386cd2c8fd5444754587235998a0f7
          git commit -m 'fix(agents): finish workbench integration with approved native previews'
      - name: Publish tested source and evidence
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/feat/agent-change-review-queue | cut -f1)" = "$(cat publication-base.txt)"
          git push origin HEAD:feat/agent-change-review-queue
          git rev-parse HEAD > head.txt
          git rev-parse HEAD^{tree} > tree.txt
          git ls-files -z | xargs -0 sha256sum > tracked-SHA256SUMS.txt
          git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-workbench-final-preview-integration
          path: |
            workbench-build.log
            workbench-native-contracts.log
            workbench-agent-tests.log
            workbench-full-tests.log
            publication-base.txt
            head.txt
            tree.txt
            tracked-SHA256SUMS.txt
            source.tar.gz
          retention-days: 7
