name: Integrate debugger with scalar runtime
on:
  push:
    branches: [feat/debugger-compatibility-boundaries]
    paths: ['.github/workflows/debugger-scalar-publish.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/debugger-compatibility-boundaries'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge reviewed main without overriding source conflicts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          result=subprocess.run(['git','merge','--no-commit','--no-ff','72dae4fa89e165f6f0dc0ba0aad5cb7615508ea3'])
          if result.returncode:
              paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
              assert len(paths)==20, 'Unexpected conflict set: '+str(paths)
              for path in paths:
                  assert path.startswith('dist/') or path=='src/exporter/runtime-payload.js', 'Source conflict needs review: '+path
                  subprocess.run(['git','checkout','--ours','--',path],check=True)
                  subprocess.run(['git','add','--',path],check=True)
          PY
      - name: Apply reviewed Immediate scalar correction
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('src/runtime/vm.js');s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='25730d3078a2aedc3d5b1588ca3c4259afbd3c58c5e97344616edafa5e1537d6'
          old="value=await this.evaluateScalar(parseCall(statement.replace(/^Call\\s+/i,''),{explicit:/^Call\\s+/i.test(statement)}),frame);if(value!==undefined)this.output(describe(value));"
          new="value=await this.evaluateScalar(parseCall(statement.replace(/^Call\\s+/i,''),{explicit:/^Call\\s+/i.test(statement)}),frame);\n        // A tagged Empty result is still a void command. Explicit ?/Print above\n        // displays Empty; an ordinary Sub/host call must not add a phantom line.\n        if(unbox(value)!==undefined)this.output(describe(value));"
          assert s.count(old)==1;s=s.replace(old,new)
          assert hashlib.sha256(s.encode()).hexdigest()=='ac3b24fb9c86d5e2ad61fcfd4c5c7e9f961300c4ba56e49214ba8037f9e6923c'
          p.write_text(s)
          assert hashlib.sha256(Path('tests/debugger-scalar-integration.test.mjs').read_bytes()).hexdigest()=='2b6f3d0a91637eebfa0c25c7e7926664a040e213e712465e4804960b0e9f81ac'
          p=Path('docs/DEBUGGER-FINAL-INTEGRATION.md');s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='04d452a731bfc43fb8cbde2e53edc6cb514f057ffe04a2fd87faddb86c2bda65'
          s+='''
          ## Scalar-runtime reconciliation

          Main advanced to `72dae4fa89e165f6f0dc0ba0aad5cb7615508ea3` during final publication.
          The follow-up retains that complete tagged-scalar/native-Automation implementation
          and all recovered debugger changes. Source files merge normally; only generated
          IDE/runtime bundles and the runtime payload require regeneration.

          Tagged Empty values exposed an Immediate output bug: void source or host calls
          printed an extra Empty line. Ordinary command results now check the unboxed value
          without discarding scalar metadata; explicit `? Empty` and Print remain visible.
          Five new integration regressions cover void source/host calls, explicit Empty/Null,
          zero/False results, event-mode Variant promotion, retained ByRef Variant identity
          and subtype across code revisions, and atomic strict-policy rejection. The
          complete combined suite passes **3,007 tests**, with zero failed/skipped/cancelled.

          The final PR merge-gate comment identifies the tested source revision and real
          browser/Windows workflow outcomes after this reconciliation. Earlier source
          identifiers and 2,808-test counts above describe the preceding publication stage.
          '''
          assert hashlib.sha256(s.encode()).hexdigest()=='3d53186489748cc8f484185aa92406f86493fe1f2d49ac420f06a22b8ddd0a78'
          p.write_text(s)
          PY
      - run: npm run build
      - name: Full combined Node suite
        run: |
          set -o pipefail
          npm test | tee /tmp/debugger-scalar-unit.log
      - name: Verify exact independently reviewed tree and reproducible output
        run: |
          git add -A
          git diff --cached --check
          git rm --cached .github/workflows/debugger-scalar-publish.yml
          test "$(git write-tree)" = af3e285133314a31e5ef918a015ab8a1ba0e2504
          git add .github/workflows/debugger-scalar-publish.yml
          git commit -m 'fix(debugger): preserve Immediate output and live state with tagged scalar runtime'
          npm run build
          git diff --exit-code
      - name: Publish validated combined source without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/debugger-compatibility-boundaries | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/debugger-compatibility-boundaries
          git rev-parse HEAD > /tmp/debugger-scalar-published.sha
          git bundle create /tmp/debugger-scalar-published.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debugger-scalar-publication
          path: /tmp/debugger-scalar-*
          if-no-files-found: ignore
          retention-days: 7
