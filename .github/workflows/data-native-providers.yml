name: Native data providers
on:
  push:
    branches: [main, feat/data-native-provider-validation]
    paths: ['src/data/**', 'tools/data/**', 'tools/data-*.mjs', 'tests/data-*.mjs', '.github/workflows/data-native-providers.yml']
  pull_request:
    paths: ['src/data/**', 'tools/data/**', 'tools/data-*.mjs', 'tests/data-*.mjs', '.github/workflows/data-native-providers.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-data-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  odbc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install real UnixODBC and SQLite ODBC driver
        run: sudo apt-get update && sudo apt-get install -y unixodbc unixodbc-dev libsqliteodbc
      - name: Install optional trusted native ODBC adapter
        run: npm install --no-save --package-lock=false odbc@2.6.0
      - name: Full regression suite
        run: npm test
      - name: Test actual ODBC through the authenticated gateway
        run: node tools/data-provider-tests.mjs odbc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-odbc-evidence
          path: reports/data-providers
          retention-days: 14
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full regression suite
        run: npm test
      - name: Probe actual provider bitness and test genuine MDB and ACCDB files
        run: node tools/data-provider-tests.mjs windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-provider-evidence
          path: reports/data-providers
          retention-days: 14
