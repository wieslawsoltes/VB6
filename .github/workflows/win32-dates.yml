name: Win32 Date export
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: win32-dates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-execution:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: node --test tests/win32-date.test.mjs
      - run: node tools/win32-date-fixtures.mjs
      - name: Execute single-file Date storage, calendar, calls and array tests
        shell: pwsh
        run: ./tools/test-win32-dates.ps1
      - run: node tools/win32-date-abi-fixtures.mjs
      - name: Verify DATE ABI and calendar results against independently compiled Windows API calls
        shell: pwsh
        run: ./tools/test-win32-date-abi.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-date-execution
          path: validation/dates/
          retention-days: 14
  browser-export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: node tools/win32-fixtures.mjs
      - run: node tools/win32-numeric-fixtures.mjs
      - run: node tools/win32-currency-fixtures.mjs
      - run: node tools/win32-bindings-fixtures.mjs
      - run: node tools/win32-date-fixtures.mjs
      - run: node tools/win32-date-abi-fixtures.mjs
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Match IDE, standalone SDK and Blob worker Date exports to Node
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tools/browser-native-build-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: date-browser-export
          path: validation/browser-native/
          retention-days: 14
