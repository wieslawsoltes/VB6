name: Compiler source recovery
on:
  push:
    branches: [feat/compiler-runtime-completion]
    paths: ['.github/workflows/compiler-runtime-recovery.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve tracked history without checkout credentials
        run: |
          mkdir -p recovery-artifact
          git bundle create recovery-artifact/repository.bundle --all
          git show-ref > recovery-artifact/refs.txt
          git bundle verify recovery-artifact/repository.bundle
          sha256sum recovery-artifact/repository.bundle > recovery-artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-source-recovery
          path: recovery-artifact/
          retention-days: 7
