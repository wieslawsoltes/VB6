name: Materialize tested region sources
on:
  push:
    branches: [feature/win32-gdi-regions]
    paths: ['.transfer/**', '.github/workflows/regions-materialize.yml']
permissions:
  contents: write
jobs:
  materialize:
    if: github.ref == 'refs/heads/feature/win32-gdi-regions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/win32-gdi-regions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply checksum-verified source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, subprocess
          parts = sorted(Path('.transfer').glob('regions.*.b64'))
          assert len(parts) == 3
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd1bcdc0e45498b4aa2ea20944e29e10e828eeeb74802d3d3cf94dd126ab2b57f'
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          for p in parts: p.unlink()
          Path('.github/workflows/regions-materialize.yml').unlink()
          PY
      - run: npm run build
      - run: node tools/win32-api-inventory.mjs
      - run: npm test
      - name: Commit implementation and regenerated distributions
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add -A
          git commit -m 'feat(win32-browser): immutable regions, complex clipping and native contracts'
          git push origin HEAD:feature/win32-gdi-regions
