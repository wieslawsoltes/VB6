name: Region integration source
on:
  push:
    branches: [feature/win32-gdi-regions]
    paths: [.github/workflows/regions-materialize.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture exact source history and merge diagnostics
        run: |
          git bundle create /tmp/vb6-regions-review.bundle HEAD refs/remotes/origin/main
          git config user.name 'Integration review'
          git config user.email 'integration@users.noreply.github.com'
          git merge --no-commit --no-ff origin/main > /tmp/regions-merge-review.txt 2>&1 || true
          git diff --name-only --diff-filter=U >> /tmp/regions-merge-review.txt
          cat /tmp/regions-merge-review.txt
      - uses: actions/upload-artifact@v4
        with:
          name: win32-regions-source
          path: |
            /tmp/vb6-regions-review.bundle
            /tmp/regions-merge-review.txt
          retention-days: 7
