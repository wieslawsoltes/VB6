name: Region browser test stabilization
on:
  push:
    branches: [feature/win32-gdi-regions]
    paths: [.github/workflows/regions-materialize.yml]
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply the locally tested queue-drain assertions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          p=Path('tools/browser-win32-compat-tests.py');s=p.read_text()
          assert 'def click_control' not in s
          s=s.replace('def verify_app(page):', '''def click_control(page, name):
              page.locator(f'[data-control="{name}"]').click()
              # Declare buffers can be zero between awaited VB statements. Observe the
              # entire input/procedure queue draining before checking retained resources.
              page.wait_for_function("""()=>{const v=vb6Application.vm;return !v.processing && v.stack.length===0 && v.eventQueue.length===0;}""")
          
          def verify_app(page):''')
          s=re.sub(r'page\.locator\(\'\[data-control="(cmd[^"]+)"\]\'\)\.click\(\)',lambda m:'click_control(page, '+repr(m[1])+')',s)
          assert hashlib.sha256(s.encode()).hexdigest()=='2da71ce68884ab81e7ea55eba1d1169f38e906cac839f592590dca0d8aa5c731'
          p.write_text(s)
          PY
          python3 -m py_compile tools/browser-win32-compat-tests.py
          git diff --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add tools/browser-win32-compat-tests.py
          git commit -m 'test(win32-browser): observe completed event lifetimes without timing sleeps'
      - name: Push only to the expected feature branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/win32-gdi-regions | cut -f1)" = "$EXPECTED_SHA"
          git push origin HEAD:refs/heads/feature/win32-gdi-regions
