name: Publish verified agent permission profiles
on:
  push:
    branches: [feat/codex-style-agent-permissions]
permissions:
  contents: write
concurrency:
  group: permission-source-preparation
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/feat/codex-style-agent-permissions'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed source patch without replacing concurrent main changes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          data = base64.b64decode(''.join(Path('tools/.permission-update.part' + str(i)).read_text() for i in range(4)), validate=True)
          assert hashlib.sha256(data).hexdigest() == '0e9176cdb965e30dde63af8ca2f8d25097f16d61ad51f243be524879e28a142a'
          change = json.loads(lzma.decompress(data))
          assert change['base'] == 'f905988a06004cb60f404d2bddeecc1318c361d8'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == change['applyTo'] == '3406db8e7d87c99fddbdff4e422def0f7cb19043'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          allowed = {'README.md', 'docs/CODING-AGENT-PERMISSIONS.md', 'docs/CODING-AGENT-THREADS.md', 'docs/coding-agents.md', 'src/agents/agent.js', 'src/agents/agents.css', 'src/agents/conversations.js', 'src/agents/permissions.js', 'src/agents/studio.js', 'src/agents/thread.js', 'src/mcp/agent-permissions.js', 'src/mcp/agent-tools.js', 'src/mcp/agent-workbench.js', 'src/mcp/ide-adapter.js', 'tests/coding-agents-permissions.test.mjs', 'tools/coding-agents-browser-tests.py'}
          assert len(change['files']) == len(allowed) and {item['path'] for item in change['files']} == allowed
          for item in change['files']:
              p = Path(item['path'])
              if item['before'] is None:
                  assert not p.exists(), str(p)
              else:
                  assert subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip() == item['before'], str(p)
          patch = change['patch'].encode()
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          assert set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()) == allowed
          for item in change['files']:
              assert hashlib.sha256(Path(item['path']).read_bytes()).hexdigest() == item['sha256'], item['path']
              print(item['sha256'], item['path'])
          PY
      - name: Build combined main and permission implementation
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee permission-build.log
      - name: Permission enforcement and existing agent regression suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:agents 2>&1 | tee permission-agent-tests.log
      - name: Complete combined repository regression suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee permission-full-tests.log
      - name: Remove transfer helpers and verify exact source publication
        shell: bash
        run: |
          git add -- dist/VB6-Studio-Web.html dist/studio.js dist/studio.css
          git rm -- .github/workflows/permission-source-prepare.yml tools/.permission-update.part0 tools/.permission-update.part1 tools/.permission-update.part2 tools/.permission-update.part3
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', '3406db8e7d87c99fddbdff4e422def0f7cb19043'], text=True).splitlines())
          allowed = {'README.md', 'docs/CODING-AGENT-PERMISSIONS.md', 'docs/CODING-AGENT-THREADS.md', 'docs/coding-agents.md', 'src/agents/agent.js', 'src/agents/agents.css', 'src/agents/conversations.js', 'src/agents/permissions.js', 'src/agents/studio.js', 'src/agents/thread.js', 'src/mcp/agent-permissions.js', 'src/mcp/agent-tools.js', 'src/mcp/agent-workbench.js', 'src/mcp/ide-adapter.js', 'tests/coding-agents-permissions.test.mjs', 'tools/coding-agents-browser-tests.py', 'dist/VB6-Studio-Web.html', 'dist/studio.js', 'dist/studio.css'}
          assert changed == allowed, changed ^ allowed
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          PY
      - name: Publish tested normal source and artifacts to feature branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(agents): add Codex-style permission profiles, full IDE access and run approvals'
          git push origin HEAD:feat/codex-style-agent-permissions
          git rev-parse HEAD > head.txt
          git rev-parse HEAD^{tree} > tree.txt
          git ls-files -z | xargs -0 sha256sum > tracked-SHA256SUMS.txt
          git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-permission-source-validation
          path: |
            permission-build.log
            permission-agent-tests.log
            permission-full-tests.log
            head.txt
            tree.txt
            tracked-SHA256SUMS.txt
            source.tar.gz
          retention-days: 7
