name: Agent task editor integration
on:
  push:
    branches: [feat/agent-conversations]
    paths: [.github/workflows/agent-task-final-refresh.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/agent-conversations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge pinned main, allowing only regenerated bundle conflicts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3cf6c4379e4252a3433b74daa5b87ebb627ba853
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff --no-commit 523da10a94f3ed70708ff25d309921baaca7278e || {
            python - <<'PY'
          import subprocess
          conflicts=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          assert conflicts and conflicts <= {'dist/studio.js','dist/VB6-Studio-Web.html'}, 'Unexpected source conflicts: '+str(conflicts)
          PY
          }
          git checkout --ours -- dist/studio.js dist/VB6-Studio-Web.html
          git add dist
          git diff --exit-code HEAD -- src/agents src/mcp/ide-adapter.js tests/coding-agents-tasks.test.mjs tools/agent-relay.mjs tools/coding-agents-browser-tests.py docs/coding-agents.md
      - name: Rebuild and validate full combined source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent-task-editor
          npm run build
          npm test | tee /tmp/agent-task-editor/node-tests.txt
          npm run test:agents | tee /tmp/agent-task-editor/agent-tests.txt
          git add -A
          npm run build
          git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git diff --cached --check
      - name: Record product tree and publish without force
        shell: bash
        run: |
          set -euo pipefail
          index=$(mktemp)
          cp .git/index "$index"
          GIT_INDEX_FILE="$index" git update-index --force-remove .github/workflows/agent-task-final-refresh.yml
          GIT_INDEX_FILE="$index" git write-tree > /tmp/agent-task-editor/product-tree.txt
          rm "$index"
          git commit -m 'fix(agents): preserve merged editor event-selection fixes in final IDE'
          git push origin HEAD:refs/heads/feat/agent-conversations
          git rev-parse HEAD > /tmp/agent-task-editor/head.txt
          git bundle create /tmp/agent-task-editor/repository.bundle HEAD
          cd /tmp/agent-task-editor
          sha256sum repository.bundle > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-task-editor-integration
          path: /tmp/agent-task-editor/
          retention-days: 3
