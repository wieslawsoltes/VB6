name: Publish reviewed native preview navigation fix
on:
  push:
    branches: [feat/native-declare-strings]
    paths: [.github/workflows/native-preview-fix-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed source only with exact before and after fingerprints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          sha=lambda b:hashlib.sha256(b).hexdigest()
          p=Path('src/ide/main.js');s=p.read_text()
          assert sha(p.read_bytes())=='9aa13884f2a3189dc1b33df84360c0e8276198f644a729b81c57f9ba696f4e63'
          pairs=[('this.runtimeFrame.srcdoc=exportApplication(this.project,','this.loadRuntimeDocument(this.runtimeFrame,exportApplication(this.project,'),
           ("watchpoints:this.debuggerWindows?.snapshot().filter(w=>w.mode!=='expression')||[],...debugOptions});this.documents.readOnly();","watchpoints:this.debuggerWindows?.snapshot().filter(w=>w.mode!=='expression')||[],...debugOptions}));this.documents.readOnly();"),
           ('  requestRuntime(command,values={})','  loadRuntimeDocument(frame,html){frame.srcdoc=html;}\n  requestRuntime(command,values={})')]
          for old,new in pairs:
              assert s.count(old)==1
              s=s.replace(old,new)
          assert sha(s.encode())=='5c78fde501717b475f397d8f873eb55548b3cec8d25264c569bdda8d272a77cb'
          p.write_text(s)
          p=Path('desktop/smoke.cjs');s=p.read_text()
          assert sha(p.read_bytes())=='75ed00cf8b13528ea32bb4e099faa0b99cd11fa3169018e459ec8d6ab2a026db'
          begin=s.index("      await js('vb6Studio.run()');")
          end=s.index('    } else {',begin)
          s=s[:begin]+'''      report.previewNavigations=[];
                const navigated=(event,url)=>report.previewNavigations.push(typeof url==='string'?url:event.url);
                root.webContents.on('did-start-navigation',navigated);
                try {
                  const urls=new Set();
                  for (let pass=1;pass<=2;pass++) {
                    check('native preview '+pass+' registers its document',await js('vb6Studio.run();vb6Studio.nativePreviewReady'));
                    const url=await js('vb6Studio.runtimeFrame.src');
                    check('native preview '+pass+' has no srcdoc navigation',await js('!vb6Studio.runtimeFrame.hasAttribute("srcdoc")'));
                    check('native preview '+pass+' uses a fresh host document',url.startsWith('vb6://app/preview/')&&!urls.has(url));urls.add(url);
                    await until(() => root.webContents.mainFrame.frames.some(f => f.url===url), 'preview frame');
                    const frame = root.webContents.mainFrame.frames.find(f => f.url===url);
                    await until(() => frame.executeJavaScript('!!globalThis.vb6Application'), 'runtime preview started');
                    check('IDE preview '+pass+' runs under document-specific CSP', true);
                    check('IDE preview '+pass+' cannot access native bridge', await frame.executeJavaScript('typeof vb6Native === "undefined"'));
                    check('IDE preview '+pass+' rejects arbitrary inline scripts',await frame.executeJavaScript(`(async()=>{
                      const script=document.createElement('script');script.textContent='globalThis.untrustedPreviewScript=true';document.body.append(script);
                      await new Promise(resolve=>setTimeout(resolve,25));return !globalThis.untrustedPreviewScript;
                    })()`));
                    await js('vb6Studio.stop()');
                  }
                  check('desktop preview never starts or commits srcdoc',!report.previewNavigations.includes('about:srcdoc'));
                } finally { root.webContents.removeListener('did-start-navigation',navigated); }
          '''+s[end:]
          old='    report.error = error.stack || error.message;'
          assert s.count(old)==1
          extra='''    try {
                report.frames=root.webContents.mainFrame.framesInSubtree.map(f=>({url:f.url,detached:f.detached,id:f.frameTreeNodeId}));
                if(manifest.kind==='studio') report.preview=await js(`(()=>{const s=vb6Studio,f=s.runtimeFrame;return {runState:s.runState,frame:f&&{src:f.src,srcdoc:f.hasAttribute('srcdoc'),connected:f.isConnected},diagnostics:s.diagnostics};})()`);
              } catch (diagnosticError) { report.diagnosticError=diagnosticError.message; }
          '''
          s=s.replace(old,extra+old)
          assert sha(s.encode())=='54f41d8cbdade4901f76d6a482decf019773bf271777794f04cf8b4f971682ac','Smoke result differs from reviewed source'
          p.write_text(s)
          expected={
           'desktop/studio.mjs':'952a5fb8601659451ff7361d0ac56f28a06b5a783271cf4a16bfcb1d478359f6',
           'tests/native-preview.test.mjs':'8fe9ca3a6fc6e5ff5f6c87a61d70704318f2d708dec593ea73f5f1601cc25ce6',
           'docs/NATIVE-PREVIEW-LIFECYCLE.md':'f9404e5d9ac4c2080bd8169d36473455c16b66cb03eacd9f47c75375f7e8bedf'}
          for path,digest in expected.items():assert sha(Path(path).read_bytes())==digest,path
          PY
      - run: npm run build && npm test
      - name: Commit reviewed sources and regenerated IDE bundles
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add src/ide/main.js desktop/smoke.cjs dist
          git diff --cached --check
          git commit -m 'fix(desktop): register preview documents before navigating sandbox frames' -m 'Replace post-hoc srcdoc cancellation with an explicit document loader. Reproduce Windows srcdoc/CSP race with fresh and detached IDE traces. Add stale registration/error isolation tests and two real preview launches with arbitrary inline-script rejection. Preserve CSP, sandbox and timeouts; rebuild and pass the complete Node suite.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/feat/native-declare-strings
