name: GDI upstream integration
on:
  push:
    branches: [feature/win32-gdi-boundaries]
    paths: [.github/workflows/gdi-upstream-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feature/win32-gdi-boundaries'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate reviewed native Date update and rebuild generated conflicts
        run: |
          set -euo pipefail
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git merge --no-commit --no-ff 30febe16733be5d71eb4428d4888866947a088fe || true
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert all(p.startswith('dist/') or p in ('src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js') for p in paths),paths
          PY
          npm run build
          node tools/win32-api-inventory.mjs --check
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          npm test > /tmp/gdi-upstream-tests.txt
          npm run pack:win32-browser > /tmp/gdi-upstream-package-tests.txt
          tail -10 /tmp/gdi-upstream-tests.txt
          tail -11 /tmp/gdi-upstream-package-tests.txt
          git diff --exit-code
          git diff --cached --check 30febe16733be5d71eb4428d4888866947a088fe
          git commit -m 'fix(win32-browser): retain native Date support in regenerated combined distributions'
      - name: Push only to unchanged feature branch and retain exact source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/win32-gdi-boundaries | cut -f1)" = "$EXPECTED_SHA"
          git push origin HEAD:refs/heads/feature/win32-gdi-boundaries
          git bundle create /tmp/vb6-gdi-upstream.bundle HEAD refs/remotes/origin/main
          git archive --format=zip HEAD -o /tmp/vb6-gdi-upstream-source.zip
          git rev-parse HEAD HEAD^{tree} > /tmp/gdi-upstream-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdi-upstream-integration
          path: |
            /tmp/vb6-gdi-upstream.bundle
            /tmp/vb6-gdi-upstream-source.zip
            /tmp/gdi-upstream-revision.txt
            /tmp/gdi-upstream-tests.txt
            /tmp/gdi-upstream-package-tests.txt
            release/vb6-win32-browser-*.tgz
          retention-days: 7
