name: Update data visual inventories
on:
  push:
    branches: [feature/data-sources]
    paths: ['.github/workflows/data-test-inventory.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update explicit expected inventories
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/browser-icon-tests.py')
          before="check(counts == {'icons':111, 'controls':39, 'missing':0}, counts)"
          after="check(counts == {'icons':111, 'controls':40, 'missing':0}, counts)"
          text=p.read_text();assert text.count(before)==1;p.write_text(text.replace(before,after))
          p=Path('tools/browser-visual-tests.py')
          before="check(d.get_by_role('option').count()==12);"
          after="check(d.get_by_role('option').count()==16);"
          text=p.read_text();assert text.count(before)==1;text=text.replace(before,after)
          before="check(d.get_by_role('option',name='Runtime Workbench',exact=True).count()==1);"
          after=before+"check(all(d.get_by_role('option',name=name,exact=True).count()==1 for name in ('SQLite Customers','REST Customers','Public REST Users','GraphQL and OData')));"
          assert text.count(before)==1;p.write_text(text.replace(before,after))
          PY
      - name: Build and test unchanged application source
        run: npm run build && npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0 Pillow
      - run: python -m playwright install --with-deps chromium
      - name: Validate full icon and visual suites
        run: |
          set -euo pipefail
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export CHROMIUM="$CHROMIUM_PATH"
          python tools/browser-icon-tests.py --launch all
          python tools/browser-visual-tests.py
      - name: Publish only reviewed visual test updates
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/data-sources | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code -- dist src examples
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/browser-icon-tests.py tools/browser-visual-tests.py
          git commit -m 'test(data): cover Adodc icon and all four new project templates'
          git push origin HEAD:refs/heads/feature/data-sources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-visual-inventory-validation
          path: |
            reports/icons
            reports/browser-visual-tests.json
            reports/visual
          retention-days: 7
