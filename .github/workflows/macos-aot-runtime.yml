name: Refresh verified macOS runtime
on:
  workflow_dispatch:
  push:
    branches: ["maint/macos-runtime-*"]
permissions:
  contents: read
concurrency:
  group: macos-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && startsWith(github.ref, 'refs/heads/maint/macos-runtime-')
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive exact SDK source before compilation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/macos-runtime-source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/macos-runtime-source/source.tar.gz" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/macos-runtime-source/revision.txt"
          (cd "$RUNNER_TEMP/macos-runtime-source" && shasum -a 256 source.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-runtime-source-${{ github.sha }}
          path: ${{ runner.temp }}/macos-runtime-source
          retention-days: 14
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test-macos-aot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-native-runtime
          path: |
            artifacts/macos-aot/runtime
            reports/macos-aot
          retention-days: 14
  publish:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: verified-native-runtime
          path: native-input
      - name: Verify exact native provenance and create offline payload
        run: node tools/embed-macos-aot-runtime.mjs native-input/artifacts/macos-aot/runtime native-input/reports/macos-aot/validation.json
      - name: Commit only the generated runtime with a branch-head lease
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {owner, repo} = context.repo;
            const branch = context.ref.replace(/^refs\/heads\//, '');
            if (!/^maint\/macos-runtime-[A-Za-z0-9_.-]+$/.test(branch)) throw new Error('Runtime refresh may not modify this branch');
            const ref = 'heads/' + branch;
            const head = (await github.rest.git.getRef({owner, repo, ref})).data.object.sha;
            if (head !== context.sha) throw new Error('Branch advanced; regenerate from its new head');
            const file = 'packages/macos-native/src/aot-runtime-payload.js';
            const content = fs.readFileSync(file);
            if (content.length > 32 * 1024 * 1024) throw new Error('Runtime payload exceeds limit');
            const parent = (await github.rest.git.getCommit({owner, repo, commit_sha: head})).data;
            const blob = (await github.rest.git.createBlob({owner, repo, encoding:'base64', content:content.toString('base64')})).data;
            const tree = (await github.rest.git.createTree({owner, repo, base_tree:parent.tree.sha, tree:[{path:file, mode:'100644', type:'blob', sha:blob.sha}]})).data;
            if (tree.sha === parent.tree.sha) {core.info('Verified runtime already current'); return;}
            const commit = (await github.rest.git.createCommit({owner, repo, message:'build(macos): embed natively verified Apple Silicon runtime', tree:tree.sha, parents:[head]})).data;
            if ((await github.rest.git.getRef({owner, repo, ref})).data.object.sha !== head) throw new Error('Branch advanced while preparing runtime commit');
            await github.rest.git.updateRef({owner, repo, ref, sha:commit.sha, force:false});
            core.notice('Runtime committed as ' + commit.sha + '; exact-head validation is still required before merge.');
