name: Data sources
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: data-sources-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline SQLite engine
        run: |
          mkdir -p /tmp/vb6-sqljs
          (cd /tmp/vb6-sqljs && npm pack sql.js@1.14.2 --ignore-scripts && tar xf sql.js-1.14.2.tgz)
          node tools/vendor-sqlite.mjs /tmp/vb6-sqljs/package
          git diff --exit-code -- src/data/vendor
      - name: Build and test data providers
        run: npm run build && node --test tests/data-*.test.mjs
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Test IDE and exported applications
        run: |
          python tools/browser-data-sources.py
          python tools/browser-data-layout.py
      - name: Verify reproducible application bundles
        run: git diff --exit-code -- dist src/exporter/runtime-payload.js examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-source-browser-evidence
          path: reports/data-sources
          retention-days: 7
  client-recordsets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps '${{ matrix.browser }}'
      - run: python tools/browser-data-recordsets.py --browser '${{ matrix.browser }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-recordsets-${{ matrix.browser }}
          path: reports/data-sources/recordsets-*.json
          retention-days: 7
  native-drivers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        driver: [pg, mysql, mssql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install optional gateway-only drivers
        run: npm install --no-save --package-lock=false --ignore-scripts pg@8.23.1 mysql2@3.24.5 mssql@12.7.3
      - name: Test disposable loopback database through the authenticated gateway
        run: node tools/data-container-tests.mjs '${{ matrix.driver }}'
