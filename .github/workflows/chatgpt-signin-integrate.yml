name: Integrate sign-in fix
on:
  push:
    branches: [fix/chatgpt-signin-feedback]
    paths: ['.github/workflows/chatgpt-signin-integrate.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/fix/chatgpt-signin-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge inspected main and rebuild only generated conflicts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git cat-file -e 4cc9031c37a294710bf436373cbdb6e25005958b^{commit}
          git merge --no-commit --no-ff 4cc9031c37a294710bf436373cbdb6e25005958b || true
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
          assert set(paths) <= {'dist/studio.js', 'dist/VB6-Studio-Web.html'}, 'Unexpected source conflict: ' + repr(paths)
          for path in paths:
              subprocess.run(['git', 'checkout', '--ours', '--', path], check=True)
              subprocess.run(['git', 'add', '--', path], check=True)
          PY
          npm run build
          git add dist/studio.js dist/VB6-Studio-Web.html
      - run: npm test
      - name: Verify exact independently built tree and publish integration
        run: |
          git rm .github/workflows/chatgpt-signin-integrate.yml
          git diff --cached --check
          test "$(git write-tree)" = a6802e467d4d59b0b4a0f21d5da679491561839d
          test "$(git ls-remote origin refs/heads/fix/chatgpt-signin-feedback | cut -f1)" = "$GITHUB_SHA"
          git commit -m 'Merge main selective review and rebuild sign-in recovery bundles'
          git push origin HEAD:refs/heads/fix/chatgpt-signin-feedback
