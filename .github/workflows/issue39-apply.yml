name: Apply reviewed issue 39 sources
on:
  push:
    branches: [fix/issue-39-visual-fidelity]
    paths: [.github/workflows/issue39-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/fix/issue-39-visual-fidelity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply locally reviewed source bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json
          allowed = {'src/theme/fidelity.css','src/theme/menu.js','tools/build.mjs','tools/browser-issue39.py','tests/fixtures/caption-glyphs.json','tests/fixtures/issue39.mjs','tests/issue39-fidelity.test.mjs','docs/ISSUE-39-VISUAL-FIDELITY.md'}
          encoded = ''.join(Path(f'tools/.issue39-source-{i}').read_text() for i in range(5))
          data = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(data).hexdigest() == 'fd3543fd991580680123bbf7cf3106f18fe6d3d7d6a57caeb771a2746ab8b561'
          entries = json.loads(gzip.decompress(data))
          assert len(entries) == len(allowed) and {e['path'] for e in entries} == allowed
          for entry in entries:
              p = Path(entry['path'])
              actual = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              assert actual == entry['before'], ('Source conflict', str(p), actual)
              assert hashlib.sha256(entry['text'].encode('utf-8')).hexdigest() == entry['after']
          for entry in entries:
              p = Path(entry['path']); p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(entry['text'].encode('utf-8'))
          print('Verified and applied', len(entries), 'reviewed source files')
          PY
      - name: Build and test combined sources
        run: npm run build && npm test
      - name: Publish readable source and reproducible distributions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/.issue39-source-0 tools/.issue39-source-1 tools/.issue39-source-2 tools/.issue39-source-3 tools/.issue39-source-4
          git add src/theme/fidelity.css src/theme/menu.js tools/build.mjs tools/browser-issue39.py tests/fixtures/caption-glyphs.json tests/fixtures/issue39.mjs tests/issue39-fidelity.test.mjs docs/ISSUE-39-VISUAL-FIDELITY.md dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git commit -m 'fix(ui): address issue 39 caption, menu, selector, tab and toolbar annotations'
          git push origin HEAD:fix/issue-39-visual-fidelity
