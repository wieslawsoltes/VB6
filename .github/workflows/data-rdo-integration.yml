name: Integrate RDO compatibility
on:
  push:
    branches: [feat/data-rdo-gateway-compat]
    paths: ['.github/workflows/data-rdo-integration.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge reviewed source, rebuilding only generated conflicts
        run: |
          set -euo pipefail
          mkdir -p /tmp/rdo-integration
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          target='a344a8fa8d667adbd934e595dd618836930b2120'
          merge=subprocess.run(['git','merge','--no-commit','--no-ff',target])
          paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert all(p.startswith('dist/') or p in ('src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js') for p in paths), 'Source conflicts require review: '+repr(paths)
          assert merge.returncode == 0 or paths
          if paths: subprocess.run(['git','restore','--source=HEAD','--staged','--worktree','--',*paths],check=True)
          PY
          git diff --exit-code HEAD -- .github/workflows
      - name: Rebuild and validate
        run: |
          set -euo pipefail
          npm run build
          npm test > /tmp/rdo-integration/tests.log 2>&1
          tail -15 /tmp/rdo-integration/tests.log
      - name: Publish validated integration without workflow mutations
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/data-rdo-gateway-compat | cut -f1)" = "$GITHUB_SHA"
          git add -A
          git diff --check --cached
          git commit -m 'Merge current main into RDO compatibility and rebuild distributions'
          git push origin HEAD:refs/heads/feat/data-rdo-gateway-compat
      - name: Capture exact integrated source and ancestry
        if: always()
        run: |
          mkdir -p /tmp/rdo-integration
          git rev-parse HEAD > /tmp/rdo-integration/head.txt
          git bundle create /tmp/rdo-integration/repository.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rdo-integration
          path: /tmp/rdo-integration
          retention-days: 7
