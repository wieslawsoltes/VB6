name: Publish reviewed native callback sources
on:
  push:
    branches: [feat/native-compatibility-boundaries]
    paths: [.github/workflows/native-callback-source-publish.yml]
permissions:
  contents: write
concurrency:
  group: native-callback-source-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only fingerprint-checked reviewed source changes
        run: python3 tools/.apply-native-review.py
      - run: npm run build
      - run: npm test
      - run: node tools/win32-callback-fixtures.mjs && node tools/win32-array-budget-fixture.mjs
      - name: Publish readable source and regenerated distributions
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git rm tools/.apply-native-review.py
          git add src docs tests tools dist
          git diff --cached --check
          git commit -m 'feat(native): guarded scalar AddressOf callbacks and configurable array budgets' -m 'Apply reviewed source fingerprints; retain interval and rank-60 array work; rebuild IDE and SDK and pass complete Node suite. Native callback execution is a separate required validation gate.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/feat/native-compatibility-boundaries
