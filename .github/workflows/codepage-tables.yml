name: Windows code-page reference
on:
  push:
    branches: [main]
    paths: ['tools/conformance/export-codepages.ps1', '.github/workflows/codepage-tables.yml']
  pull_request:
    paths: ['src/runtime/codepages*', 'tools/conformance/export-codepages.ps1', '.github/workflows/codepage-tables.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tables:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture actual Windows strict encoding and decoding tables
        shell: powershell
        run: tools/conformance/export-codepages.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-codepage-tables
          path: reports/conformance/windows-codepages.bin*
          retention-days: 14
