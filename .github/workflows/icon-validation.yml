name: Icon validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/icon-validation.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/icon-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright Pillow
      - run: python -m playwright install --with-deps chromium
      - run: npm run build && npm test
      - name: Glyphs, themes, states, file and HTTP launch
        run: python tools/browser-icon-tests.py --launch all
      - name: Existing browser workflows
        run: python tools/browser-tests.py
      - name: Existing visual and interaction regression suite
        run: python tools/browser-visual-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-icons-${{ github.sha }}
          retention-days: 7
          path: |
            src/
            tools/
            tests/
            docs/
            examples/
            dist/
            reports/icons/
            reports/visual/
            package.json
            LICENSE
            README.md
