name: OCX final source integration
on:
  push:
    branches: [feat/ocx-hosting-lifecycle]
permissions:
  contents: read
concurrency:
  group: ocx-finalize-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/ocx-hosting-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge reviewed main and regenerate only derived conflicts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          result=subprocess.run(['git','merge','--no-commit','--no-ff','728a9201806a4d455113867d2778c3262666a05b'])
          assert result.returncode in (0,1)
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert all(path.startswith('dist/') or path=='src/exporter/runtime-payload.js' for path in conflicts),conflicts
          if conflicts:subprocess.run(['git','checkout','--ours','--',*conflicts],check=True)
          PY
          npm run build
          git add -u
          git diff --cached --check
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Match independently tested complete source tree
        run: |
          cp .git/index "$RUNNER_TEMP/ocx-clean-index"
          GIT_INDEX_FILE="$RUNNER_TEMP/ocx-clean-index" git update-index --force-remove .github/workflows/ocx-finalize.yml
          tree=$(GIT_INDEX_FILE="$RUNNER_TEMP/ocx-clean-index" git write-tree)
          echo "Verified full tree: $tree"
          test "$tree" = '8770ce46bc27021de17d9518142b51a49ffc497c'
          rm "$RUNNER_TEMP/ocx-clean-index"
      - run: npm test
      - name: Commit integrated source without workflow permission changes
        run: |
          # The authorized connector restores the incoming workflow and removes
          # this temporary workflow after source verification. No stronger token.
          git restore --source=HEAD --staged --worktree .github/workflows
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'merge(ocx): preserve current visual fidelity and regenerate combined bundles'
          git bundle create ocx-final-publication.bundle HEAD
          git rev-parse HEAD HEAD^{tree} > ocx-final-publication.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ocx-final-publication
          path: |
            ocx-final-publication.bundle
            ocx-final-publication.txt
          retention-days: 7
      - run: git push origin HEAD:refs/heads/feat/ocx-hosting-lifecycle
