name: Compiler and runtime validation
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'tools/**', 'package.json', '.github/workflows/compiler-runtime.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'tools/**', 'package.json', '.github/workflows/compiler-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and Node regressions
        run: |
          set -o pipefail
          mkdir -p reports/compiler-runtime
          npm run build
          npm test 2>&1 | tee reports/compiler-runtime/node.log
      - name: Verify committed distributions are reproducible
        run: git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js
      - run: python -m pip install playwright Pillow
      - run: python -m playwright install --with-deps chromium
      - name: Select matched Chromium
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              executable=p.chromium.executable_path
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write(f'CHROMIUM_PATH={executable}\nCHROMIUM={executable}\n')
          PY
      - name: Real HTTP IDE, exported applications and diagnostic worker
        run: python tools/browser-compiler-runtime.py --http
      - name: Existing IDE, runtime, controls and debugger regressions
        run: |
          set -o pipefail
          for suite in browser-tests browser-parity-tests browser-features-04 recovery-browser-tests browser-finalization-05 browser-boundaries-06; do
            python tools/$suite.py 2>&1 | tee reports/compiler-runtime/$suite.log
          done
      - name: Existing visual and interaction checks
        run: python tools/browser-visual-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-runtime-${{ github.sha }}
          retention-days: 7
          path: |
            reports/compiler-runtime/
            reports/boundaries-06/
            reports/finalization-05/
            reports/visual/
            dist/
