name: Integrate reviewed input and debugger
on:
  push:
    branches: [fix/form-keyboard-mouse-input]
    paths: [.github/workflows/integrate-input-debugger.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/fix/form-keyboard-mouse-input'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate exact reviewed sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          def read(ref,path):return subprocess.check_output(['git','show',ref+':'+path],text=True)
          base='605fc10bcef483a52c9d50eddfd5ba5036eea04d';parent='28363a4f4f71afbc2a930d9d411f5b63d5a8b283';head=git('rev-parse','HEAD')
          assert git('rev-parse','HEAD^')==parent, 'Unexpected branch parent'
          assert git('ls-remote','origin','refs/heads/main').split()[0]==base, 'Main changed; review before merging'
          assert git('ls-remote','origin','refs/heads/fix/form-keyboard-mouse-input').split()[0]==head, 'Input branch changed'
          path='src/runtime/vm.js';source=read(base,path);input=read(parent,path)
          a=source.index('  setState(');b=source.index('\n',a);fa=input.index('  setState(');fb=input.index('\n',fa)
          source=source[:a]+input[fa:fb]+source[b:]
          a=input.index('  // Trusted host input');b=input.index('  dispatch(',a);at=source.index('  dispatch(')
          source=source[:at]+input[a:b]+source[at:]
          assert hashlib.sha256(source.encode()).hexdigest()=='e712ccea6e72d44cd62b0548499cb44998b81cde750f79dfa65a6a04a5dd27ab', 'Combined VM differs from 2177-test local review'
          merged=subprocess.run(['git','merge','--no-commit','--no-ff',base]);assert merged.returncode in (0,1)
          conflicts=git('diff','--name-only','--diff-filter=U').splitlines()
          for conflict in conflicts:
              if conflict==path:continue
              if conflict.startswith('dist/') or conflict=='src/exporter/runtime-payload.js':
                  subprocess.run(['git','checkout',base,'--',conflict],check=True)
                  subprocess.run(['git','add','--',conflict],check=True)
              else:raise RuntimeError('Unreviewed conflict: '+conflict)
          Path(path).write_text(source);subprocess.run(['git','add','--',path],check=True)
          assert not git('diff','--name-only','--diff-filter=U'), 'Unresolved source conflict'
          Path('.github/workflows/integrate-input-debugger.yml').unlink()
          Path('/tmp/input-debugger-reviewed-head').write_text(head)
          PY
          npm run build
          npm test
          git add -u
          git diff --cached --check -- src/runtime/vm.js src/controls/input.js tests/runtime-input*.test.mjs
          test "$(git ls-remote origin refs/heads/fix/form-keyboard-mouse-input | cut -f1)" = "$(cat /tmp/input-debugger-reviewed-head)"
          git commit -m 'fix(input): integrate debugger execution control and retain queued input guards'
          git push origin HEAD:refs/heads/fix/form-keyboard-mouse-input
