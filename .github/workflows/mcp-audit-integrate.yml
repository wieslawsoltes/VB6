name: Finalize verified MCP audit
on:
  push:
    branches: [feat/mcp-audit-classic-dialog]
    paths: ['.github/workflows/mcp-audit-integrate.yml']
permissions:
  contents: write
concurrency:
  group: mcp-audit-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify input tree and isolate default private ports
        run: |
          set -euo pipefail
          git rm --cached .github/workflows/mcp-audit-integrate.yml
          test "$(git write-tree)" = 'b0594fdc24609c668611981836316bcb08bf8662'
          git restore --staged --source=HEAD -- .github/workflows/mcp-audit-integrate.yml
          python - <<'PY'
          import base64, gzip, hashlib, pathlib
          p = pathlib.Path('src/mcp/server.js')
          s = p.read_text()
          for old,new in [("import {MCP_VERSION,", "import {randomToken, MCP_VERSION,"), ("{sessionKey = 'port', onError", "{sessionKey = 'port-' + randomToken(24), onError")]:
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)
          encoded = ''
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '138c4164709083bc7614120ce3ab25a613025b4165960b750c2137c0e87cd200'
          p = pathlib.Path('tests/mcp-port-isolation.test.mjs')
          assert not p.exists()
          p.write_bytes(data)
          PY
          npm run build
          npm test
          git add src/mcp/server.js tests/mcp-port-isolation.test.mjs dist
          git diff --cached --check
          git rm --cached .github/workflows/mcp-audit-integrate.yml
          test "$(git write-tree)" = '76cbb0065a5d4f9cd252171859ee95d2d952696b'
          git restore --staged --source=HEAD -- .github/workflows/mcp-audit-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(mcp): isolate default private-port sessions and retained task identities'
          npm run build
          git diff --exit-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Final real MCP and external-agent deployment workflows
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          npm run test:mcp:browser
          npm run test:mcp:agent
      - name: Publish without forcing or modifying workflow files
        run: git push origin HEAD:refs/heads/feat/mcp-audit-classic-dialog
      - name: Preserve source and reports
        if: always()
        run: git bundle create repository.bundle --all HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vb6-mcp-audit-final-${{ github.sha }}
          retention-days: 7
          path: |
            repository.bundle
            reports
