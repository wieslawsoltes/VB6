name: Validate scalar bitmap example correction
on:
  push:
    branches: [feat/variant-scalar-compatibility]
    paths: ['.github/workflows/scalar-example-fix.yml']
permissions:
  contents: read
jobs:
  fix:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/variant-scalar-compatibility'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the reviewed example and regression correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          git=lambda *a: subprocess.check_output(['git',*a],text=True).strip()
          assert git('diff','--name-only','3e2ed7618c9834c8f607aa50894e54dfb1adcb23','HEAD')=='.github/workflows/scalar-example-fix.yml'
          sample=Path('src/project/win32-example.js');tests=Path('tests/scalar-runtime.test.mjs')
          assert git('hash-object',str(sample))=='39627b368b38abdc6ea956599bee4731b6ec0d77'
          assert git('hash-object',str(tests))=='7af91243cc1426b963fb2c44fcd6de0da546dd0f'
          text=sample.read_text();assert text.count('pixels(1) = &HFF00\n')==1
          sample.write_text(text.replace('pixels(1) = &HFF00\n',"pixels(1) = &HFF00&  ' Positive Long; &HFF00 alone is Integer -256.\n"))
          tests.write_text(tests.read_text()+'''
          test('shipped Win32 bitmap sample uses positive Long green rather than signed Integer',async()=>{
           const {win32Example}=await import('../src/project/win32-example.js');
           const assignments=win32Example().modules[0].code.split('\\n').filter(line=>/^\\s*pixels\\(\\d\\)\\s*=/.test(line));
           assert.equal(assignments.length,4);
           const {output}=await run(main('Dim pixels(0 To 3) As Long\\n'+assignments.join('\\n')+'\\nDebug.Print pixels(0), pixels(1), pixels(2), pixels(3)'));
           assert.deepEqual(output,['16711680 65280 255 16777215']);
          });
          ''')
          assert git('hash-object',str(sample))=='04b573f085feb8df5dfcb942c8bd06b6bb31166d'
          assert git('hash-object',str(tests))=='11618ca15e6e2a2a8dca11e6f31f49ca0a5992f8'
          PY
      - name: Rebuild and validate all Node regressions
        run: |
          set -o pipefail
          npm run build
          npm test 2>&1 | tee "$RUNNER_TEMP/scalar-example-node.log"
          git add -- src/project/win32-example.js tests/scalar-runtime.test.mjs dist examples
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(examples): retain positive Long bitmap colors under native scalar literal semantics'
          npm run build
          git diff --exit-code -- dist examples
      - name: Verify the exact product tree without the one-use workflow
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/scalar-product-index"
          git read-tree HEAD
          git rm --cached -- .github/workflows/scalar-example-fix.yml
          test "$(git write-tree)" = ff6fa966ee8fdbfe52e8e24165e7b3a0dc530b33
      - name: Push only reviewed feature changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/scalar-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) printf '%s\n' "$GH_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/scalar-askpass"
          trap 'rm -f "$RUNNER_TEMP/scalar-askpass"' EXIT
          GIT_ASKPASS="$RUNNER_TEMP/scalar-askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/feat/variant-scalar-compatibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalar-example-node
          path: ${{ runner.temp }}/scalar-example-node.log
          retention-days: 14
