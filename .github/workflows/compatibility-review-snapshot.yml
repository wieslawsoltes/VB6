name: Compatibility review snapshot
on:
  push:
    branches: [feat/variant-scalar-compatibility]
    paths: ['.github/workflows/compatibility-review-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact source histories
        run: |
          mkdir -p review-snapshot
          git bundle create review-snapshot/repository.bundle HEAD --all
          git bundle verify review-snapshot/repository.bundle
          git show-ref > review-snapshot/refs.txt
          sha256sum review-snapshot/repository.bundle > review-snapshot/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-review-snapshot
          path: review-snapshot/
          retention-days: 7
