name: Recover debugger integration sources
on:
  push:
    branches: [feat/vb6-debugger-runtime]
    paths: ['.github/workflows/debugger-recover-local.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture pending edits and complete integration history
        run: |
          git bundle create /tmp/debugger-local.bundle --all
          git rev-parse HEAD origin/main > /tmp/debugger-local.refs
          cp .github/debugger-resume.b64 /tmp/debugger-local.b64
          cp .github/workflows/debugger-resume.yml /tmp/debugger-local.yml
      - uses: actions/upload-artifact@v4
        with:
          name: debugger-local-recovery
          path: /tmp/debugger-local.*
          retention-days: 3
