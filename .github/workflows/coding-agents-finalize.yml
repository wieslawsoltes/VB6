name: Coding agents final source snapshot
on:
  push:
    branches: [feat/coding-agents]
    paths: [.github/workflows/coding-agents-finalize.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture exact repository refs
        run: |
          git fetch origin main
          mkdir -p /tmp/coding-agents-final
          git rev-parse HEAD > /tmp/coding-agents-final/head.txt
          git rev-parse origin/main > /tmp/coding-agents-final/main.txt
          git bundle create /tmp/coding-agents-final/repository.bundle --all
          cd /tmp/coding-agents-final
          sha256sum repository.bundle > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coding-agents-final-source
          path: /tmp/coding-agents-final/
          retention-days: 3
