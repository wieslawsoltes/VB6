name: Win32 integration review
on:
  push:
    branches: [feature/win32-browser-compat]
    paths: [.github/workflows/win32-integration-review.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate exact reviewed upstream revision
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git merge --no-commit --no-ff 368fac5d9a9bad449fdcb5e49cc4cc1194ba88f0 || true
          python - <<'PY'
          import subprocess
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          for path in conflicts:
              if not (path.startswith('dist/') or path in ('src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js')):
                  raise SystemExit('Unreviewed source conflict: '+path)
          PY
      - name: Regenerate and validate combined source
        run: |
          npm run build
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples packages/win32-browser/dist
          test -z "$(git diff --name-only --diff-filter=U)"
          npm test
          npm run pack:win32-browser
      - name: Commit integration only to the feature branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feature/win32-browser-compat | cut -f1)" = "$EXPECTED_SHA"
          git commit -m 'fix(win32-browser): integrate AI agents and data updates with rebuilt bundles'
          git push origin HEAD:refs/heads/feature/win32-browser-compat
          git archive --format=zip HEAD -o /tmp/vb6-win32-integrated.zip
          git rev-parse HEAD HEAD^{tree} > /tmp/win32-integration-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: win32-integrated-validation
          path: |
            /tmp/vb6-win32-integrated.zip
            /tmp/win32-integration-revision.txt
            release/vb6-win32-browser-*.tgz
          retention-days: 7
