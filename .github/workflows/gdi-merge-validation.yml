name: GDI merge validation
on:
  push:
    branches: [feature/win32-gdi-boundaries]
    paths: [.github/workflows/gdi-merge-validation.yml]
permissions:
  contents: write
concurrency:
  group: gdi-final-integration
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve reviewed upstream source and reproduce the tested product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          test "$(git rev-parse f4ee8d47bed69ae26b65d20637b8f5f8da13d815^{tree})" = eb7c6a8647c6a3e8ca84afb7d73f3cc83b439fdf
          git merge --no-commit --no-ff f4ee8d47bed69ae26b65d20637b8f5f8da13d815 || test -f .git/MERGE_HEAD
          python3 - <<'PY'
          import subprocess
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          allowed=('src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js')
          if any(not (p.startswith('dist/') or p in allowed) for p in conflicts):
              raise SystemExit('Unreviewed source conflicts: '+repr(conflicts))
          PY
          npm run build
          node tools/win32-api-inventory.mjs
          rm .github/workflows/gdi-merge-validation.yml
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(git write-tree)" = bece3b7af2069285e71699885a0272d7242caeb7
          npm test | tee /tmp/gdi-merge-tests.txt
          npm run pack:win32-browser | tee /tmp/gdi-merge-package-tests.txt
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          path=Path('release/vb6-win32-browser-0.4.0.tgz')
          actual=hashlib.sha256(path.read_bytes()).hexdigest()
          assert actual=='e0b85f665c3b6b00dfbc5902e2120f929810cd960a9bad8d0efe4c53b00b751b',actual
          print(actual,path)
          PY
          git diff --exit-code
          git diff --cached --check f4ee8d47bed69ae26b65d20637b8f5f8da13d815
          git commit -m 'fix(win32-browser): preserve current agent and provider features in verified GDI integration'
          git archive --format=zip HEAD -o /tmp/vb6-gdi-merge-source.zip
          git bundle create /tmp/vb6-gdi-merge.bundle HEAD refs/remotes/origin/main
          git rev-parse HEAD HEAD^{tree} > /tmp/gdi-merge-revision.txt
      - name: Publish exact tested feature source with branch lease
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/win32-gdi-boundaries | cut -f1)" = "$EXPECTED_SHA"
          git push origin HEAD:refs/heads/feature/win32-gdi-boundaries
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdi-merge-validation
          path: |
            /tmp/vb6-gdi-merge-source.zip
            /tmp/vb6-gdi-merge.bundle
            /tmp/gdi-merge-revision.txt
            /tmp/gdi-merge-tests.txt
            /tmp/gdi-merge-package-tests.txt
            release/vb6-win32-browser-*.tgz
          retention-days: 7
