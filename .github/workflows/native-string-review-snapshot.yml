name: Native string interop baseline snapshot
on:
  push:
    branches: [feat/native-declare-strings]
    paths: [.github/workflows/native-string-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git bundle create /tmp/native-string-baseline.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: native-string-baseline
          path: /tmp/native-string-baseline.bundle
          retention-days: 2
