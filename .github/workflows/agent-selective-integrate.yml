name: Integrate selective review with current main
on:
  push:
    branches: [feat/agent-selective-review]
    paths: [.github/workflows/agent-selective-integrate.yml]
permissions:
  contents: write
concurrency:
  group: agent-selective-integration
  cancel-in-progress: true
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/agent-selective-review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify recovered source and integrate account support
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 630c14d9b6e21131dc8a395b978d36643e64d914
          test "$(git rev-parse 'HEAD^^{tree}')" = df06e98e6ed8b0a298d4e1668688250a613e270f
          test "$(git rev-parse '2ee166a43145432538de88bb36c575c08e70ec84^{tree}')" = 420aa0b0a6ca1bc48392d086838ed2ca3f7935db
          git rev-parse HEAD > publication-base.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          def source(ref, path):
              return subprocess.check_output(['git','show',ref+':'+path],text=True)
          path = 'src/agents/studio.js'
          old = source('5ad8ea7815877347230dda6e5254ada4181aa61c', path)
          needle = 'this.threadView.dispose(); }'
          replacement = 'this.threadView.dispose(); this.workbench.dispose(); }'
          assert old.count(needle) == 1
          assert source('HEAD', path) == old.replace(needle, replacement)
          result = subprocess.run(['git','merge','--no-commit','--no-ff','2ee166a43145432538de88bb36c575c08e70ec84'])
          if result.returncode:
              conflicts = set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
              generated = {'dist/VB6-Studio-Web.html','dist/studio.js'}
              assert result.returncode == 1 and conflicts and conflicts <= generated | {path}, sorted(conflicts)
              for p in sorted(conflicts & generated):
                  subprocess.run(['git','checkout','--ours','--',p],check=True)
                  subprocess.run(['git','add','--',p],check=True)
              if path in conflicts:
                  # Preserve all new authentication/queue logic and both disposals.
                  current = source('2ee166a43145432538de88bb36c575c08e70ec84',path)
                  assert current.count(needle) == 1 and 'this.chatgpt?.dispose();' in current
                  Path(path).write_text(current.replace(needle,replacement))
                  subprocess.run(['git','add','--',path],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).strip()
          PY
      - name: Rebuild from combined source
        shell: bash
        run: npm run build | tee selective-build.log
      - name: Full integrated repository suite
        shell: bash
        run: npm test | tee selective-full-tests.log
      - name: Focused agent and authentication suites
        shell: bash
        run: |
          npm run test:agents | tee selective-agent-tests.log
          node --test tests/chatgpt-*.test.mjs | tee selective-account-tests.log
      - name: Remove temporary integration and verify feature scope
        shell: bash
        run: |
          git add -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git rm -- .github/workflows/agent-selective-integrate.yml
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          paths = set(subprocess.check_output(['git','diff','--cached','--name-only','2ee166a43145432538de88bb36c575c08e70ec84'],text=True).splitlines())
          allowed = {'README.md','docs/CODING-AGENT-WORKBENCH.md','src/agents/changes.js','src/agents/followups.js','src/agents/review-hunks.js','src/agents/studio.js','src/agents/workbench-view.js','tests/coding-agents-compaction.test.mjs','tests/coding-agents-hunks.test.mjs','tools/coding-agents-browser-tests.py','dist/studio.js','dist/VB6-Studio-Web.html'}
          assert paths == allowed, sorted(paths ^ allowed)
          print('\n'.join(sorted(paths)))
          PY
          git commit -m 'build(agents): preserve account support and regenerate selective-review bundles'
      - name: Publish tested feature branch
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/feat/agent-selective-review | cut -f1)" = "$(cat publication-base.txt)"
          git push origin HEAD:feat/agent-selective-review
          git rev-parse HEAD > head.txt
          git rev-parse HEAD^{tree} > tree.txt
          git ls-files -z | xargs -0 sha256sum > tracked-SHA256SUMS.txt
          git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-review-integrated-validation
          path: |
            selective-build.log
            selective-full-tests.log
            selective-agent-tests.log
            selective-account-tests.log
            publication-base.txt
            head.txt
            tree.txt
            tracked-SHA256SUMS.txt
            source.tar.gz
          retention-days: 7
