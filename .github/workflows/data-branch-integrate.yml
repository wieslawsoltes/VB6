name: Reviewed data branch integration
on:
  push:
    branches: [feat/data-rdo-gateway-compat]
    paths: [.github/workflows/data-branch-integrate.yml]
permissions:
  contents: write
concurrency:
  group: reviewed-data-branch-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/data-rdo-gateway-compat'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge reviewed main snapshot and resolve only reviewed conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge --no-commit 16c8ef706c525de141e1d5d547b3cf14b45beeea || test -f .git/MERGE_HEAD
          python - <<'PY'
          import pathlib, subprocess
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          for name in conflicts:
              if name=='src/runtime/vm.js':
                  p=pathlib.Path(name);s=p.read_text()
                  start=s.index('<<<<<<< HEAD\n');end=s.index('\n>>>>>>> ',start);end=s.index('\n',end+1)+1
                  ours="      const publicKey=candidates.find(k=>/^[A-Z]/.test(k)||isRecord||key==='hwnd'&&object.__control||hasDataMember(object,k));if(publicKey)return publicKey;"
                  theirs="      const publicKey=candidates.find(k=>/^[A-Z]/.test(k)||isRecord||['hwnd','hdc'].includes(key)&&object.__control);if(publicKey)return publicKey;"
                  block=s[start:end]
                  assert block.startswith('<<<<<<< HEAD\n'+ours+'\n=======\n'+theirs+'\n>>>>>>> '), 'Unexpected VM conflict'
                  p.write_text(s[:start]+"      const publicKey=candidates.find(k=>/^[A-Z]/.test(k)||isRecord||['hwnd','hdc'].includes(key)&&object.__control||hasDataMember(object,k));if(publicKey)return publicKey;\n"+s[end:])
              elif name.startswith('dist/') or name=='src/exporter/runtime-payload.js':
                  subprocess.run(['git','checkout','--theirs','--',name],check=True)
              else:
                  raise RuntimeError('Unreviewed source conflict: '+name)
              subprocess.run(['git','add','--',name],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).strip()
          PY
      - name: Rebuild every generated distribution from combined source
        run: npm run build
      - name: Validate complete combined source
        run: npm test
      - name: Commit and push without rewriting branch history
        shell: bash
        run: |
          set -euo pipefail
          git add dist src/exporter/runtime-payload.js
          git diff --check --cached
          git commit -m 'Merge reviewed main into RDO compatibility; preserve hDC and rebuild distributions'
          test "$(git ls-remote origin refs/heads/feat/data-rdo-gateway-compat | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/feat/data-rdo-gateway-compat
