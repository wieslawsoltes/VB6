name: Text code-page reference
on:
  push:
    branches: [feat/runtime-text-compatibility]
    paths: ['.github/workflows/text-codepage-reference.yml','tools/conformance/export-text-nls.ps1','tools/conformance/text-edge-reference.ps1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-reference:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture strict installed-Windows code-page mappings
        shell: powershell
        run: tools/conformance/export-codepages.ps1 -Output reports/text-codepages/windows-codepages.bin
      - name: Capture best-fit encodings and explicit-LCID case, width and kana mappings
        shell: powershell
        run: tools/conformance/export-text-nls.ps1 -Output reports/text-codepages/windows-text-nls.json
      - name: Capture malformed input, supplementary characters and combined transformations
        shell: powershell
        run: tools/conformance/text-edge-reference.ps1 -Output reports/text-codepages/windows-text-edges.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-codepage-reference
          path: reports/text-codepages/
          if-no-files-found: error
          retention-days: 14
