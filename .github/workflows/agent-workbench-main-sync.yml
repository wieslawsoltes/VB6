name: Preserve current main in agent workbench
on:
  push:
    branches: [feat/agent-change-review-queue]
    paths: [.github/workflows/agent-workbench-main-sync.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/agent-change-review-queue'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable heads and merge current main
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 0151ff30ddee9e4462d191e956122716b7db678f
          test "$(git rev-parse HEAD^^{tree})" = 1707f42846757011516db9135f7b19296ad5f472
          test "$(git rev-parse e7cfde0a219569f4ab5bd5abadb2d337b6722efb^{tree})" = bb1d8f39ce2e846f8aacf7782d353175ddf56f6d
          git rev-parse HEAD > publication-base.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import subprocess
          result=subprocess.run(['git','merge','--no-commit','--no-ff','e7cfde0a219569f4ab5bd5abadb2d337b6722efb'])
          conflicts=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          assert result.returncode in (0,1) and conflicts <= {'desktop/smoke.cjs','dist/studio.js','dist/VB6-Studio-Web.html'}, sorted(conflicts)
          if conflicts:
              subprocess.run(['git','checkout','--ours','--',*sorted(conflicts)],check=True)
          PY
      - name: Preserve both independently reviewed native smoke extensions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,hashlib
          show=lambda ref:subprocess.check_output(['git','show',ref+':desktop/smoke.cjs'],text=True)
          old="""      await js('vb6Studio.run()');
                await previewFrame('vb6Studio.runtimeFrame');
                check('IDE preview runs under document-specific CSP', true);
                await js('vb6Studio.stop()');"""
          new="""      report.previewNavigations=[];
                const navigated=(event,url)=>report.previewNavigations.push(typeof url==='string'?url:event.url);
                root.webContents.on('did-start-navigation',navigated);
                try {
                  const urls=new Set();
                  for(let pass=1;pass<=2;pass++) {
                    await js('vb6Studio.run()');
                    const frame=await previewFrame('vb6Studio.runtimeFrame');
                    check('IDE preview '+pass+' runs under document-specific CSP',true);
                    check('native preview '+pass+' uses a fresh host document',!urls.has(frame.url));urls.add(frame.url);
                    check('IDE preview '+pass+' rejects arbitrary inline scripts',await frame.executeJavaScript(`(async()=>{
                      const script=document.createElement('script');script.textContent='globalThis.untrustedPreviewScript=true';document.body.append(script);
                      await new Promise(resolve=>setTimeout(resolve,25));return !globalThis.untrustedPreviewScript;
                    })()`));
                    await js('vb6Studio.stop()');
                  }
                  check('desktop preview never starts or commits srcdoc',!report.previewNavigations.includes('about:srcdoc'));
                } finally { root.webContents.removeListener('did-start-navigation',navigated); }"""
          diagnostics="""    try {
                report.frames=root.webContents.mainFrame.framesInSubtree.map(f=>({url:f.url,detached:f.detached,id:f.frameTreeNodeId}));
                if(manifest.kind==='studio') report.preview=await js(`(()=>{const s=vb6Studio,f=s.runtimeFrame;return {runState:s.runState,frame:f&&{src:f.src,srcdoc:f.hasAttribute('srcdoc'),connected:f.isConnected},diagnostics:s.diagnostics};})()`);
              } catch (diagnosticError) { report.diagnosticError=diagnosticError.message; }
          """
          marker='    report.error = error.stack || error.message;'
          base=show('2a45fce5f25b5f9e214acb82384119d00d7510cc')
          main=show('e7cfde0a219569f4ab5bd5abadb2d337b6722efb')
          assert base.count(old)==1 and base.count(marker)==1
          assert base.replace(old,new).replace(marker,diagnostics+marker)==main, 'Unexpected native smoke source changes'
          ours=show('0151ff30ddee9e4462d191e956122716b7db678f')
          assert hashlib.sha256(ours.encode()).hexdigest()=='987dc455c3f23fcc5529f262199cd94f9850679915207823aaeb07a9e0ef639d'
          assert ours.count(old)==1 and ours.count(marker)==1
          combined=ours.replace(old,new.replace('frame.executeJavaScript(', 'evaluate(frame, ')).replace(marker,diagnostics+marker)
          combined=combined.replace('name: frame.name, detached: frame.detached', 'name: frame.name, detached: frame.detached, id: frame.frameTreeNodeId')
          assert hashlib.sha256(combined.encode()).hexdigest()=='9f2425d9ff80e49488d81900eb1f33bbe4fe4aef814007b409fda54d933a7a0d'
          Path('desktop/smoke.cjs').write_text(combined)
          subprocess.run(['git','add','--','desktop/smoke.cjs'],check=True)
          PY
      - name: Build and test the complete combined source
        shell: bash
        run: |
          npm run build | tee workbench-build.log
          node --check desktop/smoke.cjs
          node --test tests/native-smoke-harness.test.mjs tests/runtime-document.test.mjs tests/native-preview.test.mjs | tee workbench-native-contracts.log
          npm run test:agents | tee workbench-agent-tests.log
          npm test | tee workbench-full-tests.log
      - name: Remove one-use helper and verify the product diff
        shell: bash
        run: |
          git add -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples packages/win32-browser/dist
          git rm -- .github/workflows/agent-workbench-main-sync.yml
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          allowed={'README.md','desktop/smoke.cjs','dist/VB6-Studio-Web.html','dist/studio.css','dist/studio.js','docs/CODING-AGENT-WORKBENCH.md','docs/coding-agents.md','src/agents/agent.js','src/agents/agents.css','src/agents/changes.js','src/agents/conversations.js','src/agents/followups.js','src/agents/studio.js','src/agents/workbench-view.js','tests/coding-agents-workbench.test.mjs','tests/native-smoke-harness.test.mjs','tools/coding-agents-browser-tests.py'}
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only','e7cfde0a219569f4ab5bd5abadb2d337b6722efb'],text=True).splitlines())
          assert paths==allowed, sorted(paths ^ allowed)
          print('\n'.join(sorted(paths)))
          PY
          git commit -m 'build(agents): preserve native String main and all preview safety checks'
      - name: Publish tested branch and reproducible source evidence
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/feat/agent-change-review-queue | cut -f1)" = "$(cat publication-base.txt)"
          git push origin HEAD:feat/agent-change-review-queue
          git rev-parse HEAD > head.txt
          git rev-parse HEAD^{tree} > tree.txt
          git ls-files -z | xargs -0 sha256sum > tracked-SHA256SUMS.txt
          git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-workbench-main-sync-validation
          path: |
            workbench-build.log
            workbench-native-contracts.log
            workbench-agent-tests.log
            workbench-full-tests.log
            publication-base.txt
            head.txt
            tree.txt
            tracked-SHA256SUMS.txt
            source.tar.gz
          retention-days: 7
