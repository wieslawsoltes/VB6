name: Rendering failure audit
on:
  push:
    branches: [diag/rendering-readiness]
    paths: [.github/workflows/rendering-failure-audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect failed job diagnostics for the exact baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,concurrent.futures,re
          from pathlib import Path
          base='https://api.github.com/repos/wieslawsoltes/VB6'
          runs=[37381232953,37381232889,37381232985,37381232875,37381233020,37381232923,37381232816,37381232989,37381233237,37381233064,37381233022]
          out=Path('reports/readiness-failures');out.mkdir(parents=True,exist_ok=True)
          def get(url):
              req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json'})
              req.add_unredirected_header('Authorization','Bearer '+os.environ['GH_TOKEN'])
              return urllib.request.urlopen(req,timeout=60).read()
          def scan(run):
              result=[]
              try:
                  for job in json.loads(get(base+'/actions/runs/'+str(run)+'/jobs?per_page=100'))['jobs']:
                      if job['conclusion']!='failure':continue
                      text=get(base+'/actions/jobs/'+str(job['id'])+'/logs').decode('utf-8-sig',errors='replace')
                      (out/(str(job['id'])+'.log')).write_text(text)
                      lines=text.splitlines();hits=[]
                      for i,line in enumerate(lines):
                          if re.search(r'(?:FAIL:|FAIL |FAILED|AssertionError|Error:|Traceback|##\[error\]|not ok |\bFAIL\b)',line):hits.extend(lines[max(0,i-1):min(len(lines),i+5)])
                      result.append({'run':run,'job':job['name'],'id':job['id'],'failedSteps':[s['name'] for s in job['steps'] if s['conclusion']=='failure'],'errors':list(dict.fromkeys(hits))[-200:]})
              except Exception as error:result.append({'run':run,'collectionError':str(error)})
              return result
          data=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for r in pool.map(scan,runs):data.extend(r)
          (out/'summary.json').write_text(json.dumps(data,indent=2))
          assert not any('collectionError' in x for x in data), 'Inspect collection errors in artifact'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-failures
          path: reports/readiness-failures
          retention-days: 7
