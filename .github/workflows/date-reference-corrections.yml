name: Apply reviewed Date reference corrections
on:
  push:
    branches: [feat/win32-date-export]
    paths: [.github/workflows/date-reference-corrections.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/win32-date-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checked corrections rather than weakening the Windows reference
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def edit(name,before,after,old,new):
              p=Path(name);s=p.read_text()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==before, name
              assert s.count(old)==1,name
              s=s.replace(old,new)
              assert hashlib.sha256(s.encode()).hexdigest()==after,name
              p.write_text(s)
          edit('src/native/dates.js','6a7abb76e8b0e7c2c57e2b94f9708343b31a0c750fe501cc61e15e23f04ec459','52981673fb7f807d0cc85a5133d8940909a845ccf302e196e00fbb6e6123b9e1',
               "      if(type==='string')this.expression(args[0]);else this.floatExpression(args[0]);\n      x.push().call(D+(type==='string'?'is-string':'is-number'));return true;",
               "      // IsDate inspects Date values or parseable strings, not every number that\n      // CDate could convert. Still evaluate non-Date arguments exactly once.\n      this.expression(args[0]);\n      if(type==='string'||type==='date')x.push().call(D+(type==='string'?'is-string':'is-number'));\n      else if(numbers.has(type))x.value(0);\n      else this.fail('IsDate requires a supported scalar expression');\n      return true;")
          edit('tools/win32-date-fixtures.mjs','ec38a440a5f1777e7a15c5fd873083fcc2a21493b592bd3e02f4191c35585582','15ccb7b4aa779180f4bc2cf47162eb13cac1db9cfa8699a5c2575f62c4942c28',
               "check('IsDate(-657434) And IsDate(2958465.75) And Not IsDate(-657435) And Not IsDate(2958466)','IsDate tests actual date bounds');",
               "check('IsDate(CDate(-657434)) And IsDate(CDate(2958465.75)) And Not IsDate(-657435) And Not IsDate(2958466)','IsDate recognizes typed Dates but does not coerce numeric inputs');\n  check('Not IsDate(True) And Not IsDate(False) And Not IsDate(1) And Not IsDate(1@) And Not IsDate(CDbl(1))','IsDate rejects Boolean and numeric types independently of value');")
          edit('tools/win32-date-reference.mjs','de61f3a67fbdc7e883fd5555a9f85aa87406f90478cf994aabcef42974b27200','6465b965799aeac2cbc2c13ee70e1d6170ed6cd621904eb39951ded096efcb3f',
               " ['Leap normalization','CLng(CDbl(DateSerial(1900,2,29)))'],['Negative month normalization','CLng(CDbl(DateSerial(2024,-12,1)))']",
               " ['Leap normalization','CLng(CDbl(DateSerial(1900,2,29)))'],['Negative month normalization','CLng(CDbl(DateSerial(2024,-12,1)))'],\n // Probe boundary normalization separately from the 4,800 ordinary dates. The\n // results stay independent input data; no native result is treated as its oracle.\n ...[-1,0,29,30,99,100,101,9999,10000].flatMap(y=>[-13,0,1,13].flatMap(m=>[-31,0,1,32].map(d=>[\n   `DateSerial boundary (${y},${m},${d})`, `CLng(CDbl(DateSerial(${y},${m},${d})))`\n ])))")
          p=Path('tests/win32-date.test.mjs');s=p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='2a0da5f0f3cfbbdb11e1ae9d45dea2c4b466a0058fcb50b6a07bd5fa6b4913db'
          s=s.rstrip()+"\n\ntest('IsDate evaluates non-Date scalar arguments once without numeric date coercion',()=>{\n for(const type of ['boolean','long','double','single','currency']){\n  const seen=[],x={value:n=>seen.push(n)};\n  const c={x,type:()=>type,expression:n=>seen.push(n),variable:()=>null,resolveProcedure:()=>null,fail:compiler.fail};\n  const input={kind:'id',name:'value'},call={kind:'call',callee:{kind:'id',name:'IsDate'},args:[input]};\n  assert.equal(nativeDateMethods.dateBuiltin.call(c,call,'isdate'),true);\n  assert.deepEqual(seen,[input,0]);\n }\n});\n"
          assert hashlib.sha256(s.encode()).hexdigest()=='9d15bd42ea23f3d2286567fa6bea735bf30cd9e2bddf68e3dfe598c9ba7324c0'
          p.write_text(s)
          PY
          npm run build
          npm test
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add src/native/dates.js tools/win32-date-fixtures.mjs tools/win32-date-reference.mjs tests/win32-date.test.mjs dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git diff --cached --check
          git commit -m 'fix(native): distinguish IsDate inspection from CDate conversion' -m 'The independent Windows runtime reference exposed incorrect acceptance of Boolean/numeric types by IsDate. Preserve argument evaluation but return False for non-Date/non-string values. Retain Date range coverage using explicit conversions and extend boundary probes to 177 fixed reference cases. Rebuild all shared bundles and pass the complete unit suite before Windows validation.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/feat/win32-date-export
