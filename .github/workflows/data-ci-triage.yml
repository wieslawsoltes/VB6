name: Data validation diagnostics
on:
  push:
    branches: [feat/data-rdo-gateway-compat]
    paths: [.github/workflows/data-ci-triage.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture precise failure without replaying the full test log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const id=111876225044;
          const response=await fetch(`https://api.github.com/repos/wieslawsoltes/VB6/actions/jobs/${id}/logs`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'},redirect:'manual'});
          let data=response;
          if(response.status===302){
            const location=new URL(response.headers.get('location'));
            if(location.protocol!=='https:')throw new Error('Unexpected log redirect');
            data=await fetch(location);
          }
          if(!data.ok)throw new Error(`Log download failed: ${data.status}`);
          const lines=(await data.text()).split('\n');
          const keep=new Set();
          for(let i=0;i<lines.length;i++)if(/not ok|error:|failureType:|ERR_ASSERTION|##\[error\]/.test(lines[i]))for(let j=Math.max(0,i-3);j<Math.min(lines.length,i+32);j++)keep.add(j);
          for(let i=Math.max(0,lines.length-25);i<lines.length;i++)keep.add(i);
          const summary=[...keep].sort((a,b)=>a-b).map(i=>`${i+1}: ${lines[i]}`).join('\n');
          writeFileSync('reports/validate-failure.txt',summary);
          console.log(summary.slice(0,24000));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-validation-diagnostics
          path: reports
          retention-days: 7
