name: Debugger review snapshot
on:
  push:
    branches: [feat/debugger-compatibility-boundaries]
    paths: ['.github/workflows/debugger-review-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git bundle create /tmp/debugger-review.bundle --all
          git rev-parse HEAD origin/main > /tmp/debugger-review.refs
          git log -20 --oneline origin/main > /tmp/debugger-review.history
      - uses: actions/upload-artifact@v4
        with:
          name: debugger-review
          path: /tmp/debugger-review.*
          retention-days: 3
