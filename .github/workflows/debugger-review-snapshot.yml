name: Debugger review snapshot
on:
  push:
    branches: [feat/vb6-debugger-runtime]
    paths: ['.github/workflows/debugger-review-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture repository history for integration review
        run: |
          git bundle create /tmp/debugger-review.bundle --all
          git rev-parse HEAD origin/main > /tmp/debugger-review-refs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: debugger-review-sources
          path: /tmp/debugger-review*
          retention-days: 3
