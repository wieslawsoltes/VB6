name: Apply reviewed native regression fixture corrections
on:
  push:
    branches: [feat/native-compatibility-boundaries]
    paths: [.github/workflows/native-regression-fixture-correction.yml]
permissions:
  contents: write
concurrency:
  group: native-regression-fixture-correction
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only fingerprint-checked fixture updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def edit(path,before,after,old,new):
              p=Path(path);s=p.read_text()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==before,'Changed preimage: '+path
              if old is None:s+=new
              else:
                  assert s.count(old)==1,'Unexpected replacement count: '+path
                  s=s.replace(old,new)
              assert hashlib.sha256(s.encode()).hexdigest()==after,'Changed result: '+path
              p.write_text(s)
          edit('tools/win32-numeric-fixtures.mjs','5780bfab15e24c2d22598b9aa01c5b67ece958214ee53cbb9adff59686cdcb8c','8a515295f19c71ec9f8731127d80b68e249bbb204f91c50bc00ec0a6f4373994',
              '    ReDim values(200000)\n    If Err.Number <> 7 Then ExitProcess 60\n    Err.Clear',
              "    ' The old one-MiB quota is gone; 200001 Doubles must now fit.\n    ReDim values(200000)\n    If Err.Number <> 0 Or UBound(values) <> 200000 Then ExitProcess 63\n    values(200000) = 1.25\n    ' This count requires 2147483648 bytes: reject before attempting allocation.\n    ReDim Preserve values(268435455)\n    If Err.Number <> 7 Then ExitProcess 60\n    Err.Clear\n    If UBound(values) <> 200000 Or values(200000) <> 1.25 Then ExitProcess 64")
          edit('tools/test-win32-numeric.ps1','cf83aeeec73d18b0e21c21ae202889ddb7cd7f4dc56fe1f5afa2d820b771ed02','b8977cc4873d6c65b5d62f8d2e43d6565d561a2ac83d632b995d56eadd9bd517',
              '62 native floating/ABI/array/error assertions','64 native floating/ABI/array/error assertions')
          edit('tools/browser-data-sources.py','abe482fedaa7e3266e0d1326b95c639dc474f5b4bff466f30a94381642cd1948','5d5864ea8ed279c96811e860d9d3e7212297ef25052bb2b6830256c6b6e01d3e',
              '''            button(p,'cmdNew').click();ready(p,3);check(p.locator('[data-control="txtName"] input').input_value()=='New customer')''',
              '''            button(p,'cmdNew').click();ready(p,3)
                      # RecordCount changes before the queued control repaint. Assert the
                      # actual visible value with polling, not a snapshot of the old frame.
                      expect(p.locator('[data-control="txtName"] input')).to_have_value('New customer')'''.replace('\n                      ','\n            '))
          edit('tests/win32-large-arrays.test.mjs','3357107bcf8558b125300f9a45e2a26ec910ab7db8b675ed9b87f66b6ccf9972','654767e17243bc237b95ddbb5938646787c358940ab0babfdf9376c66aaa0ac4',None,
              r'''
          test('numeric execution fixture covers both removed quota and atomic x86-width rejection', async()=>{
           const {numericFixture}=await import('../tools/win32-numeric-fixtures.mjs');
           const project=numericFixture(), code=project.modules[0].code;
           assert.match(code,/ReDim values\(200000\)\s+If Err\.Number <> 0 Or UBound\(values\) <> 200000 Then ExitProcess 63/);
           assert.match(code,/ReDim Preserve values\(268435455\)\s+If Err\.Number <> 7 Then ExitProcess 60/);
           assert.match(code,/If UBound\(values\) <> 200000 Or values\(200000\) <> 1\.25 Then ExitProcess 64/);
           assert.ok(compileWin32(project).bytes.length);
          });
          ''')
          print('All four reviewed fixture postimages verified')
          PY
      - run: npm run build && npm test
      - run: node tools/win32-numeric-fixtures.mjs
      - name: Publish fixture corrections without changing production code or weakening checks
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add tests/win32-large-arrays.test.mjs tools/win32-numeric-fixtures.mjs tools/test-win32-numeric.ps1 tools/browser-data-sources.py
          git diff --cached --check
          git commit -m 'test: align array overflow fixture with raised limit and await SQLite control rendering' -m 'The old 200001-Double request now correctly succeeds. Retain error-7 coverage beyond checked x86 width and add success/failed-Preserve atomicity assertions. Preserve exact SQLite visible text expectation while waiting for its asynchronous paint. No assertion removed or production guard relaxed.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/feat/native-compatibility-boundaries
