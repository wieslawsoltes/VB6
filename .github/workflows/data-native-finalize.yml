name: Final native data integration
on:
  push:
    branches: [feat/data-native-provider-validation]
    paths: [.github/workflows/data-native-finalize.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/data-native-provider-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed exact Decimal and UInt64 ordering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-final-result
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          p=Path('src/data/recordset.js');s=p.read_text()
          old="if(a instanceof VBCurrency&&b instanceof VBCurrency)return a.raw<b.raw?-1:a.raw>b.raw?1:0;"
          new="if(a instanceof VBDecimal||b instanceof VBDecimal)return coerce(a,'Decimal').compare(coerce(b,'Decimal'));"+old
          assert s.count(old)==1 and new not in s
          p.write_text(s.replace(old,new))
          PY
      - name: Regenerate and test complete integrated source
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm test > /tmp/native-final-result/node-tests.log 2>&1
          tail -15 /tmp/native-final-result/node-tests.log
      - name: Publish reviewed fix without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git add src/data/recordset.js dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git diff --exit-code HEAD -- .github/workflows
          git diff --check --cached
          git commit -m 'fix(data): sort native unsigned 64-bit and Decimal fields without precision loss'
          test "$(git ls-remote origin refs/heads/feat/data-native-provider-validation | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/feat/data-native-provider-validation
      - name: Preserve exact source and results
        if: always()
        run: |
          mkdir -p /tmp/native-final-result
          git rev-parse HEAD > /tmp/native-final-result/head.txt
          git bundle create /tmp/native-final-result/repository.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-final-result
          path: /tmp/native-final-result
          retention-days: 7
