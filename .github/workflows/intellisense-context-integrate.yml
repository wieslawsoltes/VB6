name: Integrate reviewed IntelliSense declaration context
on:
  push:
    branches: [feature/intellisense-qualified-arrays]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feature/intellisense-qualified-arrays'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed source changes
        run: |
          python tools/apply-intellisense-context.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/apply-intellisense-context.py
          git add src/editor docs tools/browser-intellisense-compatibility.py
          git commit -m 'fix(intellisense): preserve declaration types, literal defaults and inline array scope'
      - name: Integrate current main without discarding handwritten changes
        run: |
          mkdir -p reports/intellisense-context
          git fetch origin 29c77082c9bf854c7f6fbbf3ed63d5277036b761
          if ! git merge --no-commit --no-ff 29c77082c9bf854c7f6fbbf3ed63d5277036b761; then
            conflicts=$(git diff --name-only --diff-filter=U)
            test -n "$conflicts" || exit 1
            while IFS= read -r path; do
              case "$path" in
                dist/*|src/exporter/runtime-payload.js|src/editor/diagnostics-payload.js) git checkout --ours -- "$path"; git add "$path" ;;
                *) git diff -- "$path" >> reports/intellisense-context/conflicts.diff ;;
              esac
            done <<< "$conflicts"
            test -z "$(git diff --name-only --diff-filter=U)" || exit 1
          fi
      - name: Rebuild and validate exact combined source
        run: |
          npm run build
          git diff --check
          set -o pipefail
          npm test 2>&1 | tee reports/intellisense-context/node.log
          git add -u
          test -z "$(git diff --cached --name-only -- .github/workflows)" || exit 1
          git commit -m 'merge: integrate current Win32 GDI and regenerate IntelliSense distributions'
          git push origin HEAD:feature/intellisense-qualified-arrays
      - name: Reproducible source snapshot
        if: always()
        run: |
          git archive --format=zip --output=intellisense-source.zip HEAD
          git rev-parse HEAD HEAD^{tree} > reports/intellisense-context/revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intellisense-context-source
          path: |
            intellisense-source.zip
            reports/intellisense-context/
          retention-days: 7
