name: Refresh verified Linux runtimes
on:
  workflow_dispatch:
  push:
    branches: ["maint/linux-runtime-*"]
permissions:
  contents: read
concurrency:
  group: linux-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && startsWith(github.ref, 'refs/heads/maint/linux-runtime-')
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      RUNTIME_DIRECTORY: ${{ matrix.architecture == 'arm64' && 'artifacts/linux-aot/runtime-arm64' || 'artifacts/linux-aot/runtime' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive exact SDK source before compilation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linux-runtime-source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/linux-runtime-source/source.tar.gz" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/linux-runtime-source/revision.txt"
          (cd "$RUNNER_TEMP/linux-runtime-source" && sha256sum source.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-source-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/linux-runtime-source
          retention-days: 14
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the matching native Linux runner
        run: node --input-type=module -e 'import assert from "node:assert/strict"; assert.equal(process.platform,"linux"); assert.equal(process.arch,process.env.ARCHITECTURE);'
      - name: Install native SDK and headless GTK display
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++ pkg-config libgtk-3-dev libcups2-dev xvfb xauth
      - name: Rebuild and qualify the exact native runtime
        run: node tools/test-linux-aot.mjs --architecture "$ARCHITECTURE" --rebuild --report reports/linux-aot/rebuilt
      - name: Execute emitted Pascal programs against the rebuilt runtime
        run: node tools/test-pascal-native.mjs --runtime "$RUNTIME_DIRECTORY"
      - name: Require native hardware, full acceptance and exact-runtime Pascal proof
        run: node tools/verify-linux-runtime-refresh.mjs "$RUNTIME_DIRECTORY" reports/linux-aot/rebuilt/validation.json "reports/pascal-native/linux-$ARCHITECTURE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-linux-runtime-${{ matrix.architecture }}
          path: |
            ${{ env.RUNTIME_DIRECTORY }}
            reports/linux-aot/rebuilt
            reports/pascal-native
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: verified-linux-runtime-x64
          path: native-input/x64
      - uses: actions/download-artifact@v4
        with:
          name: verified-linux-runtime-arm64
          path: native-input/arm64
      - name: Verify both native proofs and create offline payloads
        shell: bash
        run: |
          set -euo pipefail
          for architecture in x64 arm64; do
            input="native-input/$architecture"
            runtime="$input/artifacts/linux-aot/runtime"
            if [ "$architecture" = arm64 ]; then runtime="$runtime-arm64"; fi
            proof="$input/reports/linux-aot/rebuilt/validation.json"
            pascal="$input/reports/pascal-native/linux-$architecture.json"
            node tools/verify-linux-runtime-refresh.mjs "$runtime" "$proof" "$pascal"
            node tools/embed-linux-aot-runtime.mjs "$runtime" "$proof"
          done
      - name: Commit only generated runtimes with a branch-head lease
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {owner, repo} = context.repo;
            const branch = context.ref.replace(/^refs\/heads\//, '');
            if (!/^maint\/linux-runtime-[A-Za-z0-9_.-]+$/.test(branch)) throw new Error('Runtime refresh may not modify this branch');
            const ref = 'heads/' + branch;
            const head = (await github.rest.git.getRef({owner, repo, ref})).data.object.sha;
            if (head !== context.sha) throw new Error('Branch advanced; regenerate from its new head');
            const files = ['packages/linux-native/src/aot-runtime-payload.js', 'packages/linux-native/src/aot-runtime-arm64-payload.js'];
            const parent = (await github.rest.git.getCommit({owner, repo, commit_sha: head})).data;
            const entries = await Promise.all(files.map(async file => {
              const content = fs.readFileSync(file);
              if (content.length > 32 * 1024 * 1024) throw new Error('Runtime payload exceeds limit: ' + file);
              const blob = (await github.rest.git.createBlob({owner, repo, encoding:'base64', content:content.toString('base64')})).data;
              return {path:file, mode:'100644', type:'blob', sha:blob.sha};
            }));
            const tree = (await github.rest.git.createTree({owner, repo, base_tree:parent.tree.sha, tree:entries})).data;
            if (tree.sha === parent.tree.sha) {core.info('Verified runtimes already current'); return;}
            const commit = (await github.rest.git.createCommit({owner, repo, message:'build(linux): embed natively verified x64 and ARM64 runtimes', tree:tree.sha, parents:[head]})).data;
            if ((await github.rest.git.getRef({owner, repo, ref})).data.object.sha !== head) throw new Error('Branch advanced while preparing runtime commit');
            await github.rest.git.updateRef({owner, repo, ref, sha:commit.sha, force:false});
            core.notice('Runtimes committed as ' + commit.sha + '; exact-head validation is still required before merge.');
