name: Finalize compatibility integration
on:
  push:
    branches: [feat/variant-scalar-compatibility]
    paths: ['.github/workflows/compatibility-finalize.yml']
permissions:
  contents: read
concurrency:
  group: compatibility-reviewed-publish
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/variant-scalar-compatibility'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      head: ${{ steps.publish.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply complete reviewed native dispatch correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          git=lambda *a: subprocess.check_output(['git',*a],text=True).strip()
          base='49512c8ba5f1b078d87f25d75aecc244f9f0969a'
          assert git('diff','--name-only',base,'HEAD')=='.github/workflows/compatibility-finalize.yml'
          assert not git('status','--porcelain')
          patch=Path('.compat-review/native-dispatch.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='641f883b1b1bbefe810dc15ddf6fa9995157254f04330df4091349a49f7c70b9'
          subprocess.run(['git','apply','--index','--unidiff-zero','-'],input=patch,check=True)
          expected={'tests/native-automation-scalars.test.mjs','tools/interop/AutomationHost.cs','tools/interop/NativeDispatch.cs','tools/interop/NativeEnumeration.cs','tools/interop/automation-host.ps1','tools/interop/native-automation.mjs','tools/interop/test-native.mjs'}
          assert set(git('diff','--cached','--name-only').splitlines())==expected
          PY
      - name: Rebuild and test complete combined source
        run: |
          set -o pipefail
          mkdir -p compatibility-final-evidence
          node --check tools/interop/test-native.mjs
          npm run build 2>&1 | tee compatibility-final-evidence/build.log
          npm test 2>&1 | tee compatibility-final-evidence/node.log
          git rm -- .compat-review/native-dispatch.patch
          git add -- dist examples src/exporter/runtime-payload.js src/editor/diagnostics-payload.js
          git diff --cached --check
          git commit -m 'fix(interop): marshal native member IDs and preserve typed IEnumVARIANT values'
          npm run build
          git diff --exit-code -- dist examples src/exporter/runtime-payload.js src/editor/diagnostics-payload.js
      - name: Compare with independently tested product tree
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/compat-product-index"
          git read-tree HEAD
          git rm --cached -- .github/workflows/compatibility-finalize.yml
          test "$(git write-tree)" = 541c227088fb91feaaf2dcfaef6620a87e0caf2f
      - name: Publish only reviewed feature branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/compat-askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token ;; *) printf '%s\n' "$GH_TOKEN" ;; esac
          SH
          chmod 700 "$RUNNER_TEMP/compat-askpass"
          trap 'rm -f "$RUNNER_TEMP/compat-askpass"' EXIT
          GIT_ASKPASS="$RUNNER_TEMP/compat-askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/feat/variant-scalar-compatibility
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve source and outcomes
        if: always()
        run: |
          mkdir -p compatibility-final-evidence
          git rev-parse HEAD > compatibility-final-evidence/head.txt
          git diff --cached > compatibility-final-evidence/staged.diff
          git archive --format=zip --prefix=VB6/ HEAD -o compatibility-final-evidence/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-final-source
          path: compatibility-final-evidence/
          retention-days: 14
  windows:
    needs: integrate
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    env:
      VB6_COM_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Genuine native VARIANT and SAFEARRAY execution
        run: node tools/interop/test-native.mjs
      - name: Independent ActiveX lifecycle
        if: always()
        run: node tools/interop/test-activex.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-final-native-${{ matrix.arch }}
          path: reports/native-interop/
          retention-days: 14
