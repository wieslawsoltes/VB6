name: Native integration snapshot
on:
  push:
    branches: [feat/win32-standalone-webgpu]
    paths: [.github/workflows/native-integration.yml]
permissions:
  contents: write
concurrency:
  group: native-integration-refresh
  cancel-in-progress: false
jobs:
  source-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed, hash-checked native refinements
        run: |
          test "$(git rev-parse origin/feat/win32-standalone-webgpu)" = "$GITHUB_SHA"
          node tools/native-refine.mjs
          git rm tools/native-refine.mjs
      - run: npm run build
      - run: npm test
      - name: Commit validated source and generated bundles on the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/boot.mjs desktop/smoke.cjs src/graphics/surface.js src/runtime/native-windows.js tools/build-windows.mjs tools/native-fixtures.mjs dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git commit -m 'fix: validate native canvas readback and migrate GPU surfaces safely'
          git push origin HEAD:refs/heads/feat/win32-standalone-webgpu
      - run: git bundle create native-integration.bundle HEAD refs/remotes/origin/main
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-integration-history
          path: native-integration.bundle
          retention-days: 1
