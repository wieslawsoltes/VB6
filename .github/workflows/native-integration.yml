name: Native integration snapshot
on:
  push:
    branches: [feat/win32-standalone-webgpu]
    paths: [.github/workflows/native-integration.yml]
permissions:
  contents: write
jobs:
  source-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed source and lock packaging dependencies
        run: |
          test "$(git rev-parse origin/feat/win32-standalone-webgpu)" = "$GITHUB_SHA"
          node tools/native-finalize.mjs
          git rm tools/native-finalize.mjs
          npm --prefix desktop install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm run build && npm test
      - name: Commit reviewed source on the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop tools/build-classic.mjs tests/native-classic.test.mjs tests/native-gpu-probe.test.mjs dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git commit -m 'fix: enforce graphics policy and preserve classic ANSI paths; lock desktop tools'
          git push origin HEAD:refs/heads/feat/win32-standalone-webgpu
      - run: git bundle create native-integration.bundle HEAD refs/remotes/origin/main
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-integration-history
          path: native-integration.bundle
          retention-days: 1
