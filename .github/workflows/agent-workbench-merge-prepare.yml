name: Finish agent workbench integration
on:
  push:
    branches: [feat/agent-change-review-queue]
    paths: [.github/workflows/agent-workbench-merge-prepare.yml]
permissions:
  contents: write
concurrency:
  group: agent-workbench-merge-preparation
  cancel-in-progress: true
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/agent-change-review-queue'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and strengthen the native selection assertion
        shell: bash
        run: |
          git merge-base --is-ancestor 691238cceef370f98b003fd3b686ff2ae70eb212 HEAD
          test "$(git diff --name-only 691238cceef370f98b003fd3b686ff2ae70eb212 HEAD)" = .github/workflows/agent-workbench-merge-prepare.yml
          git rev-parse HEAD > publication-base.txt
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          p = Path('tools/coding-agents-browser-tests.py')
          assert subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip() == 'b8a8db57951d0d3c8e5c94231d339bd20e377678'
          source = p.read_text()
          old = "    tab(page,'Changes');check('modified' in page.get_by_label('Changed project documents',exact=True).inner_text())"
          new = """    tab(page,'Changes')
              documents=page.get_by_label('Changed project documents',exact=True)
              # Native select.innerText omits option labels in WebKit. Check the actual
              # selected option, not a browser-specific rendering of the select element.
              selected=documents.locator('option:checked')
              check(documents.locator('option').count()==1, 'Expected one changed source document')
              check(selected.count()==1 and selected.text_content()=='modified — Form1.frm', 'Expected the modified Form1 source selected')
              selection={'selectInnerText':documents.inner_text(),'selectedOptionText':selected.text_content()}
              check(modified!=original, 'Source must actually change before it can be restored')"""
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = "    return {'sourceRestoration':True,'normalUndo':True,'patchExport':True,'inertMarkup':True,'noProviderRequestsForReview':True}"
          new = "    return {'sourceRestoration':True,'normalUndo':True,'patchExport':True,'inertMarkup':True,'noProviderRequestsForReview':True,'selection':selection}"
          assert source.count(old) == 1
          p.write_text(source.replace(old, new))
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'aab63673dd6f44ceaa0dd4e1c472df5a1f7d0deb2b8e076d1d5871f530800d7d'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/coding-agents-browser-tests.py
          git diff --cached --check
          git commit -m 'test(agents): verify selected review option and retain restoration assertions'
      - name: Merge current main without discarding authored source
        shell: bash
        run: |
          test "$(git rev-parse 72dae4fa89e165f6f0dc0ba0aad5cb7615508ea3^{tree})" = 11ad30fd9f31dd20d136dae1a52ffa5e6c09ff64
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', '72dae4fa89e165f6f0dc0ba0aad5cb7615508ea3'])
          if result.returncode:
              conflicts = set(subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines())
              generated = {'dist/VB6-Studio-Web.html', 'dist/studio.js'}
              assert result.returncode == 1 and conflicts and conflicts <= generated, sorted(conflicts)
              subprocess.run(['git', 'checkout', '--ours', '--', *sorted(conflicts)], check=True)
              subprocess.run(['git', 'add', '--', *sorted(conflicts)], check=True)
          PY
      - name: Rebuild every generated distribution from combined source
        shell: bash
        run: npm run build | tee agent-workbench-build.log
      - name: Full Node suite on integrated source
        shell: bash
        run: npm test | tee agent-workbench-full-tests.log
      - name: Focused agent and relay tests
        shell: bash
        run: npm run test:agents | tee agent-workbench-tests.log
      - name: Remove temporary publisher and verify the exact feature diff
        shell: bash
        run: |
          git add -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples packages/win32-browser/dist
          git rm -- .github/workflows/agent-workbench-merge-prepare.yml
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '72dae4fa89e165f6f0dc0ba0aad5cb7615508ea3'], text=True).splitlines()
          assert paths
          allowed = {'README.md','dist/VB6-Studio-Web.html','dist/studio.js','dist/studio.css','docs/CODING-AGENT-WORKBENCH.md','docs/coding-agents.md','docs/CODING-AGENT-THREADS.md','src/agents/agent.js','src/agents/agents.css','src/agents/changes.js','src/agents/conversations.js','src/agents/followups.js','src/agents/studio.js','src/agents/workbench-view.js','tests/coding-agents-workbench.test.mjs','tools/coding-agents-browser-tests.py'}
          assert set(paths) <= allowed, paths
          print('\n'.join(paths))
          PY
          git commit -m 'build(agents): integrate tagged runtime main and rebuild reviewed workbench'
      - name: Publish the tested merge to the feature branch
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/feat/agent-change-review-queue | cut -f1)" = "$(cat publication-base.txt)"
          git push origin HEAD:feat/agent-change-review-queue
          git rev-parse HEAD > head.txt
          git rev-parse HEAD^{tree} > tree.txt
          git ls-files -z | xargs -0 sha256sum > tracked-SHA256SUMS.txt
          git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-workbench-integrated-validation
          path: |
            agent-workbench-build.log
            agent-workbench-full-tests.log
            agent-workbench-tests.log
            publication-base.txt
            head.txt
            tree.txt
            tracked-SHA256SUMS.txt
            source.tar.gz
          retention-days: 7
