name: MCP native workspace integration
on:
  push:
    branches: [feat/mcp-lifecycle-and-data]
    paths: ['.github/workflows/mcp-native-integration.yml']
permissions:
  contents: write
concurrency:
  group: mcp-final-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve concurrent native workspace source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          base='e54df2692a9bf976ad26a2a1314ed5f40a768053'
          main='f9842a02f5917ff0679178f27346a27ec38acb27'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed=={'.github/workflows/mcp-native-integration.yml'},changed
          result=subprocess.run(['git','merge','--no-commit','--no-ff',main])
          assert result.returncode in [0,1]
          conflicts=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          assert conflicts <= {'dist/VB6-Studio-Web.html','dist/studio.js'},conflicts
          PY
          npm run build
          npm test
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          test -z "$(git diff --name-only --diff-filter=U)"
          git -c core.whitespace=-blank-at-eof diff --cached --check
          git rm --cached .github/workflows/mcp-native-integration.yml
          mkdir -p reports
          git write-tree | tee reports/mcp-product-tree.txt
          git restore --staged --source=HEAD -- .github/workflows/mcp-native-integration.yml
          git commit -m 'merge: retain native workspace restoration and interoperability in MCP refinement'
          npm run build
          git diff --exit-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Validate actual external and embedded agent workflows
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          npm run test:mcp:browser
          npm run test:mcp:agent
          npm run test:agents:browser
      - name: Publish integration without force
        run: git push origin HEAD:refs/heads/feat/mcp-lifecycle-and-data
      - name: Retain exact source and validation
        if: always()
        run: git bundle create repository.bundle --all HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-native-integration-${{ github.sha }}
          retention-days: 7
          path: |
            repository.bundle
            reports
