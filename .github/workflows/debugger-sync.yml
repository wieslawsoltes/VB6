name: Integrate debugger with main
on:
  push:
    branches: [feat/vb6-debugger-runtime]
    paths: ['.github/workflows/debugger-sync.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/vb6-debugger-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge reviewed main and regenerate only build-output conflicts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          base='6d587b674f9116312661d3d474ff8833e3ebecbf'
          result=subprocess.run(['git','merge','--no-commit','--no-ff',base])
          if result.returncode:
              conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
              assert conflicts, 'Merge failed without resolvable generated-output conflicts'
              for path in conflicts:
                  assert path.startswith('dist/') or path in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js'], 'Source conflict requires review: '+path
              for path in conflicts:
                  subprocess.run(['git','checkout','--ours','--',path],check=True)
                  subprocess.run(['git','add','--',path],check=True)
          PY
      - run: npm test
      - run: npm run build
      - name: Record validated merge
        run: |
          git add -A
          git diff --cached --check
          git commit -m 'merge: integrate ADO batch recordsets with classic debugger and regenerate bundles'
          git archive --format=tar.gz HEAD > /tmp/debugger-integrated.tar.gz
          git rev-parse HEAD > /tmp/debugger-integrated.sha
          git push origin HEAD:refs/heads/feat/vb6-debugger-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debugger-integrated
          path: /tmp/debugger-integrated.*
          if-no-files-found: ignore
          retention-days: 3
