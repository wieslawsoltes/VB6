name: Reconcile native Date and current debugger
on:
  push:
    branches: [feat/win32-date-export]
    paths: [.github/workflows/date-current-main.yml]
permissions:
  contents: write
concurrency:
  group: date-current-main
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/win32-date-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge pinned main without discarding readable source conflicts
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          target=605fc10bcef483a52c9d50eddfd5ba5036eea04d
          git merge-base --is-ancestor 16c8ef706c525de141e1d5d547b3cf14b45beeea "$target"
          if ! git merge --no-commit --no-ff "$target"; then
            python3 - <<'PY'
          import subprocess
          paths=[p for p in subprocess.check_output(['git','diff','--name-only','--diff-filter=U','-z']).decode().split('\0') if p]
          if not paths: raise SystemExit('Merge failed without generated conflicts')
          for p in paths:
              if not (p.startswith('dist/') or p in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js']):
                  raise SystemExit('Readable source conflict requires review: '+p)
          for p in paths:
              subprocess.run(['git','checkout','--ours','--',p],check=True)
              subprocess.run(['git','add','--',p],check=True)
          PY
          fi
          npm run build
          npm test
          node tools/win32-date-fixtures.mjs
          node tools/win32-date-abi-fixtures.mjs
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m 'merge: retain current debugger and runtime with native Date export' -m 'Preserve pinned main 605fc10bcef483a52c9d50eddfd5ba5036eea04d and regenerate only generated conflicts. Build and test combined readable sources; actual Windows Date and independent reference execution remain required checks.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/feat/win32-date-export
