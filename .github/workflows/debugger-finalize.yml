name: Finalize debugger integration
on:
  push:
    branches: [feat/vb6-debugger-runtime]
    paths: ['.github/workflows/debugger-finalize.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/vb6-debugger-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate reviewed coding-agent commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          theirs='368fac5d9a9bad449fdcb5e49cc4cc1194ba88f0'
          base=subprocess.check_output(['git','merge-base','HEAD',theirs],text=True).strip()
          result=subprocess.run(['git','merge','--no-commit','--no-ff',theirs])
          if result.returncode:
              conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
              assert conflicts, 'Merge failed without resolvable conflicts'
              for path in conflicts:
                  assert path.startswith('dist/') or path in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js','package.json','.gitignore','README.md'], 'Source conflict requires review: '+path
              for path in conflicts:
                  if path.startswith('dist/') or path in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js']:
                      subprocess.run(['git','checkout','--ours','--',path],check=True)
                  elif path=='package.json':
                      a,b,c=[json.loads(subprocess.check_output(['git','show',ref+':'+path],text=True)) for ref in [base,'HEAD',theirs]]
                      def merge(old,left,right):
                          if left==right:return left
                          if left==old:return right
                          if right==old:return left
                          assert all(isinstance(v,dict) for v in [old,left,right]), 'Conflicting package field'
                          out={}
                          for key in left.keys()|right.keys():
                              if key not in old:
                                  assert key not in left or key not in right or left[key]==right[key], 'Conflicting new package field: '+key
                                  out[key]=left[key] if key in left else right[key]
                              else:
                                  assert key in left and key in right, 'Package field deletion requires review: '+key
                                  out[key]=merge(old[key],left[key],right[key])
                          return {key:out[key] for key in [*left,*[k for k in right if k not in left]]}
                      Path(path).write_text(json.dumps(merge(a,b,c),indent=2)+'\n')
                  else:
                      for ref in ['HEAD',theirs]:
                          stats=subprocess.check_output(['git','diff','--numstat',base,ref,'--',path],text=True).splitlines()
                          assert all(row.split('\t')[1]=='0' for row in stats), 'Only additive documentation merges are automatic'
                      files=[]
                      for index,ref in enumerate(['HEAD',base,theirs]):
                          file=Path('/tmp/debugger-merge-'+str(index));file.write_bytes(subprocess.check_output(['git','show',ref+':'+path]));files.append(str(file))
                      merged=subprocess.check_output(['git','merge-file','-p','--union',*files])
                      Path(path).write_bytes(merged)
                  subprocess.run(['git','add','--',path],check=True)
          PY
      - name: Synchronize debugger keyboard tests with modal teardown
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tools/browser-debugger-runtime.py');s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='909d4a8fdbe9a3e404995472f830debd75f65ba927746657afd9ef2637227923'
          s=s.replace('def screenshot(page, name):', "def dismiss_error_for_debugging(page):\n    dialog = error_dialog(page)\n    dialog.get_by_role('button', name='Debug', exact=True).click()\n    # Modal teardown restores focus asynchronously; shortcut input must target\n    # the editor, not an outgoing dialog or the isolated runtime frame.\n    dialog.wait_for(state='hidden')\n    page.wait_for_function('document.activeElement===vb6Studio.editor.input')\n\n\ndef screenshot(page, name):")
          s=s.replace("    error_dialog(page).get_by_role('button', name='Debug', exact=True).click()\n    page.keyboard.press('F5')", "    dismiss_error_for_debugging(page)\n    page.keyboard.press('F5')")
          old="    page.get_by_role('button', name='OK', exact=True).click()\n    page.keyboard.press('F5')"
          assert s.count(old)==1
          s=s.replace(old,"    page.get_by_role('button', name='OK', exact=True).click()\n    page.get_by_role('dialog').wait_for(state='hidden')\n    page.keyboard.press('F5')")
          assert hashlib.sha256(s.encode()).hexdigest()=='1ef937116b1e2923a83ae4dc4e0d8fbd2ec0053a9230bf1fcbcd938537b2880d'
          p.write_text(s)
          PY
      - run: npm test
      - run: npm run build
      - name: Commit validated integration and regenerated bundles
        run: |
          git add -A
          git diff --cached --check
          git commit -m 'merge: integrate coding agents with debugger and synchronize modal keyboard tests'
          git archive --format=tar.gz HEAD > /tmp/debugger-final.tar.gz
          git rev-parse HEAD > /tmp/debugger-final.sha
          git push origin HEAD:refs/heads/feat/vb6-debugger-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debugger-final
          path: /tmp/debugger-final.*
          if-no-files-found: ignore
          retention-days: 3
