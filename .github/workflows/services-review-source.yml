name: Win32 services final integration
on:
  push:
    branches: [feature/win32-common-services]
    paths: [.github/workflows/services-review-source.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve reviewed UI fidelity and portable bundle updates
        run: |
          set -euo pipefail
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git merge --no-commit --no-ff 728a9201806a4d455113867d2778c3262666a05b || true
          test -f .git/MERGE_HEAD
          python3 - <<'PY'
          import subprocess
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          allowed={'src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js'}
          assert all(p in allowed or p.startswith('dist/') for p in conflicts), conflicts
          PY
          npm run build
          node tools/win32-api-inventory.mjs
          git add README.md packages src tools dist examples .github/workflows/issue39.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          cp .git/index /tmp/services-product.index
          GIT_INDEX_FILE=/tmp/services-product.index git update-index --force-remove .github/workflows/services-review-source.yml
          test "$(GIT_INDEX_FILE=/tmp/services-product.index git write-tree)" = '0b678398d4615638a1371be4ce8c30038a072224'
      - name: Validate exact combined source and extracted package
        run: |
          set -euo pipefail
          npm test | tee /tmp/services-node-tests.txt
          npm run pack:win32-browser | tee /tmp/services-package-tests.txt
          git diff --exit-code
      - name: Publish only to unchanged feature branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/win32-common-services | cut -f1)" = "$EXPECTED_SHA"
          git commit -m 'fix(win32-services): retain latest classic UI fidelity in regenerated builds'
          git push origin HEAD:refs/heads/feature/win32-common-services
          git bundle create /tmp/services-final.bundle HEAD refs/remotes/origin/main
          git archive --format=zip HEAD -o /tmp/services-final-source.zip
          git rev-parse HEAD HEAD^{tree} > /tmp/services-final-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: services-final-integration
          path: |
            /tmp/services-final.bundle
            /tmp/services-final-source.zip
            /tmp/services-final-revision.txt
            /tmp/services-node-tests.txt
            /tmp/services-package-tests.txt
            release/vb6-win32-browser-*.tgz
          retention-days: 7
