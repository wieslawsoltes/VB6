name: Win32 services handle probe correction
on:
  push:
    branches: [feature/win32-common-services]
    paths: [.github/workflows/services-review-source.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified lifetime probes without changing implementation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tools/win32-services-contracts.mjs');s=p.read_text()
          old=" results['duplicate-close-source']=[moved,missing,closedError,k('SetEvent',copy),k('WaitForSingleObject',copy,0)];k('CloseHandle',copy);"
          new=""" // Windows may recycle the closed source's numeric value for the duplicate.
           // Compare object lifetime; the independent probe separately retains raw IDs.
           results['duplicate-close-source']=[moved,original===copy||(missing===0xffffffff&&closedError===6),k('SetEvent',copy),k('WaitForSingleObject',copy,0)];
           const closed=k('DuplicateHandle',processHandle,copy,0,0,0,0,1),afterClose=k('WaitForSingleObject',copy,0)>>>0;
           results['duplicate-close-only']=[closed,afterClose,w.lastError];"""
          assert s.count(old)==1;s=s.replace(old,new)
          assert hashlib.sha256(s.encode()).hexdigest()=='3ac869ea41bf9a798102945e511f204bf76d0c87fd5cde4d266eb625efb51f04'
          p.write_text(s)
          p=Path('tools/win32-services-oracle.ps1');s=p.read_text()
          old=' static readonly Dictionary<string,object> result=new Dictionary<string,object>();'
          assert s.count(old)==1;s=s.replace(old,' public static readonly Dictionary<string,object> HandleDiagnostics=new Dictionary<string,object>();\n'+old)
          old='''   uint missing=WaitForSingleObject(original,0);int error=Marshal.GetLastWin32Error();
             result["duplicate-close-source"]=new object[]{moved,missing,error,SetEvent(copy),WaitForSingleObject(copy,0)};'''
          new='''   uint missing=WaitForSingleObject(original,0);int error=missing==uint.MaxValue?Marshal.GetLastWin32Error():0;
             // Handle numbers can be recycled, including for the returned duplicate.
             // Preserve raw evidence, but compare lifetime rather than numeric identity.
             HandleDiagnostics["close-source"]=new object[]{original.ToInt64(),copy.ToInt64(),original==copy,missing,error};
             result["duplicate-close-source"]=new object[]{moved,original==copy||(missing==uint.MaxValue&&error==6),SetEvent(copy),WaitForSingleObject(copy,0)};
             IntPtr ignored;int closed=DuplicateHandle(GetCurrentProcess(),copy,IntPtr.Zero,out ignored,0,0,1);
             if(closed==0)throw new Exception("Close-only duplicate failed");
             uint afterClose=WaitForSingleObject(copy,0);int closeError=afterClose==uint.MaxValue?Marshal.GetLastWin32Error():0;copy=IntPtr.Zero;
             result["duplicate-close-only"]=new object[]{closed,afterClose,closeError};'''
          assert s.count(old)==1;s=s.replace(old,new)
          assert s.count('  result.Clear();')==1;s=s.replace('  result.Clear();','  result.Clear();HandleDiagnostics.Clear();')
          s+='[ServiceOracle]::HandleDiagnostics | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 reports/win32-services-native/handle-diagnostics.json\n'
          assert hashlib.sha256(s.encode()).hexdigest()=='f76cd43ae6f4183e0a2a9ef5e3b819cbe588107300071ae3f56f1694cad4b631'
          p.write_text(s)
          PY
          git add tools/win32-services-contracts.mjs tools/win32-services-oracle.ps1
          cp .git/index /tmp/services-product.index
          GIT_INDEX_FILE=/tmp/services-product.index git update-index --force-remove .github/workflows/services-review-source.yml
          test "$(GIT_INDEX_FILE=/tmp/services-product.index git write-tree)" = 'ab2157afb11a6fab517314b3c9fb21fca99d8545'
          node tools/win32-services-contracts.mjs > /tmp/services-probe.json
          git diff --check --cached
      - name: Publish only the reviewed probe changes to unchanged branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/win32-common-services | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'test(win32-services): distinguish recycled handle values from source lifetime'
          git push origin HEAD:refs/heads/feature/win32-common-services
