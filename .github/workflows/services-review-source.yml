name: Win32 services reviewed integration
on:
  push:
    branches: [feature/win32-common-services]
    paths: [.github/workflows/services-review-source.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feature/win32-common-services'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild the pinned, independently tested source combination
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = 'b745fe01cf12d189e7a258189fe0c2a0e230ec5c'
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff b6f623d5c9e55efd4f2da39c5b22e0a609427491
          code=$?
          set -e
          test "$code" -le 1
          test "$(git rev-parse MERGE_HEAD)" = 'b6f623d5c9e55efd4f2da39c5b22e0a609427491'
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          allowed=lambda p:p.startswith('dist/') or p in ('src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js')
          if not all(allowed(p) for p in paths):
              raise SystemExit('Authored conflict requires review: '+repr(paths))
          PY
          npm run build
          git rm .github/workflows/services-review-source.yml
          git add dist examples src/exporter/runtime-payload.js src/editor/diagnostics-payload.js packages/win32-browser/dist
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          test "$(git write-tree)" = 'd26ff87e71719f57c0071566c6aec39d530ee44c'
          npm test > /tmp/win32-services-node.log 2>&1
          tail -12 /tmp/win32-services-node.log
          npm run pack:win32-browser > /tmp/win32-services-package.log 2>&1
          tail -12 /tmp/win32-services-package.log
          npm run build
          git diff --exit-code
          test "$(git write-tree)" = 'd26ff87e71719f57c0071566c6aec39d530ee44c'
          printf '%s  %s\n' 'e48a8f2066b94a033ffb85b3b6acb1b70fcaecf40bc9eab247be73aa03be38f3' 'release/vb6-win32-browser-0.5.0.tgz' | sha256sum --check
      - name: Commit and publish only the unchanged PR branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/win32-common-services | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 'b6f623d5c9e55efd4f2da39c5b22e0a609427491'
          git commit -m 'Merge current main into Win32 services and rebuild verified distributions' -m 'Preserve OCX, native debugger, String ABI, agent recovery and visual fixes. Product tree d26ff87e71719f57c0071566c6aec39d530ee44c passes complete Node and extracted-package suites. Final ordinary PR validation remains required. Remove the temporary integration workflow.'
          git rev-parse HEAD HEAD^{tree} > /tmp/win32-services-revision.txt
          git bundle create /tmp/win32-services-integrated.bundle HEAD refs/remotes/origin/main
          git archive --format=zip HEAD -o /tmp/win32-services-integrated.zip
          git push origin HEAD:refs/heads/feature/win32-common-services
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-services-reviewed-integration
          path: |
            /tmp/win32-services-node.log
            /tmp/win32-services-package.log
            /tmp/win32-services-revision.txt
            /tmp/win32-services-integrated.bundle
            /tmp/win32-services-integrated.zip
            release/vb6-win32-browser-0.5.0.tgz
          retention-days: 7
