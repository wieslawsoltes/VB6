name: OCX regression publication
on:
  push:
    branches: [feat/ocx-hosting-lifecycle]
permissions:
  contents: read
concurrency:
  group: ocx-regression-publication
  cancel-in-progress: true
jobs:
  publish:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/ocx-hosting-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce reviewed and locally tested changes
        run: |
          python .ocx-regression-fix.py
          npm run build
          git add desktop/smoke.cjs tools/browser-intellisense-tests.py tools/browser-native-build-tests.py tests/native-smoke-evaluation.test.mjs
          git rm --cached .ocx-regression-fix.py .github/workflows/ocx-regression-publication.yml
          test "$(git write-tree)" = 133c9719085b54dac5cb42b03ff74637c369abb7
          git diff --cached --check
          git restore --source=HEAD --staged .github/workflows/ocx-regression-publication.yml
          rm .ocx-regression-fix.py
      - run: npm test
      - name: Commit validated source without modifying workflow authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ocx): stabilize native smoke lifetime and browser regression synchronization'
          git rev-parse HEAD HEAD^{tree} > ocx-regression-publication.txt
          git bundle create ocx-regression-publication.bundle HEAD
          git push origin HEAD:refs/heads/feat/ocx-hosting-lifecycle
      - uses: actions/upload-artifact@v4
        with:
          name: ocx-regression-publication
          path: |
            ocx-regression-publication.txt
            ocx-regression-publication.bundle
          retention-days: 7
