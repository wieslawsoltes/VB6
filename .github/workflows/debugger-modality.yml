name: Debugger modal isolation integration
on:
  push:
    branches: [feat/vb6-debugger-runtime]
    paths: ['.github/workflows/debugger-modality.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/vb6-debugger-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for rendered modal before injecting pointer input
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tools/browser-debugger-runtime.py');s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='c915d92f7ff6e84f9af1c443d25f7b0a7192ddd04695079348e5a8f529949d26'
          old='    dialog.wait_for()\n    return dialog'
          new="    dialog.wait_for()\n    # Give the compositor a completed frame after hiding the cross-origin iframe;\n    # DOM visibility alone does not synchronize headless Chromium's OOPIF hit test.\n    page.evaluate('()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))')\n    return dialog"
          assert s.count(old)==1
          s=s.replace(old,new)
          assert hashlib.sha256(s.encode()).hexdigest()=='1b3201ec340377395422946a5bb4a2bcb4636cb9c70727d853a0e1f3d10fabee'
          p.write_text(s)
          PY
      - run: npm test
      - run: npm run build
      - name: Verify generated output is unchanged and commit test synchronization
        run: |
          git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/browser-debugger-runtime.py
          git diff --cached --check
          git commit -m 'test: synchronize error-dialog clicks with compositor frame completion'
          git push origin HEAD:refs/heads/feat/vb6-debugger-runtime
