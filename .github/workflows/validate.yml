name: Validate
on:
  push:
    branches: [main, feat/detached-browser-windows]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Archive exact source
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: source.tar
          retention-days: 7
      - run: npm run build
      - run: npm test
