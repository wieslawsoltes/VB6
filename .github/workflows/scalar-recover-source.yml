name: Recover scalar source objects
# Integration baseline: a344a8fa8d667adbd934e595dd618836930b2120
on:
  push:
    branches: [feat/variant-scalar-compatibility]
    paths: ['.github/workflows/scalar-recover-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact integrated history
        run: |
          mkdir recovery
          git bundle create recovery/repository.bundle --all HEAD
          git show-ref > recovery/refs.txt
          git bundle verify recovery/repository.bundle
          sha256sum recovery/repository.bundle > recovery/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-scalar-source
          path: recovery/
          retention-days: 7
