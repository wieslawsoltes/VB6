name: WebGPU compute backend
on:
  push:
    branches: [feature/vb6-webgpu-compute]
  pull_request:
    paths: ['packages/vb6-compute/**', 'src/compute/**', 'tests/compute*', 'tools/*compute*', '.github/workflows/compute.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compute-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact source snapshot
        run: git archive --format=zip --output=compute-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: compute-source-${{ github.sha }}
          path: compute-source.zip
          retention-days: 7
      - name: Existing build and regressions
        run: npm run build && npm test
