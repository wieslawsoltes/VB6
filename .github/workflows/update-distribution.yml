name: Update bundled distribution
on:
  workflow_dispatch:
  # Refresh combined bundles after integrating the concurrent main update.
  push:
    branches: [feat/mcp-browser-and-local]
    paths: ['.github/workflows/update-distribution.yml']
permissions:
  contents: write
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build && npm test
      - name: Commit only generated distribution files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh standalone and hosted distribution'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
